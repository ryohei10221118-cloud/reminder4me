<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Reminder4ME</title>
  <style>
    :root {
      --bg:           #f0ebe4;
      --surface:      #faf8f5;
      --surface2:     #ede8e0;
      --border:       #ddd5c8;
      --border-light: #ece6de;
      --text-pri:     #4a4238;
      --text-sec:     #8a7d72;
      --text-muted:   #b5a99e;
      --blue:         #8facc8;
      --blue-light:   #c5d5e8;
      --blue-bg:      rgba(143,172,200,0.12);
      --orange:       #c4956a;
      --orange-bg:    rgba(196,149,106,0.12);
      --red:          #c47878;
      --red-bg:       rgba(196,120,120,0.12);
      --green:        #7aab8a;
      --green-bg:     rgba(122,171,138,0.12);
      --green-border: rgba(122,171,138,0.4);
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang TC', sans-serif;
      background: var(--bg);
      color: var(--text-pri);
      min-height: 100vh;
    }

    /* ── Header ── */
    .header {
      background: var(--surface);
      border-bottom: 1px solid var(--border);
      padding: 10px 16px;
      display: flex;
      flex-wrap: nowrap;
      align-items: center;
      gap: 12px;
      position: sticky;
      top: 0;
      z-index: 10;
    }
    .header h1 { font-size: 15px; font-weight: 700; color: var(--text-pri); }
    .header-badge {
      background: var(--red);
      color: #fff;
      border-radius: 10px;
      font-size: 11px;
      font-weight: 700;
      padding: 2px 8px;
      min-width: 22px;
      text-align: center;
      display: none;
    }
    .header-badge.show { display: inline-block; }
    .notification-btn {
      padding: 0 12px;
      height: 30px;
      background: var(--surface2);
      border: 1px solid var(--border);
      border-radius: 6px;
      color: var(--text-sec);
      font-size: 12px;
      cursor: pointer;
      white-space: nowrap;
      flex-shrink: 0;
    }
    .notification-btn.granted { color: var(--green); border-color: var(--green-border); }
    .agent-name-input {
      padding: 0 12px;
      height: 30px;
      border: 1px solid var(--border);
      border-radius: 6px;
      background: var(--surface2);
      color: var(--text-pri);
      font-size: 12px;
      width: 100px;
      outline: none;
      box-sizing: border-box;
      flex-shrink: 0;
    }
    .agent-name-input:focus { border-color: var(--blue-light); background: var(--surface); }
    .agent-name-input::placeholder { color: var(--text-muted); }

    /* ── Layout ── */
    .container { max-width: 1020px; margin: 0 auto; padding: 16px 20px; }
    .main-layout { display: grid; grid-template-columns: 360px 1fr; gap: 20px; align-items: start; }
    .right-col { min-width: 0; }
    @media (max-width: 720px) { .main-layout { grid-template-columns: 1fr; } }

    /* ── Back to top ── */
    .back-to-top {
      position: fixed;
      bottom: 24px;
      right: 20px;
      width: 40px;
      height: 40px;
      border-radius: 50%;
      background: var(--blue);
      color: #fff;
      border: none;
      font-size: 18px;
      cursor: pointer;
      box-shadow: 0 4px 16px rgba(143,172,200,0.4);
      display: none;
      align-items: center;
      justify-content: center;
      z-index: 900;
      transition: opacity 0.2s;
    }
    .back-to-top.show { display: flex; }
    .back-to-top:hover { background: #7a9ab8; }

    /* ── Form card ── */
    .form-card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 14px;
      margin-bottom: 16px;
    }
    .form-title {
      font-size: 11px;
      font-weight: 700;
      color: var(--text-muted);
      text-transform: uppercase;
      letter-spacing: 0.8px;
      margin-bottom: 12px;
      display: flex; align-items: center; justify-content: space-between;
    }
    .btn-clear-form {
      font-size: 11px; font-weight: 500; text-transform: none; letter-spacing: 0;
      color: var(--text-muted); background: none; border: none; cursor: pointer;
      padding: 2px 6px; border-radius: 5px; transition: color 0.15s, background 0.15s;
    }
    .btn-clear-form:hover { color: var(--red); background: var(--red-bg); }
    .form-group { display: flex; flex-direction: column; gap: 5px; margin-bottom: 10px; }
    .form-group:last-child { margin-bottom: 0; }
    .form-group label { font-size: 12px; color: var(--text-sec); }
    .form-group input, .form-group textarea {
      background: var(--surface2);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 7px 10px;
      color: var(--text-pri);
      font-size: 13px;
      outline: none;
      transition: border-color 0.18s;
      width: 100%;
      font-family: inherit;
    }
    .form-group textarea { resize: vertical; min-height: 60px; }
    .form-group input:focus, .form-group textarea:focus { border-color: var(--blue); }
    .form-group input::placeholder, .form-group textarea::placeholder { color: var(--text-muted); }

    /* ── Group blocks ── */
    .group-list { display: flex; flex-direction: column; gap: 10px; margin-bottom: 10px; }
    .group-block {
      background: var(--surface2);
      border: 1px solid var(--border-light);
      border-radius: 10px;
      padding: 12px 14px;
    }
    .group-block-header {
      display: flex;
      align-items: center;
      gap: 8px;
      margin-bottom: 8px;
    }
    .group-block-label { font-size: 11px; font-weight: 700; color: var(--text-muted); flex: 1; }
    .btn-remove-group {
      background: transparent;
      border: none;
      color: var(--text-muted);
      font-size: 17px;
      cursor: pointer;
      padding: 0 2px;
      line-height: 1;
    }
    .btn-remove-group:hover { color: var(--red); }
    .order-rows { display: flex; flex-direction: column; gap: 6px; margin-top: 6px; }
    .order-row { display: flex; gap: 6px; align-items: center; }
    .order-row input { flex: 1; }
    .event-bet-hint { font-size: 11px; color: var(--text-muted); padding: 2px 2px 3px; line-height: 1.4; }
    .btn-remove-order {
      background: transparent;
      border: none;
      color: var(--text-muted);
      font-size: 17px;
      cursor: pointer;
      padding: 0 3px;
      flex-shrink: 0;
      line-height: 1;
    }
    .btn-remove-order:hover { color: var(--red); }
    .btn-add-inline {
      flex-shrink: 0;
      width: 22px;
      height: 22px;
      border-radius: 50%;
      border: 1px solid var(--blue-light);
      background: var(--blue-bg);
      color: var(--blue);
      font-size: 15px;
      line-height: 1;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 0;
    }
    .btn-add-inline:hover { background: rgba(143,172,200,0.25); }
    .btn-add-group {
      width: 100%;
      padding: 9px;
      font-size: 13px;
      color: var(--blue);
      background: var(--blue-bg);
      border: 1px dashed var(--blue-light);
      border-radius: 8px;
      cursor: pointer;
      margin-bottom: 14px;
    }
    .btn-add-group:hover { background: rgba(143,172,200,0.2); }
    .btn-import-json {
      padding: 9px 14px; font-size: 13px; white-space: nowrap;
      color: var(--orange); background: var(--orange-bg);
      border: 1px dashed rgba(196,149,106,0.5); border-radius: 8px; cursor: pointer;
    }
    .btn-import-json:hover { background: rgba(196,149,106,0.2); }

    /* ── Requirement combobox ── */
    .req-combobox { position: relative; display: flex; gap: 6px; align-items: center; }
    .req-input-row { display: contents; }
    .req-input {
      flex: 1; padding: 8px 12px; border: 1px solid var(--border); border-radius: 8px;
      background: var(--surface2); font-size: 13px; color: var(--text-pri); outline: none;
      transition: border-color 0.15s, background 0.15s;
    }
    .req-input:focus { border-color: var(--blue-light); background: var(--surface); }
    .req-toggle {
      flex-shrink: 0; width: 32px; height: 32px;
      border: 1px solid var(--border); border-radius: 8px; background: var(--surface2);
      cursor: pointer; color: var(--text-sec);
      display: flex; align-items: center; justify-content: center;
      transition: all 0.15s;
    }
    .req-toggle:hover { background: var(--blue-bg); color: var(--blue); border-color: var(--blue-light); }
    .req-dropdown {
      position: absolute; top: calc(100% + 4px); left: 0; right: 38px;
      background: var(--surface); border: 1px solid var(--border);
      border-radius: 8px; box-shadow: 0 4px 16px rgba(0,0,0,0.1);
      z-index: 50; overflow: hidden; max-height: 200px; overflow-y: auto;
    }
    .grp-dropdown {
      position: absolute; top: calc(100% + 4px); left: 0; right: 0;
      background: var(--surface); border: 1px solid var(--border);
      border-radius: 8px; box-shadow: 0 4px 16px rgba(0,0,0,0.1);
      z-index: 50; overflow: hidden; max-height: 200px; overflow-y: auto;
    }
    .req-option {
      padding: 9px 14px; font-size: 13px; cursor: pointer; color: var(--text-pri);
    }
    .req-option:hover, .req-option.highlighted { background: var(--blue-bg); color: var(--blue); }
    .grp-dropdown .req-option { display: flex; align-items: center; gap: 6px; }
    .grp-drop-label { flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .grp-drop-del { background: none; border: none; cursor: pointer; font-size: 14px; color: var(--text-muted); padding: 0 2px; line-height: 1; flex-shrink: 0; opacity: 0; transition: opacity 0.15s; }
    .grp-dropdown .req-option:hover .grp-drop-del, .grp-dropdown .req-option.highlighted .grp-drop-del { opacity: 1; }
    .grp-drop-del:hover { color: var(--red) !important; }
    .req-option-hint { font-size: 11px; color: var(--text-muted); margin-top: 1px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .gear-btn { background: none; border: none; cursor: pointer; font-size: 13px; color: var(--text-muted); padding: 0; line-height: 1; }
    .gear-btn:hover { color: var(--text-sec); }

    /* ── Presets gear modal ── */
    .preset-modal-overlay {
      position: fixed; inset: 0; background: rgba(0,0,0,0.25);
      display: flex; align-items: center; justify-content: center; z-index: 200;
    }
    .preset-modal {
      background: var(--surface); border: 1px solid var(--border); border-radius: 12px;
      padding: 20px; width: 400px; max-width: 92vw;
      box-shadow: 0 8px 32px rgba(0,0,0,0.12);
    }
    .preset-list-scroll { max-height: 280px; overflow-y: auto; padding-right: 2px; margin-bottom: 2px; }
    .preset-row {
      display: flex; align-items: center; gap: 6px; padding: 6px 8px;
      background: var(--surface2); border: 1px solid var(--border); border-radius: 8px; margin-bottom: 6px;
      cursor: default;
    }
    .preset-row.drag-over { border-color: var(--blue-light); background: var(--blue-bg); }
    .preset-bet-toggle {
      display: flex; align-items: center; gap: 3px; flex-shrink: 0;
      font-size: 11px; color: var(--text-muted); cursor: pointer; user-select: none;
      white-space: nowrap;
    }
    .preset-bet-toggle input { accent-color: var(--blue); cursor: pointer; margin: 0; }
    .preset-bet-toggle:has(input:checked) { color: var(--blue); }
    .preset-drag-handle {
      cursor: grab; color: var(--text-muted); font-size: 14px; flex-shrink: 0;
      padding: 0 2px; line-height: 1; user-select: none;
    }
    .preset-drag-handle:active { cursor: grabbing; }
    .preset-edit-input {
      border: 1px solid transparent; border-radius: 5px; background: transparent;
      font-size: 12px; color: var(--text-pri); outline: none; padding: 2px 5px;
      transition: border-color 0.15s, background 0.15s;
    }
    .preset-edit-input:hover { border-color: var(--border); background: var(--surface); }
    .preset-edit-input:focus { border-color: var(--blue-light); background: var(--surface); }
    .preset-edit-label { width: 62px; flex-shrink: 0; font-weight: 700; color: var(--text-sec); }
    .preset-edit-value { flex: 1; color: var(--text-muted); min-width: 0; }
    .btn-del-preset { background: none; border: none; cursor: pointer; color: var(--text-muted); font-size: 15px; padding: 0 2px; flex-shrink: 0; }
    .btn-del-preset:hover { color: var(--red); }
    .preset-add-grid { display: grid; grid-template-columns: 80px 1fr auto; gap: 6px; margin-top: 8px; }
    .preset-add-input {
      padding: 7px 10px; border: 1px solid var(--border); border-radius: 7px;
      background: var(--surface2); font-size: 12px; color: var(--text-pri); outline: none;
    }
    .preset-add-input:focus { border-color: var(--blue-light); }
    .json-event-item {
      display: flex; align-items: flex-start; gap: 10px;
      padding: 8px 10px; border-radius: 8px; cursor: pointer;
      border: 1px solid var(--border); background: var(--surface2); margin-bottom: 6px;
    }
    .json-event-item.is-opened { background: var(--blue-bg); border-color: var(--blue-light); }
    .json-event-item:hover { background: var(--blue-bg); border-color: var(--blue-light); }
    .json-event-item input[type=checkbox] { margin-top: 2px; accent-color: var(--blue); flex-shrink: 0; }
    .json-event-name { font-size: 13px; font-weight: 600; color: var(--text-pri); }
    .json-event-time { font-size: 11px; color: var(--text-sec); margin-left: auto; white-space: nowrap; flex-shrink: 0; }
    .json-bet-line { font-size: 12px; color: var(--text-pri); margin-top: 3px; }
    .json-score-line { font-size: 12px; color: var(--text-sec); margin-top: 1px; }
    .shared-fields { display: flex; flex-direction: column; gap: 0; margin-bottom: 14px; }
    .btn-submit {
      width: 100%;
      padding: 11px;
      background: var(--blue);
      color: #fff;
      border: none;
      border-radius: 8px;
      font-size: 14px;
      font-weight: 700;
      cursor: pointer;
      transition: background 0.18s, transform 0.1s;
    }
    .btn-submit:hover { background: #7a9ab8; }
    .btn-submit:active { transform: scale(0.98); }
    .lang-select-group { display: flex; gap: 6px; }
    .lang-sel-btn {
      flex: 1; padding: 6px 0; border-radius: 6px; font-size: 12px; font-weight: 600;
      border: 1px solid var(--border); background: var(--surface2); color: var(--text-muted);
      cursor: pointer; transition: all 0.15s;
    }
    .lang-sel-btn:hover { border-color: var(--blue); color: var(--blue); }
    .lang-sel-btn.active { background: var(--blue); border-color: var(--blue); color: #fff; }

    /* ── Section header ── */
    .section-header {
      display: flex;
      align-items: center;
      gap: 8px;
      margin-bottom: 12px;
    }
    .export-btn {
      margin-left: auto;
      padding: 4px 10px;
      background: var(--surface2);
      border: 1px solid var(--border);
      border-radius: 6px;
      font-size: 11px;
      color: var(--text-sec);
      cursor: pointer;
    }
    .export-btn:hover { background: var(--blue-bg); border-color: var(--blue-light); color: var(--blue); }
    .section-title {
      font-size: 12px;
      font-weight: 700;
      color: var(--text-muted);
      text-transform: uppercase;
      letter-spacing: 0.8px;
    }
    .count-badge {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      background: var(--red);
      color: #fff;
      border-radius: 10px;
      font-size: 11px;
      font-weight: 700;
      padding: 2px 7px;
      min-width: 22px;
    }
    .count-badge.gray { background: var(--surface2); color: var(--text-sec); border: 1px solid var(--border); }

    /* ── Batch group ── */
    .batch-group { display: flex; flex-direction: column; gap: 0; margin-bottom: 14px; border: 1.5px solid var(--border); border-radius: 12px; overflow: hidden; background: var(--surface2); }
    .batch-group-header { border-radius: 0; border: none; border-bottom: 1px solid var(--border); }
    .batch-group .record-card { border-radius: 0; border: none; border-bottom: 1px solid var(--border-light); margin: 0; }
    .batch-group .record-card:last-child { border-bottom: none; }
    .batch-group-header {
      display: flex; align-items: center; gap: 8px;
      padding: 6px 10px; background: var(--surface2);
      border: 1px solid var(--border); border-radius: 8px;
      flex-wrap: wrap;
    }
    .batch-group-label { font-size: 12px; font-weight: 700; color: var(--text-sec); }
    .batch-group-count { font-size: 11px; color: var(--text-muted); background: var(--bg); border: 1px solid var(--border-light); border-radius: 10px; padding: 1px 7px; }
    .batch-group-actions { display: flex; gap: 6px; align-items: center; margin-left: auto; flex-wrap: wrap; }
    .batch-bar-count { font-size: 12px; color: var(--blue); font-weight: 600; }
    .batch-cb {
      width: 16px; height: 16px; flex-shrink: 0; cursor: pointer;
      accent-color: var(--blue); margin-right: 2px;
    }
    .batch-card .card-header { display: flex; align-items: flex-start; gap: 8px; }
    .card-selected { outline: 2px solid var(--blue-light); }
    .batch-bar-btn {
      padding: 4px 10px; border-radius: 6px; font-size: 11px; font-weight: 600;
      cursor: pointer; border: 1px solid; white-space: nowrap;
    }
    .batch-bar-done    { background: var(--green-bg);  border-color: var(--green-border); color: var(--green); }
    .batch-bar-restart { background: var(--orange-bg); border-color: rgba(196,149,106,0.4); color: var(--orange); }
    .batch-bar-msg     { background: var(--surface);   border-color: var(--border); color: var(--text-sec); }
    .batch-bar-btn[disabled] { opacity: 0.35; cursor: default; }
    .batch-msg-item { margin-bottom: 10px; }
    .batch-msg-label { font-size: 12px; font-weight: 600; color: var(--text-sec); margin-bottom: 4px; }

    /* ── Record card ── */
    .record-card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 8px;
      margin-bottom: 6px;
      overflow: hidden;
      transition: border-color 0.3s;
    }
    .record-card.warn  { border-color: var(--orange); }
    .record-card.alert { border-color: var(--red); background: rgba(196,120,120,0.04); }
    .card-header {
      display: flex;
      align-items: stretch;
      padding: 7px 10px 6px;
      border-bottom: 1px solid var(--border-light);
      gap: 6px;
    }
    .card-events { display: flex; flex-direction: column; flex: 1; gap: 3px; min-width: 0; }
    .card-event-row { display: flex; align-items: center; gap: 5px; }
    .card-event-name {
      flex: 1;
      font-size: 12px;
      font-weight: 700;
      color: var(--text-pri);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      cursor: pointer;
    }
    .card-event-name:hover { color: var(--blue); }
    .card-event-name.copied { color: var(--green); }
    .card-event-name.dup { background: #fef3c7; color: #b45309; border-radius: 3px; padding: 0 3px; }
    .card-event-name.dup:hover { color: #92400e; }
    .card-event-name.dup.copied { background: var(--green-bg); color: var(--green); }
    .card-event-name.settled { color: var(--text-muted); text-decoration: line-through; }
    .card-event-name.settled:hover { color: var(--text-muted); }
    .btn-event-settle {
      background: none; border: 1px solid var(--border); border-radius: 4px;
      font-size: 11px; padding: 2px 5px; cursor: pointer; color: var(--text-muted);
      flex-shrink: 0; line-height: 1; transition: all 0.15s;
    }
    .btn-event-settle:hover { border-color: var(--green); color: var(--green); }
    .btn-event-settle.settled { border-color: var(--green); color: var(--green); background: var(--green-bg); }
    .btn-msg {
      padding: 4px 10px;
      background: var(--surface2);
      border: 1px solid var(--border);
      border-radius: 6px;
      font-size: 12px;
      color: var(--text-sec);
      cursor: pointer;
      flex-shrink: 0;
    }
    .btn-msg:hover { background: var(--border-light); }
    .card-body {
      display: flex;
      align-items: flex-start;
      gap: 8px;
      padding: 8px 10px 10px;
    }

    /* ── Timer box ── */
    .timer-box {
      width: 58px;
      min-width: 58px;
      height: 50px;
      border-radius: 10px;
      border: 2px solid var(--border);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 1px;
      transition: border-color 0.3s, background 0.3s;
      flex-shrink: 0;
    }
    .timer-box .t-time {
      font-size: 14px;
      font-weight: 800;
      line-height: 1;
      font-variant-numeric: tabular-nums;
    }
    .timer-box .t-stage { font-size: 10px; font-weight: 600; letter-spacing: 0.3px; }
    .timer-box.normal { border-color: var(--blue); background: var(--blue-bg); }
    .timer-box.normal .t-time { color: var(--blue); }
    .timer-box.normal .t-stage { color: var(--blue); }
    .timer-box.warn   { border-color: var(--orange); background: var(--orange-bg); }
    .timer-box.warn   .t-time { color: var(--orange); }
    .timer-box.warn   .t-stage { color: var(--orange); }
    .timer-box.alert  { border-color: var(--red); background: var(--red-bg); }
    .timer-box.alert  .t-time { color: var(--red); }
    .timer-box.alert  .t-stage { color: var(--red); }
    .timer-box.expired { border-color: var(--red); background: var(--red-bg); animation: blink 1s infinite; }
    .timer-box.expired .t-time { color: var(--red); font-size: 11px; }
    .timer-box.expired .t-stage { color: var(--red); }
    @keyframes blink { 0%,100% { opacity:1; } 50% { opacity:0.45; } }

    /* ── Record info ── */
    .record-info { flex: 1; min-width: 0; }
    .order-tags { display: flex; flex-wrap: wrap; gap: 5px; margin-bottom: 6px; }
    .order-tag {
      display: inline-flex;
      align-items: center;
      background: var(--blue-bg);
      border: 1px solid var(--blue-light);
      border-radius: 5px;
      padding: 2px 7px;
      font-size: 12px;
      color: var(--blue);
      font-weight: 600;
      cursor: pointer;
      transition: background 0.15s;
    }
    .order-tag:hover { background: rgba(143,172,200,0.22); }
    .order-tag.copied { background: var(--green-bg); color: var(--green); border-color: var(--green-border); }
    .record-req {
      font-size: 12px;
      color: var(--text-pri);
      font-weight: 600;
      margin-bottom: 2px;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .record-meta { font-size: 12px; color: var(--text-sec); line-height: 1.6; }
    .record-meta b { color: var(--text-pri); font-weight: 600; }
    .record-meta-note {
      overflow: hidden; display: -webkit-box;
      -webkit-line-clamp: 2; -webkit-box-orient: vertical;
    }
    .bet-info-block { margin-top: 6px; padding-top: 6px; border-top: 1px solid var(--border-light); }
    .bet-league-line { font-size: 11px; color: var(--text-muted); font-weight: 600; margin-bottom: 2px; }
    .bet-info-row { display: flex; align-items: flex-start; gap: 6px; justify-content: space-between; }
    .bet-info-line {
      font-size: 12px; color: var(--text-pri); line-height: 1.5; flex: 1; min-width: 0;
      overflow: hidden; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical;
    }
    .bet-status-badge { font-size: 11px; font-weight: 700; white-space: nowrap; flex-shrink: 0; padding-top: 2px; }
    .bet-score-line { font-size: 12px; color: var(--text-sec); margin-top: 1px; }
    .bet-time-line  { font-size: 11px; color: var(--text-muted); margin-top: 3px; }
    .header-search-wrap { display: flex; align-items: center; gap: 3px; flex-shrink: 1; min-width: 0; }
    .header-search-input { width: 180px; padding: 0 10px; font-size: 12px; height: 30px; box-sizing: border-box; border: 1px solid var(--border); border-radius: 6px; background: var(--surface2); color: var(--text-pri); outline: none; }
    .header-search-input:focus { border-color: var(--blue); background: var(--surface); }
    .header-search-input::placeholder { color: var(--text-muted); }
    .search-clear-btn { background: none; border: none; font-size: 15px; color: var(--text-muted); cursor: pointer; padding: 0 3px; line-height: 1; }
    .search-clear-btn:hover { color: var(--text-pri); }
    .note-hint-icon-btn { background: none; border: none; font-size: 13px; cursor: pointer; padding: 0 2px; line-height: 1; color: var(--blue); flex-shrink: 0; }
    .note-hint-icon-btn:hover { opacity: 0.7; }
    .note-hint-card { background: var(--blue-bg); border: 1px solid var(--blue-light); border-radius: 8px; padding: 8px 10px; margin-bottom: 8px; }
    .note-hint-event { font-size: 12px; font-weight: 700; color: var(--text-pri); margin-bottom: 3px; }
    .note-hint-text { font-size: 12px; color: var(--text-sec); white-space: pre-wrap; word-break: break-word; }
    .note-hint-text.copied { background: var(--green-bg) !important; color: var(--green) !important; }
    .note-hint-time { font-size: 11px; color: var(--text-muted); margin-top: 4px; }

    /* ── Record actions ── */
    .record-actions { display: flex; flex-direction: column; gap: 5px; align-items: flex-end; flex-shrink: 0; }
    .btn-done {
      padding: 5px 12px;
      background: var(--green-bg);
      color: var(--green);
      border: 1px solid var(--green-border);
      border-radius: 6px;
      font-size: 12px;
      font-weight: 600;
      cursor: pointer;
      white-space: nowrap;
    }
    .btn-done:hover { background: rgba(122,171,138,0.22); }
    .btn-summary {
      padding: 5px 12px;
      background: var(--blue-bg);
      color: var(--blue);
      border: 1px solid var(--blue-light);
      border-radius: 6px;
      font-size: 12px;
      font-weight: 600;
      cursor: pointer;
      white-space: nowrap;
    }
    .btn-summary:hover { background: rgba(143,172,200,0.22); }
    .btn-restart {
      padding: 5px 12px;
      background: var(--orange-bg);
      color: var(--orange);
      border: 1px solid rgba(196,149,106,0.3);
      border-radius: 6px;
      font-size: 12px;
      font-weight: 600;
      cursor: pointer;
      white-space: nowrap;
    }
    .btn-restart:hover { background: rgba(196,149,106,0.22); }
    .btn-del {
      padding: 4px 10px;
      background: transparent;
      color: var(--text-muted);
      border: 1px solid var(--border);
      border-radius: 6px;
      font-size: 11px;
      cursor: pointer;
    }
    .btn-del:hover { color: var(--red); border-color: var(--red); }

    /* ── Quick Reply popup ── */
    .qr-list { display: flex; flex-direction: column; }
    .qr-row { display: flex; align-items: center; justify-content: space-between; padding: 9px 0; border-bottom: 1px solid var(--border-light); gap: 10px; }
    .qr-row:last-child { border-bottom: none; }
    .qr-row-label { font-size: 13px; font-weight: 600; color: var(--text-pri); flex: 1; min-width: 0; }
    .qr-lang-btns { display: flex; gap: 5px; flex-shrink: 0; }
    .btn-qr-lang {
      padding: 0 10px; height: 26px; font-size: 12px; font-weight: 600;
      border: 1px solid var(--border); border-radius: 6px;
      background: var(--surface2); color: var(--text-sec); cursor: pointer;
    }
    .btn-qr-lang:hover { background: var(--blue-bg); color: var(--blue); border-color: var(--blue-light); }
    .btn-qr-lang.hl { background: var(--green-bg); color: var(--green); border-color: var(--green-border); font-weight: 700; }
    .qr-url-wrap { margin-top: 10px; padding-top: 10px; border-top: 1px solid var(--border-light); }
    .qr-url-input {
      width: 100%; padding: 5px 9px; height: 30px; box-sizing: border-box;
      font-size: 12px; border: 1px solid var(--border); border-radius: 6px;
      background: var(--surface2); color: var(--text-pri);
    }
    .qr-url-input:focus { outline: none; border-color: var(--blue-light); background: var(--surface); }
    .qr-url-label { font-size: 11px; color: var(--text-muted); margin-bottom: 4px; }

    /* ── Quick Reply manager ── */
    .qrm-list { display: flex; flex-direction: column; gap: 0; }
    .qrm-item { border: 1px solid var(--border-light); border-radius: 8px; margin-bottom: 6px; background: var(--surface); }
    .qrm-item.drag-over { border-color: var(--blue); background: var(--blue-bg); }
    .qrm-header { display: flex; align-items: center; gap: 8px; padding: 8px 10px; cursor: pointer; user-select: none; }
    .qrm-handle { color: var(--text-muted); font-size: 14px; cursor: grab; flex-shrink: 0; padding: 0 2px; }
    .qrm-handle:active { cursor: grabbing; }
    .qrm-label-preview { flex: 1; min-width: 0; }
    .qrm-label { font-size: 13px; font-weight: 600; color: var(--text-pri); }
    .qrm-preview { font-size: 11px; color: var(--text-muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; margin-top: 1px; }
    .qrm-badges { display: flex; gap: 5px; flex-shrink: 0; align-items: center; }
    .qrm-badge { font-size: 10px; padding: 1px 6px; border-radius: 10px; font-weight: 600; }
    .qrm-badge.name { background: var(--blue-bg); color: var(--blue); border: 1px solid var(--blue-light); }
    .qrm-badge.url  { background: var(--orange-bg); color: var(--orange); border: 1px solid rgba(196,149,106,0.3); }
    .qrm-del { background: none; border: none; cursor: pointer; color: var(--text-muted); font-size: 16px; padding: 0 2px; flex-shrink: 0; }
    .qrm-del:hover { color: var(--red); }
    .qrm-chevron { color: var(--text-muted); font-size: 10px; transition: transform 0.15s; flex-shrink: 0; }
    .qrm-body { display: none; padding: 0 10px 10px; border-top: 1px solid var(--border-light); }
    .qrm-item.open .qrm-body    { display: block; }
    .qrm-item.open .qrm-chevron { transform: rotate(180deg); }
    .qrm-item.open .qrm-preview { display: none; }
    .qrm-field-row { display: flex; gap: 6px; align-items: flex-start; margin-top: 8px; }
    .qrm-field-lbl { font-size: 11px; color: var(--text-muted); width: 28px; flex-shrink: 0; padding-top: 6px; }
    .qrm-textarea {
      flex: 1; padding: 5px 8px; font-size: 12px; border: 1px solid var(--border);
      border-radius: 5px; background: var(--surface2); color: var(--text-pri);
      resize: vertical; min-height: 36px; font-family: inherit; line-height: 1.4;
    }
    .qrm-textarea:focus { outline: none; border-color: var(--blue-light); background: var(--surface); }
    .qrm-label-input {
      flex: 1; padding: 4px 8px; height: 28px; box-sizing: border-box; font-size: 13px; font-weight: 600;
      border: 1px solid var(--border); border-radius: 5px; background: var(--surface2); color: var(--text-pri);
    }
    .qrm-label-input:focus { outline: none; border-color: var(--blue-light); }
    .qrm-checks { display: flex; gap: 14px; margin-top: 8px; padding-top: 6px; border-top: 1px solid var(--border-light); }
    .qrm-check-lbl { display: flex; align-items: center; gap: 5px; font-size: 12px; color: var(--text-sec); cursor: pointer; }
    .qrm-add-row { display: flex; gap: 6px; align-items: center; margin-top: 4px; }
    .qrm-add-input { flex: 1; padding: 5px 9px; height: 30px; box-sizing: border-box; font-size: 13px; border: 1px solid var(--border); border-radius: 6px; background: var(--surface2); color: var(--text-pri); }
    .qrm-add-input:focus { outline: none; border-color: var(--blue-light); }
    .btn-qr-settings { background: none; border: none; cursor: pointer; color: var(--text-muted); font-size: 15px; padding: 3px 4px; border-radius: 5px; display: flex; align-items: center; }
    .btn-qr-settings:hover { color: var(--text-sec); background: var(--surface2); }

    /* ── Empty state ── */
    .empty-state { text-align: center; padding: 36px; color: var(--text-muted); font-size: 14px; }

    /* ── Completed section ── */
    .completed-section { margin-top: 16px; }
    /* ── Pending timer ── */
    .timer-box.pending { border-color: var(--text-muted); background: var(--surface2); }
    .timer-box.pending .t-time { color: var(--text-muted); font-size: 11px; }
    .timer-box.pending .t-stage { color: var(--text-muted); }
    .toggle-row { cursor: pointer; display: flex; align-items: center; gap: 8px; user-select: none; }
    .toggle-row:hover .section-title { color: var(--text-sec); }
    .chevron { color: var(--text-muted); font-size: 11px; transition: transform 0.2s; }
    .chevron.open { transform: rotate(180deg); }
    .record-card.done { opacity: 0.55; }

    /* ── Popup overlay ── */
    .popup-overlay {
      position: fixed;
      inset: 0;
      background: rgba(74,66,56,0.45);
      z-index: 1000;
      display: flex;
      align-items: flex-start;
      justify-content: center;
      overflow-y: auto;
      padding: 20px 0;
      animation: overlayIn 0.2s ease;
    }
    @keyframes overlayIn { from { opacity:0; } to { opacity:1; } }
    .popup-card {
      background: var(--surface);
      border: 2px solid var(--border);
      border-radius: 18px;
      padding: 24px 26px 26px;
      max-width: 440px;
      width: 92%;
      box-shadow: 0 16px 60px rgba(74,66,56,0.2);
      animation: cardUp 0.28s cubic-bezier(0.16,1,0.3,1);
      position: relative;
      margin: auto;
    }
    .popup-card.stage1 { border-color: var(--orange); }
    .popup-card.stage2 { border-color: var(--red); }
    .popup-card.submit-popup { border-color: var(--green); }
    @keyframes cardUp { from { transform: translateY(20px) scale(0.97); opacity:0; } to { transform: none; opacity:1; } }
    .popup-close-btn {
      position: absolute; top: 14px; right: 16px;
      background: none; border: none; font-size: 20px;
      color: var(--text-muted); cursor: pointer; line-height: 1;
    }
    .popup-close-btn:hover { color: var(--text-pri); }
    .popup-badge {
      display: inline-block;
      padding: 4px 12px;
      border-radius: 20px;
      font-size: 11px;
      font-weight: 800;
      letter-spacing: 0.5px;
      margin-bottom: 12px;
    }
    .popup-badge.first  { background: var(--orange-bg); color: var(--orange); border: 1px solid rgba(196,149,106,0.35); }
    .popup-badge.final  { background: var(--red-bg); color: var(--red); border: 1px solid rgba(196,120,120,0.4); animation: pulse 0.9s infinite; }
    .popup-badge.success{ background: var(--green-bg); color: var(--green); border: 1px solid var(--green-border); }
    .popup-badge.info   { background: var(--blue-bg); color: var(--blue); border: 1px solid var(--blue-light); }
    @keyframes pulse { 0%,100% { opacity:1; } 50% { opacity:0.5; } }
    .popup-event-name { font-size: 20px; font-weight: 800; color: var(--text-pri); margin-bottom: 8px; }
    .popup-meta-info { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 14px; min-height: 0; }
    .popup-meta-info:empty { display: none; }
    .popup-meta-tag { background: var(--surface2); border: 1px solid var(--border); border-radius: 4px; padding: 2px 7px; font-size: 11px; color: var(--text-sec); font-family: monospace; }
    .popup-meta-group { background: var(--orange-bg); border: 1px solid rgba(196,149,106,0.3); border-radius: 4px; padding: 2px 7px; font-size: 11px; color: var(--orange); font-weight: 600; }
    .popup-title { font-size: 16px; font-weight: 700; color: var(--text-pri); margin-bottom: 14px; }
    .reply-box {
      background: var(--surface2);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 12px 14px;
      margin-bottom: 12px;
      font-size: 13px;
      color: var(--text-pri);
      line-height: 1.75;
      white-space: pre-wrap;
      word-break: break-word;
    }
    .submit-content-box {
      background: var(--surface2);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 12px 14px;
      margin-bottom: 12px;
      font-size: 13px;
      color: var(--text-pri);
      line-height: 1.75;
      white-space: pre-wrap;
      word-break: break-word;
      font-family: 'Menlo', 'Courier New', monospace;
    }
    .reply-rows { display: flex; flex-direction: column; gap: 6px; margin-bottom: 14px; }
    .reply-row {
      display: flex;
      align-items: center;
      gap: 8px;
      background: var(--surface2);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 8px 10px;
      transition: opacity 0.15s;
    }
    .reply-row.lang-highlight { background: var(--blue-bg); border-color: var(--blue-light); }
    .reply-row.lang-highlight .reply-row-text { color: var(--text-pri); font-weight: 500; }
    .reply-row.lang-dim { opacity: 0.4; }
    .reply-row-text {
      flex: 1;
      font-size: 12px;
      color: var(--text-pri);
      line-height: 1.5;
      word-break: break-word;
      white-space: pre-wrap;
    }
    .btn-copy-inline {
      flex-shrink: 0;
      background: none;
      border: none;
      cursor: pointer;
      font-size: 15px;
      color: var(--text-muted);
      padding: 2px 4px;
      border-radius: 4px;
      transition: color 0.2s ease, background 0.2s ease, transform 0.2s ease;
    }
    .btn-copy-inline:hover { color: var(--blue); background: var(--blue-bg); }
    .btn-copy-inline.copied { color: var(--green); background: var(--green-bg); transform: scale(1.25); }
    .btn-copy-reply {
      width: 100%;
      padding: 9px;
      background: var(--blue-bg);
      color: var(--blue);
      border: 1px solid var(--blue-light);
      border-radius: 8px;
      font-size: 13px;
      font-weight: 600;
      cursor: pointer;
      margin-bottom: 14px;
      transition: background 0.2s ease, color 0.2s ease, border-color 0.2s ease, transform 0.2s ease;
    }
    .btn-copy-reply:hover { background: rgba(143,172,200,0.22); }
    .btn-copy-reply.copied { background: var(--green-bg); color: var(--green); border-color: var(--green-border); transform: scale(1.03); }
    .popup-queue-note { font-size: 12px; color: var(--text-muted); text-align: center; margin-bottom: 12px; }
    .popup-btns { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
    .popup-btns.single { grid-template-columns: 1fr; }
    .btn-popup-done {
      padding: 12px;
      background: var(--green-bg);
      color: var(--green);
      border: 1px solid var(--green-border);
      border-radius: 9px;
      font-size: 14px;
      font-weight: 700;
      cursor: pointer;
    }
    .btn-popup-done:hover { background: rgba(122,171,138,0.25); }
    .btn-popup-sec {
      padding: 12px;
      background: var(--surface2);
      color: var(--text-sec);
      border: 1px solid var(--border);
      border-radius: 9px;
      font-size: 14px;
      font-weight: 600;
      cursor: pointer;
    }
    .btn-popup-sec:hover { background: var(--border); color: var(--text-pri); }
    .btn-icon-sm { background: none; border: 1px solid var(--border); border-radius: 4px; padding: 1px 5px; font-size: 12px; cursor: pointer; color: var(--text-muted); line-height: 1.4; }
    .btn-icon-sm:hover { background: var(--surface2); color: var(--text-pri); }
    .msg-textarea {
      width: 100%;
      min-height: 100px;
      background: var(--surface2);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 10px 12px;
      font-size: 13px;
      color: var(--text-pri);
      font-family: inherit;
      resize: vertical;
      outline: none;
      margin-bottom: 12px;
    }
    .msg-textarea:focus { border-color: var(--blue); }

    /* ── Event Message Compose ── */
    .msg-compose-btn {
      padding: 0 12px;
      height: 30px;
      background: var(--surface2);
      border: 1px solid var(--border);
      border-radius: 6px;
      color: var(--text-sec);
      font-size: 12px;
      cursor: pointer;
      white-space: nowrap;
      flex-shrink: 0;
    }
    .msg-compose-btn:hover { background: var(--blue-bg); border-color: var(--blue-light); color: var(--blue); }
    .msg-event-row {
      background: var(--surface2);
      border: 1px solid var(--border-light);
      border-radius: 10px;
      padding: 12px 14px;
    }
    .msg-event-header { display: flex; flex-direction: column; gap: 3px; margin-bottom: 8px; }
    .msg-event-name-row { display: flex; align-items: flex-start; gap: 4px; }
    .msg-event-meta-row { display: flex; align-items: center; gap: 6px; flex-wrap: wrap; }
    .msg-event-name { font-size: 13px; font-weight: 700; color: var(--text-pri); flex: 1; min-width: 0; }
    .msg-event-id { font-size: 11px; color: var(--text-muted); font-family: monospace; white-space: nowrap; }
    .msg-event-remove { background: none; border: none; font-size: 16px; color: var(--text-muted); cursor: pointer; line-height: 1; padding: 0 2px; flex-shrink: 0; }
    .msg-event-remove:hover { color: var(--red); }
    .msg-event-notes {
      width: 100%; background: var(--surface); border: 1px solid var(--border);
      border-radius: 7px; padding: 7px 10px; font-size: 13px; color: var(--text-pri);
      font-family: inherit; resize: vertical; outline: none; min-height: 58px;
    }
    .msg-event-notes:focus { border-color: var(--blue); }
    .msg-event-notes::placeholder { color: var(--text-muted); }

    /* ── Responsive ── */
    @media (max-width: 520px) {
      .card-body { flex-wrap: wrap; }
      .record-actions { flex-direction: row; }
    }
  </style>
</head>
<body>

<div class="header">
  <h1>回覆提醒</h1>
  <span class="header-badge" id="header-badge">0</span>
  <button class="msg-compose-btn" onclick="showMsgComposePopup()">📨 賽事訊息</button>
  <button class="msg-compose-btn" onclick="showNotepadPopup()">📝 記事本</button>
  <div class="header-search-wrap">
    <input id="records-search" type="text" class="header-search-input" placeholder="搜尋 ID 或賽事…" oninput="onSearchInput()">
    <button class="search-clear-btn" id="search-clear-btn" onclick="clearSearch()" style="display:none">×</button>
  </div>
  <span style="flex:1"></span>
  <button class="notification-btn" id="notif-btn" onclick="requestNotifPermission()">🔔 開啟通知</button>
  <input class="agent-name-input" id="agent-name" type="text" placeholder="你的名字" oninput="saveAgentName()" />
</div>

<div class="container">
  <div class="main-layout">

    <!-- ── Left: Add form ── -->
    <div class="left-col">
      <div class="form-card">
        <div class="form-title">
          <span>新增記錄</span>
          <button type="button" class="btn-clear-form" onclick="clearForm()" title="清除所有內容">清空</button>
        </div>
        <form id="add-form" onsubmit="handleSubmit(event)">
          <div class="group-list" id="group-list"></div>
          <div style="display:flex;gap:8px;margin-bottom:10px">
            <button type="button" class="btn-add-group" style="flex:1;margin-bottom:0" onclick="addFormGroup()">＋ 新增賽事群組</button>
            <button type="button" class="btn-import-json" onclick="showJsonImportPopup()">📥 JSON</button>
          </div>
          <div class="shared-fields">
            <div class="form-group">
              <label>需求 * <button type="button" class="gear-btn" onclick="openPresetsModal()" title="管理預設需求">⚙️</button></label>
              <div class="req-combobox" id="req-combobox">
                <div class="req-input-row">
                  <input id="f-req" class="req-input" placeholder="客戶的需求或問題描述" autocomplete="off" required oninput="onReqInput()" onfocus="onReqInput()" onkeydown="onReqKeydown(event)">
                  <button type="button" class="req-toggle" onclick="toggleReqDrop()" title="顯示建議">
                    <svg width="12" height="12" viewBox="0 0 12 12" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><polyline points="2,4 6,8 10,4"/></svg>
                  </button>
                </div>
                <div class="req-dropdown" id="req-dropdown" style="display:none"></div>
              </div>
            </div>
            <div class="form-group">
              <label>群組名稱 *</label>
              <div style="position:relative">
                <input id="f-group" placeholder="群組名稱" autocomplete="off" required
                  oninput="_grpOnInput(this)" onkeydown="_grpOnKey(event)" onfocus="_grpOnInput(this)" onblur="_grpOnBlur()">
                <div class="grp-dropdown" id="grp-dropdown" style="display:none"></div>
              </div>
            </div>
            <div class="form-group">
              <label>附加資訊</label>
              <textarea id="f-info" placeholder="選填，附加說明…"></textarea>
            </div>
          </div>
          <div class="form-group">
            <label>回覆語言</label>
            <div class="lang-select-group" id="lang-select">
              <button type="button" class="lang-sel-btn" data-lang="en" onclick="setFormLang('en')">EN</button>
              <button type="button" class="lang-sel-btn" data-lang="zh" onclick="setFormLang('zh')">中</button>
              <button type="button" class="lang-sel-btn" data-lang="kr" onclick="setFormLang('kr')">KR</button>
            </div>
          </div>
          <button type="submit" class="btn-submit">⏱ 添加計時器</button>
        </form>
      </div>
    </div>

    <!-- ── Right: Records ── -->
    <div class="right-col">
      <div class="section-header">
        <span class="section-title">待處理</span>
        <span class="count-badge" id="active-count" style="display:none">0</span>
        <button class="btn-qr-settings" onclick="showQrManager()" title="管理快速回覆範本">⚙</button>
        <div style="margin-left:auto;display:flex;gap:6px">
          <button class="export-btn" style="margin-left:0" onclick="showExportPopup()" title="匯出所有待處理">📤 匯出</button>
          <button class="export-btn" style="margin-left:0" onclick="markAllDone()" title="全部標記為已完成">✓ 全完成</button>
        </div>
      </div>
      <div id="active-records"></div>

      <div class="completed-section">
        <div class="section-header toggle-row" onclick="toggleCompleted()">
          <span class="section-title">已完成</span>
          <span class="count-badge gray" id="done-count">0</span>
          <span class="chevron" id="chevron">▼</span>
        </div>
        <div id="completed-list" style="display:none">
          <div id="completed-records"></div>
        </div>
      </div>
    </div>

  </div>
</div>

<button class="back-to-top" id="back-to-top" onclick="window.scrollTo({top:0,behavior:'smooth'})" title="回到頂部">↑</button>

<!-- ── Popup (injected dynamically) ── -->

<script>
  const STAGE1_MS   = 9 * 60 * 1000;
  const STAGE2_MS   = 9 * 60 * 1000;
  const STORAGE_KEY = 'reminder4me_v3';

  let records      = [];
  let timerHandles = {};
  let popupQueue   = [];
  let activePopupId = null;
  let _pendingCopy = '';   // stores text for popup copy buttons
  let _replyTexts  = { zh: '', en: '', kr: '' };
  let selectedIds  = new Set();

  // ── Form group state ──
  let groupCounter = 0;
  let formGroups   = []; // [{id, eventName, orderNos:[]}]
  let formLang     = null; // 'en'|'zh'|'kr'|null

  // ── Quick Replies ──
  const QR_KEY = 'reminder4me_quick_replies';

  // ── Standalone event notes store (from 賽事訊息產生器, not tied to cards) ──
  const ENS_KEY = 'reminder4me_ens';
  let _ensStore = {}; // { eventName: { note, ts } }
  function _ensLoad() {
    try { _ensStore = JSON.parse(localStorage.getItem(ENS_KEY) || '{}'); } catch(e) { _ensStore = {}; }
  }
  function _ensSave() { localStorage.setItem(ENS_KEY, JSON.stringify(_ensStore)); }
  function _ensSet(eventName, note) {
    if (!note || !note.trim()) return;
    _ensStore[eventName] = { note: note.trim(), ts: Date.now() };
    _ensSave();
  }
  const _defaultQuickReplies = [
    { id: 'qr1', label: '已结算',  attachName: false, hasUrl: false,
      zh: '注单已结算，后台更新需要5-10分钟，烦请贵司稍等刷新查看，谢谢。- Sunny',
      en: 'Thank you for waiting. The bet has been settled but BO needs 5-10 mins to be updated. Please check again later. Thank you. - Sunny',
      kr: '기다려 주셔서 감사합니다. 베팅은 정산되었지만 BO가 업데이트되는 데 5-10분 정도 소요됩니다. 나중에 다시 확인해 주시기 바랍니다. 감사합니다. - Sunny' },
    { id: 'qr2', label: '重新结算', attachName: false, hasUrl: false,
      zh: '注单已重新结算，后台更新需要5-10分钟，烦请贵司稍等刷新查看，谢谢。- Sunny',
      en: 'Thank you for waiting. The bet has been resettled but BO needs 5-10 mins to be updated. Please check again then. Thank you. - Sunny',
      kr: '기다려 주셔서 감사합니다. 베팅이 재정산되었지만 BO가 업데이트되는 데 5-10분 정도 소요됩니다. 그 후에 다시 확인해 주시기 바랍니다. 감사합니다. - Sunny' },
    { id: 'qr3', label: '已取消',  attachName: false, hasUrl: false,
      zh: '注单已取消，后台更新需要5-10分钟，烦请贵司稍等刷新查看，谢谢。- Sunny',
      en: 'Thank you for waiting. The bet has been canceled but BO needs 5-10 mins to be updated. Please check again then. Thank you. - Sunny',
      kr: '기다려 주셔서 감사합니다. 베팅이 취소되었지만 BO가 업데이트되는 데 5-10분 정도 소요됩니다. 그 후에 다시 확인해 주시기 바랍니다. 감사합니다. - Sunny' },
    { id: 'qr4', label: 'No info', attachName: true,  hasUrl: false,
      zh: '经确认，该赛事暂无官方资讯，待确认官方赛果后将会立即自动结算，还请您理解並解釋給予您的玩家，谢谢。 - Sunny',
      en: 'We have no official information available yet. Once there is any update, the bets will be settled accordingly. Thank you. - Sunny',
      kr: '아직 공식적인 정보가 없습니다. 업데이트가 있으면 그에 따라 베팅이 정산될 것입니다. 감사합니다. - Sunny' },
    { id: 'qr5', label: '延期24H', attachName: true,  hasUrl: false,
      zh: '经确认此赛事目前似乎延期或弃赛，相关团队会等待24小时确认赛事是否重启，相关注单将会在之后做对应处理，提前感谢您的耐心。 - Sunny',
      en: 'This event appears to be postponed or abandoned. The relevant team will wait 24 hours to confirm whether the event will resume. Related bets will be handled accordingly afterwards. Thank you in advance for your patience. - Sunny',
      kr: '이 이벤트는 연기되거나 취소된 것으로 보입니다. 관련 팀은 이벤트 재개 여부를 확인하기 위해 24시간을 기다릴 것입니다. 관련 베팅은 이후 그에 따라 처리될 예정입니다. 기다려 주셔서 미리 감사드립니다. - Sunny' },
    { id: 'qr6', label: '调查中',  attachName: true,  hasUrl: false,
      zh: '该赛事目前正在由相关团队进行进一步调查。相关投注将在有任何更新后相应处理，提前感谢您的耐心等待。- Sunny',
      en: 'The event is currently under further investigation by relevant team. Related bets will be dealt with accordingly once any update. Thank you for your patience. - Sunny',
      kr: '현재 해당 이벤트는 관련 팀에 의해 추가 조사 중입니다. 업데이트가 있는 대로 관련 베팅은 그에 따라 처리될 예정입니다. 양해해 주셔서 감사합니다. - Sunny' },
    { id: 'qr7', label: '结算正确', attachName: false, hasUrl: true,
      zh: '结算正确，链接仅供参考，谢谢。 - Sunny',
      en: 'Correctly settled, link as ref only, thank you. - Sunny',
      kr: '올바르게 정산되었습니다, 참조용 링크로만 사용해 주세요, 감사합니다. - Sunny' },
  ];
  let _quickReplies = [];
  let _qrExpandedIdx    = -1;
  let _qrDragSrcIdx     = -1;
  let _hintPopupEvent   = '';

  const QR_VER_KEY = 'reminder4me_qr_ver';
  const QR_VER     = 2; // bump when defaults change
  function loadQuickReplies() {
    try {
      const s   = localStorage.getItem(QR_KEY);
      const ver = Number(localStorage.getItem(QR_VER_KEY) || 0);
      if (s && ver >= QR_VER) {
        const parsed = JSON.parse(s);
        _quickReplies = parsed.map(x => ({ attachName: false, hasUrl: false, ...x }));
      } else {
        // first run or old defaults — load fresh defaults and save version
        _quickReplies = _defaultQuickReplies.map(x => ({ ...x }));
        localStorage.setItem(QR_KEY, JSON.stringify(_quickReplies));
        localStorage.setItem(QR_VER_KEY, String(QR_VER));
      }
    } catch(e) { _quickReplies = _defaultQuickReplies.map(x => ({ ...x })); }
  }
  function saveQuickReplies() {
    localStorage.setItem(QR_KEY, JSON.stringify(_quickReplies));
    localStorage.setItem(QR_VER_KEY, String(QR_VER));
  }

  function _extractUrl(text) {
    if (!text) return '';
    const m = text.match(/https?:\/\/[^\s]+/);
    return m ? m[0] : '';
  }

  // ── Quick Reply use popup ──
  function showMarkDonePopup(id) {
    const r = records.find(x => x.id === id);
    if (!r || r.completedAt) return;
    const allEventNames = getEventNames(r);
    const settledSet = new Set(r.settledEventIndices || []);
    const pendingNames = allEventNames.filter((_, i) => !settledSet.has(i));
    const reqText   = r.requirement || '';
    const grpText   = r.group || '';
    const hasUrlTemplate = _quickReplies.some(q => q.hasUrl);
    const cardLang = r.lang || null;
    let autoUrl = _extractUrl(r.additionalInfo);
    if (!autoUrl && r.eventNotes) {
      for (const key of Object.keys(r.eventNotes)) {
        autoUrl = _extractUrl(r.eventNotes[key]);
        if (autoUrl) break;
      }
    }
    const existing = document.getElementById('popup-overlay');
    if (existing) existing.remove();

    const rowsHtml = _quickReplies.map((qr, i) => {
      const nameTag = qr.attachName ? '<span style="font-size:10px;color:var(--blue);margin-left:5px">附名</span>' : '';
      const urlTag  = qr.hasUrl     ? '<span style="font-size:10px;color:var(--orange);margin-left:3px">+URL</span>' : '';
      const hlZh = cardLang === 'zh' ? ' hl' : '';
      const hlEn = cardLang === 'en' ? ' hl' : '';
      const hlKr = cardLang === 'kr' ? ' hl' : '';
      return `<div class="qr-row">
        <span class="qr-row-label">${esc(qr.label)}${nameTag}${urlTag}</span>
        <div class="qr-lang-btns">
          <button class="btn-qr-lang${hlZh}" onclick="_qrCopyDone('${id}',${i},'zh',this)">中</button>
          <button class="btn-qr-lang${hlEn}" onclick="_qrCopyDone('${id}',${i},'en',this)">EN</button>
          <button class="btn-qr-lang${hlKr}" onclick="_qrCopyDone('${id}',${i},'kr',this)">한</button>
        </div>
      </div>`;
    }).join('');

    const urlSection = hasUrlTemplate ? `
      <div class="qr-url-wrap" style="flex-shrink:0">
        <div class="qr-url-label">🔗 貼上網址（結算正確用）</div>
        <input id="qr-url-input" class="qr-url-input" type="url" placeholder="https://..." value="${esc(autoUrl)}">
      </div>` : '';

    // Event selector: single name as title, multiple as checkboxes
    const displayNames = pendingNames.length ? pendingNames : allEventNames;
    let eventSection = '';
    if (displayNames.length === 1) {
      eventSection = `<div class="popup-title" style="font-size:13px;margin-bottom:6px;flex-shrink:0">🏆 ${esc(displayNames[0])}</div>`;
    } else if (displayNames.length > 1) {
      const cbItems = displayNames.map(n =>
        `<label style="display:flex;align-items:flex-start;gap:6px;padding:3px 0;cursor:pointer;font-size:12px;color:var(--text-pri)">
          <input type="checkbox" class="qr-event-cb" data-name="${esc(n)}" checked style="margin-top:2px;flex-shrink:0">
          <span style="line-height:1.4">${esc(n)}</span>
        </label>`).join('');
      eventSection = `
        <div style="margin-bottom:8px;flex-shrink:0">
          <div style="font-size:11px;color:var(--text-muted);margin-bottom:4px">🏆 選擇帶入的賽事</div>
          <div style="background:var(--surface2);border-radius:6px;padding:6px 10px">${cbItems}</div>
        </div>`;
    }

    const overlay = document.createElement('div');
    overlay.id = 'popup-overlay';
    overlay.className = 'popup-overlay';
    overlay.innerHTML = `
      <div class="popup-card" style="min-width:290px;max-width:440px;width:93%;max-height:82vh;display:flex;flex-direction:column;">
        <div class="popup-badge info" style="flex-shrink:0">✓ 快速回覆</div>
        ${eventSection}
        <div style="font-size:11px;color:var(--text-muted);margin-bottom:10px;flex-shrink:0;line-height:1.6">${reqText ? `📋 ${esc(reqText)}` : ''}${reqText && grpText ? '　' : ''}${grpText ? `👥 ${esc(grpText)}` : ''}</div>
        <div class="qr-list" style="overflow-y:auto;flex:1;min-height:0">${rowsHtml || '<div style="color:var(--text-muted);font-size:13px;padding:8px 0">尚未設定快速回覆範本</div>'}</div>
        ${urlSection}
        <div class="popup-btns" style="margin-top:12px;flex-shrink:0">
          <button class="btn-popup-sec" onclick="showQrManager()">⚙ 管理範本</button>
          <button class="btn-popup-done" onclick="document.getElementById('popup-overlay')?.remove();markDone('${id}')">✓ 直接搞定</button>
        </div>
      </div>`;
    document.body.appendChild(overlay);
    overlay.addEventListener('click', e => { if (e.target === overlay) overlay.remove(); });
  }

  function _getSelectedQrEventNames(r) {
    const cbs = document.querySelectorAll('.qr-event-cb');
    if (cbs.length > 0) return [...cbs].filter(cb => cb.checked).map(cb => cb.dataset.name).filter(Boolean);
    // fallback: first pending event
    const allNames = getEventNames(r);
    const settledSet = new Set(r.settledEventIndices || []);
    const pending = allNames.filter((_, i) => !settledSet.has(i));
    return [(pending[0] || allNames[0] || '').trim()].filter(Boolean);
  }

  function _qrCopyDone(id, qrIdx, lang, btn) {
    const qr = _quickReplies[qrIdx];
    if (!qr) return;
    const r = records.find(x => x.id === id);
    const selectedNames = r ? _getSelectedQrEventNames(r) : [];
    const eventName = selectedNames.join('\n');
    const urlInput  = document.getElementById('qr-url-input');
    const url       = urlInput ? urlInput.value.trim() : '';

    let text = qr[lang] || '';
    if (qr.attachName && eventName) text = eventName + '\n' + text;
    const agentName = getAgentName();
    if (agentName) {
      const suffix = ` - ${agentName}`;
      if (text.trimEnd().endsWith(suffix)) text = text.trimEnd().slice(0, -suffix.length);
      text = text.trimEnd() + suffix;
    }
    if (qr.hasUrl && url) text = text.trimEnd() + '\n\n' + url;

    copyText(text, btn);
    setTimeout(() => { document.getElementById('popup-overlay')?.remove(); markDone(id); }, 400);
  }

  function _qrCopyHint(qrIdx, lang, btn) {
    const qr = _quickReplies[qrIdx];
    if (!qr) return;
    const urlInput = document.getElementById('qr-url-input');
    const url = urlInput ? urlInput.value.trim() : '';
    let text = qr[lang] || '';
    if (qr.attachName && _hintPopupEvent) text = _hintPopupEvent + '\n' + text;
    const agentName = getAgentName();
    if (agentName) {
      const suffix = ` - ${agentName}`;
      if (text.trimEnd().endsWith(suffix)) text = text.trimEnd().slice(0, -suffix.length);
      text = text.trimEnd() + suffix;
    }
    if (qr.hasUrl && url) text = text.trimEnd() + '\n\n' + url;
    copyText(text, btn);
    setTimeout(() => {
      document.getElementById('popup-overlay')?.remove();
      // only auto-clear if there's just one event in the form; keep the rest if multi-event
      const filledCount = formGroups.reduce((n, g) => n + g.eventNames.filter(e => e.trim()).length, 0);
      if (filledCount <= 1) clearForm();
    }, 350);
  }

  // ── Quick Reply manager ──
  function showQrManager() {
    const existing = document.getElementById('popup-overlay');
    if (existing) existing.remove();
    _qrExpandedIdx = -1;
    _renderQrManager();
  }

  function _renderQrManager() {
    const existing = document.getElementById('popup-overlay');
    if (existing) existing.remove();

    const itemsHtml = _quickReplies.map((qr, i) => {
      const isOpen = _qrExpandedIdx === i;
      const preview = qr.zh ? qr.zh.slice(0, 18) + (qr.zh.length > 18 ? '…' : '') : '（未填內容）';
      return `<div class="qrm-item${isOpen ? ' open' : ''}" id="qrm-item-${i}"
          draggable="true"
          ondragstart="_qrDragStart(${i})"
          ondragover="_qrDragOver(event,${i})"
          ondragleave="_qrDragLeave(${i})"
          ondrop="_qrDrop(event,${i})">
        <div class="qrm-header" onclick="_qrToggle(${i})">
          <span class="qrm-handle" onclick="event.stopPropagation()" draggable="false">⠿</span>
          <div class="qrm-label-preview">
            <div class="qrm-label">${esc(qr.label) || '<span style="color:var(--text-muted)">（未命名）</span>'}</div>
            <div class="qrm-preview">${esc(preview)}</div>
          </div>
          <div class="qrm-badges">
            ${qr.attachName ? '<span class="qrm-badge name">附名</span>' : ''}
            ${qr.hasUrl     ? '<span class="qrm-badge url">+URL</span>'  : ''}
          </div>
          <span class="qrm-chevron">▼</span>
          <button class="qrm-del" onclick="event.stopPropagation();_qrMgrRemove(${i})" title="移除">×</button>
        </div>
        <div class="qrm-body">
          <div class="qrm-field-row">
            <span class="qrm-field-lbl" style="width:36px;color:var(--text-sec);font-weight:600">標題</span>
            <input class="qrm-label-input" value="${esc(qr.label)}" placeholder="情況名稱" oninput="_qrMgrSet(${i},'label',this.value)">
          </div>
          <div class="qrm-field-row">
            <span class="qrm-field-lbl">中</span>
            <textarea class="qrm-textarea" rows="3" oninput="_qrMgrSet(${i},'zh',this.value)">${esc(qr.zh)}</textarea>
          </div>
          <div class="qrm-field-row">
            <span class="qrm-field-lbl">EN</span>
            <textarea class="qrm-textarea" rows="3" oninput="_qrMgrSet(${i},'en',this.value)">${esc(qr.en)}</textarea>
          </div>
          <div class="qrm-field-row">
            <span class="qrm-field-lbl">한</span>
            <textarea class="qrm-textarea" rows="3" oninput="_qrMgrSet(${i},'kr',this.value)">${esc(qr.kr)}</textarea>
          </div>
          <div class="qrm-checks">
            <label class="qrm-check-lbl">
              <input type="checkbox" ${qr.attachName ? 'checked' : ''} onchange="_qrMgrSet(${i},'attachName',this.checked)">
              附上賽事名稱
            </label>
            <label class="qrm-check-lbl">
              <input type="checkbox" ${qr.hasUrl ? 'checked' : ''} onchange="_qrMgrSet(${i},'hasUrl',this.checked)">
              附上網址
            </label>
          </div>
        </div>
      </div>`;
    }).join('');

    const overlay = document.createElement('div');
    overlay.id = 'popup-overlay';
    overlay.className = 'popup-overlay';
    overlay.innerHTML = `
      <div class="popup-card" style="min-width:300px;max-width:500px;width:95%">
        <button class="popup-close-btn" onclick="document.getElementById('popup-overlay').remove()">×</button>
        <div class="popup-badge info">⚙ 管理快速回覆範本</div>
        <div class="qrm-list" id="qrm-list" style="margin-top:14px;max-height:55vh;overflow-y:auto">${itemsHtml}</div>
        <div style="padding-top:10px;border-top:1px solid var(--border-light);margin-top:8px">
          <div class="qrm-add-row">
            <input id="qrm-new-label" class="qrm-add-input" placeholder="新情況名稱" onkeydown="if(event.key==='Enter')_qrMgrAdd()">
            <button class="btn-summary" style="flex-shrink:0" onclick="_qrMgrAdd()">+ 新增</button>
            <button class="btn-done" style="flex-shrink:0;padding:5px 14px" onclick="_qrMgrSave()">儲存</button>
          </div>
        </div>
      </div>`;
    document.body.appendChild(overlay);
    overlay.addEventListener('click', e => { if (e.target === overlay) overlay.remove(); });
  }

  function _qrToggle(i) {
    const item = document.getElementById('qrm-item-' + i);
    if (!item) return;
    const wasOpen = item.classList.contains('open');
    document.querySelectorAll('#qrm-list .qrm-item.open').forEach(el => el.classList.remove('open'));
    _qrExpandedIdx = -1;
    if (!wasOpen) { item.classList.add('open'); _qrExpandedIdx = i; }
  }
  function _qrMgrSet(i, field, val) { if (_quickReplies[i]) _quickReplies[i][field] = val; }
  function _qrMgrRemove(i) { _quickReplies.splice(i, 1); _qrExpandedIdx = -1; _renderQrManager(); }
  function _qrMgrAdd() {
    const inp = document.getElementById('qrm-new-label');
    const label = inp ? inp.value.trim() : '';
    _quickReplies.push({ id: 'qr_' + Date.now(), label, zh: '', en: '', kr: '', attachName: false, hasUrl: false });
    _qrExpandedIdx = _quickReplies.length - 1;
    _renderQrManager();
  }

  function _buildBetInfoHtml(r) {
    if (!r.betInfos) return '';
    const na = v => (v === null || v === undefined || v === '') ? 'n/a' : String(v);
    const _betLineRow = bl => {
      const st = bl.status !== null && bl.status !== undefined ? _jsonStatusMap[bl.status] : null;
      const statusBadge = st ? `<span class="bet-status-badge" style="color:${st.color}">${st.label}</span>` : '';
      const line1 = `${na(bl.lineType)} / ${na(bl.selectionName)}`;
      const hasScore = bl.score1 !== null && bl.score1 !== undefined;
      const hasSettlement = bl.settlementResult !== null && bl.settlementResult !== '';
      const scorePart = hasScore ? `${na(bl.score1)}-${na(bl.score2)}` : null;
      const settlePart = hasSettlement ? na(bl.settlementResult) : null;
      const scoreLine = (scorePart && settlePart) ? `${scorePart} / ${settlePart}`
                      : scorePart ? scorePart : settlePart ? settlePart : null;
      return `<div class="bet-info-row"><span class="bet-info-line" title="${esc(line1)}">${esc(line1)}</span>${statusBadge}</div>`
           + (scoreLine ? `<div class="bet-score-line">${esc(scoreLine)}</div>` : '');
    };
    const rows = r.betInfos.map(b => {
      if (!b) return '';
      const leaguePart = b.leagueName ? `<div class="bet-league-line">${esc(b.leagueName)}</div>` : '';
      const betLinesPart = (b.betLines && b.betLines.length)
        ? b.betLines.map(_betLineRow).join('')
        : _betLineRow({ lineType: b.lineType, selectionName: b.selectionName,
                        status: b.status, score1: b.score1, score2: b.score2, settlementResult: b.settlementResult });
      let timePart = '';
      if (b.startDate) {
        const upcoming = _jsonIsUpcoming(b.startDate);
        const stale    = b.status === 0 && _jsonIsStale(b.startDate);
        const timeStr  = _jsonToUtc8(b.startDate);
        if (upcoming)   timePart = `<div class="bet-time-line" style="color:var(--red)">⏰ 尚未開賽 · ${esc(timeStr)}</div>`;
        else if (stale) timePart = `<div class="bet-time-line" style="color:var(--orange)">⚠ &gt;24h · ${esc(timeStr)}</div>`;
        else            timePart = `<div class="bet-time-line">${esc(timeStr)}</div>`;
      }
      return leaguePart + betLinesPart + timePart;
    }).filter(Boolean).join('');
    return rows ? `<div class="bet-info-block">${rows}</div>` : '';
  }

  // ── Helpers ──
  function getRemaining(r) {
    if (r.completedAt) return -1;
    if (r.stage >= 3) return null; // pending — no countdown
    if (r.stage === 1) return STAGE1_MS - (Date.now() - r.createdAt);
    return STAGE2_MS - (Date.now() - (r.stage2StartAt || r.createdAt));
  }
  function timerClass(ms) {
    if (ms === null)  return 'pending';
    if (ms <= 0)      return 'expired';
    if (ms < 60000)   return 'alert';
    if (ms < 3*60000) return 'warn';
    return 'normal';
  }
  function cardClass(ms) {
    if (ms === null || ms > 0 && ms >= 60000) return ms === null ? '' : ms < 3*60000 ? 'warn' : '';
    if (ms <= 0 || ms < 60000) return 'alert';
    return '';
  }
  function fmtTime(ms) {
    if (ms === null) return '待定';
    if (ms <= 0) return '超時';
    const s = Math.ceil(ms / 1000);
    return `${String(Math.floor(s/60)).padStart(2,'0')}:${String(s%60).padStart(2,'0')}`;
  }
  function fmtDuration(ms) {
    const m = Math.floor(ms/60000), s = Math.floor((ms%60000)/1000);
    return m > 0 ? `${m}m${s}s` : `${s}s`;
  }
  function esc(s) {
    return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
  }
  function sortedActive() {
    return records.filter(r => !r.completedAt && _matchesSearch(r)).sort((a,b) => {
      const ra = getRemaining(a), rb = getRemaining(b);
      if (ra === null && rb === null) return 0;
      if (ra === null) return 1;
      if (rb === null) return -1;
      return ra - rb;
    });
  }
  function sortedDone() {
    return records.filter(r => r.completedAt && _matchesSearch(r)).sort((a,b) => b.completedAt - a.completedAt);
  }

  // ── Notepad ──
  const NOTEPAD_KEY = 'reminder4me_notepad';
  function _cleanPasteText(clipData) {
    const html = clipData.getData('text/html');
    if (html) {
      // Ensure block elements and <br> produce newlines
      const processed = html
        .replace(/<br\s*\/?>/gi, '\n')
        .replace(/<\/?(div|p|li|tr|td|h[1-6])[^>]*>/gi, '\n');
      const doc = new DOMParser().parseFromString(processed, 'text/html');
      let text = doc.body.innerText;
      text = text.replace(/\s*\(https?:\/\/[^\s)]+\)/g, '');
      // Collapse spaces within lines only, preserve newlines
      return text.replace(/ {2,}/g, ' ').replace(/\n{2,}/g, '\n').trim()
        || clipData.getData('text/plain').trim();
    }
    return clipData.getData('text/plain').trim()
      .replace(/\s*\(https?:\/\/[^\s)]+\)/g, '')
      .replace(/ {2,}/g, ' ').trim();
  }
  function showNotepadPopup() {
    const existing = document.getElementById('notepad-overlay');
    if (existing) { existing.remove(); return; }
    const content = localStorage.getItem(NOTEPAD_KEY) || '';
    const overlay = document.createElement('div');
    overlay.id = 'notepad-overlay';
    overlay.className = 'popup-overlay';
    overlay.innerHTML = `
      <div class="popup-card" style="max-width:500px;width:92%;display:flex;flex-direction:column">
        <div style="display:flex;align-items:center;gap:8px;margin-bottom:10px">
          <span style="font-size:13px;font-weight:700;color:var(--text-pri)">📝 記事本</span>
          <span style="font-size:11px;color:var(--text-muted);flex:1">貼上自動去除連結</span>
          <button class="btn-popup-sec" style="padding:3px 10px;font-size:11px" onclick="document.getElementById('notepad-ta').value='';localStorage.removeItem('${NOTEPAD_KEY}')">清空</button>
          <button class="popup-close-btn" style="position:static" onclick="document.getElementById('notepad-overlay').remove()">×</button>
        </div>
        <textarea id="notepad-ta" style="flex:1;min-height:280px;resize:vertical;background:var(--surface2);border:1px solid var(--border);border-radius:8px;padding:12px;font-size:13px;color:var(--text-pri);font-family:inherit;line-height:1.7;outline:none" placeholder="在此輸入或貼上文字，連結會自動移除...">${esc(content)}</textarea>
      </div>`;
    document.body.appendChild(overlay);
    overlay.addEventListener('click', e => { if (e.target === overlay) overlay.remove(); });
    const ta = overlay.querySelector('#notepad-ta');
    ta.addEventListener('input', () => localStorage.setItem(NOTEPAD_KEY, ta.value));
    ta.addEventListener('paste', e => {
      e.preventDefault();
      const cleaned = _cleanPasteText(e.clipboardData);
      const start = ta.selectionStart, end = ta.selectionEnd;
      ta.value = ta.value.substring(0, start) + cleaned + ta.value.substring(end);
      ta.selectionStart = ta.selectionEnd = start + cleaned.length;
      localStorage.setItem(NOTEPAD_KEY, ta.value);
    });
    ta.focus();
    ta.setSelectionRange(ta.value.length, ta.value.length);
  }

  function copyText(text, btn) {
    // Show feedback immediately — don't wait for async clipboard
    if (btn) {
      btn.classList.add('copied');
      setTimeout(() => btn.classList.remove('copied'), 1500);
    }
    navigator.clipboard.writeText(text).catch(() => {
      const ta = document.createElement('textarea');
      ta.value = text; ta.style.position = 'fixed'; ta.style.opacity = '0';
      document.body.appendChild(ta); ta.select();
      document.execCommand('copy'); document.body.removeChild(ta);
    });
  }

  function _jsonToUtc8(iso) {

    const u8 = new Date(d.getTime() + 8 * 3600000);

    return `${u8.getUTCFullYear()}/${pad(u8.getUTCMonth()+1)}/${pad(u8.getUTCDate())} ${pad(u8.getUTCHours())}:${pad(u8.getUTCMinutes())} (UTC+8)`;
  }
  function _tsToUtc8(ts) {
    const u8 = new Date(ts + 8 * 3600000);
    const pad = n => String(n).padStart(2,'0');
    return `${u8.getUTCFullYear()}-${pad(u8.getUTCMonth()+1)}-${pad(u8.getUTCDate())} ${pad(u8.getUTCHours())}:${pad(u8.getUTCMinutes())} (UTC+8)`;
  }
  let _noteHintsMap = {};
  function _renderNoteHints(eventNames) {
    _noteHintsMap = {};
    for (const name of eventNames) {
      if (!name) continue;
      let best = null;
      for (const rec of records) {
        // check per-event notes
        if (rec.eventNotes) {
          const note = rec.eventNotes[name];
          if (note) {
            const ts = (rec.eventNoteTimes && rec.eventNoteTimes[name]) || rec.createdAt || 0;
            if (!best || ts > best.ts) best = { note, ts };
          }
        }
        // check additionalInfo on records that include this event
        if (rec.additionalInfo && (rec.eventNames || []).some(n => n.trim() === name)) {
          const ts = rec.createdAt || 0;
          if (!best || ts > best.ts) best = { note: rec.additionalInfo, ts };
        }
      }
      // also check standalone store from 賽事訊息產生器
      const ens = _ensStore[name];
      if (ens && (!best || ens.ts > best.ts)) best = { note: ens.note, ts: ens.ts };
      if (best) _noteHintsMap[name] = { note: best.note, timeStr: best.ts ? _tsToUtc8(best.ts) : '' };
    }
    renderFormGroups();
  }

  function _refreshNoteHints() {
    const names = new Set();
    for (const rec of records) {
      if (rec.eventNotes) Object.keys(rec.eventNotes).forEach(n => names.add(n));

    }
    _renderNoteHints([...names]);
  }
  function _getHint(name) {
    if (!name) return null;
    if (_noteHintsMap[name]) return _noteHintsMap[name];
    const ens = _ensStore[name];
    if (ens) return { note: ens.note, timeStr: ens.ts ? _tsToUtc8(ens.ts) : '' };
    let best = null;
    for (const rec of records) {
      if (rec.eventNotes) {
        const note = rec.eventNotes[name];
        if (note) {
          const ts = (rec.eventNoteTimes && rec.eventNoteTimes[name]) || rec.createdAt || 0;
          if (!best || ts > best.ts) best = { note, ts };

      if (rec.additionalInfo && (rec.eventNames || []).some(n => n.trim() === name)) {
        const ts = rec.createdAt || 0;
        if (!best || ts > best.ts) best = { note: rec.additionalInfo, ts };

    return best ? { note: best.note, timeStr: best.ts ? _tsToUtc8(best.ts) : '' } : null;

  function _apiStatusStrToNum(str) {
    return { Opened:0, Lost:1, Won:2, Draw:3, Canceled:4, Cancelled:4,
             HalfLost:16, HalfWon:17, Cashout:32 }[str] ?? null;
  }

  function _parseApiRequestsJson(data) {
    const reserve = (data.reserves || [])[0];
    const ticketId = reserve ? String(reserve.purchaseid || '') : '';

    const dp = new DOMParser();

    // Find the debit_reserve record — it has the full Bet XML
    const debitRec = (data.apiRequests || []).find(r => r.operationType === 'debit_reserve');
    if (!debitRec) return null;
    const debitXml = dp.parseFromString(debitRec.reqparams, 'text/xml');

    // Each <Bet> element = one selection
    const betEls = [...debitXml.querySelectorAll('Bet')];
    if (!betEls.length) return null;

    // Get final status per BetID from the latest credit_customer settlement
    const creditRecs = (data.apiRequests || [])
      .filter(r => r.operationType === 'credit_customer')
      .sort((a, b) => new Date(b.creationdate) - new Date(a.creationdate));
    const betFinalStatus = {};  // betId → { statusNum, statusStr }
    creditRecs.forEach(cr => {
      const cx = dp.parseFromString(cr.reqparams, 'text/xml');
      cx.querySelectorAll('Change').forEach(chg => {
        chg.querySelectorAll('Bet').forEach(b => {
          const bid = b.getAttribute('ID');
          if (bid && !(bid in betFinalStatus)) {
            const ns = chg.getAttribute('NewStatus') || b.getAttribute('NewStatus') || '';
            betFinalStatus[bid] = { statusNum: _apiStatusStrToNum(ns), statusStr: ns };
          }
        });
      });
    });

    // Build one selection per Bet element
    const selections = betEls.map(bet => {
      const a = name => bet.getAttribute(name) || '';
      const eventName     = a('EventName');
      const lineType      = a('LineTypeName');
      const yourBet       = a('YourBet');
      const scoreStr      = a('Score');          // "3:2"
      const betId         = a('BetID');
      const eventDate     = a('EventDate');      // UTC

      const scoreParts = scoreStr ? scoreStr.split(':') : [];
      const score1 = scoreParts.length >= 2 ? Number(scoreParts[0]) : null;
      const score2 = scoreParts.length >= 2 ? Number(scoreParts[1]) : null;

      const settled    = betFinalStatus[betId];
      const statusNum  = settled ? settled.statusNum : _apiStatusStrToNum(a('Status'));
      const statusStr  = settled ? settled.statusStr : (a('Status') || '');

      return {
        eventName,
        eventId:          a('NewEventID') || a('EventID') || '',
        leagueName:       a('LeagueName') || '',
        startDate:        eventDate ? eventDate + (eventDate.endsWith('Z') ? '' : 'Z') : null,
        status:           statusNum,
        lineType,
        selectionName:    yourBet,
        score1, score2,
        settlementResult: statusStr,
        betLines: [{ lineType, selectionName: yourBet, status: statusNum, score1, score2, settlementResult: statusStr }],
      };
    }).filter(s => s.eventName);

    if (!selections.length || !ticketId) return null;

    // Group by eventId (same-event multi-line)
    const evtMap = {}, evtOrder = [];
    selections.forEach(s => {
      const key = s.eventId || s.eventName;
      if (!evtMap[key]) { evtMap[key] = { ...s, betLines: [] }; evtOrder.push(key); }
      if (s.status === 0) evtMap[key].status = 0;
      evtMap[key].betLines.push(...s.betLines);
    });

    return { ticketId, selections: evtOrder.map(k => evtMap[k]) };
  }

  function _autoParseJson(overlay) {
    const ta = document.getElementById('json-import-ta');
    if (!ta) return;
    const raw = ta.value.trim();
    if (!raw) return;

    let data;
    try { data = JSON.parse(raw); } catch(e) {
      const err = document.getElementById('json-parse-err');
      if (err) { err.textContent = '⚠ JSON 格式錯誤，請確認後再試'; err.style.display = 'block'; }
      return;
    }

    // ── apiRequests format (wallet API log) ──
    if (data.apiRequests && data.reserves) {
      const parsed = _parseApiRequestsJson(data);
      const err = document.getElementById('json-parse-err');
      if (!parsed) {
        if (err) { err.textContent = '⚠ 找不到 Bet 資料 (reqparams XML)'; err.style.display = 'block'; }
        return;
      }
      _jsonImportData = parsed;
      _renderJsonSelectionState(overlay);
      return;
    }

    // ── existing Selections format ──
    const ticketMatch = raw.match(/"SQLTicketId"\s*:\s*(\d+)/);
    const ticketId = ticketMatch ? ticketMatch[1] : String(data.SQLTicketId || '');
    const rawSelections = (data.Selections || []).map(s => ({
      eventName:        s.EventName || '',
      eventId:          s.EventId || '',
      leagueName:       s.LeagueName || s.League || s.CompetitionName || '',
      startDate:        s.StartEventDate || null,
      status:           s.SelectionStatus ?? null,
      lineType:         s.MarketTypeName || s.MarketName || s.LineTypeName || '',
      selectionName:    s.SelectionName || '',
      score1:           s.Score1 ?? null,
      score2:           s.Score2 ?? null,
      settlementResult: s.SettlementResult || '',
      rowTypeId:        s.RowTypeId ?? 1,
      lineTypeId:       s.LineTypeId ?? 1,
    })).filter(s => s.eventName && !(
      (s.selectionName || '').includes('|') && (s.lineType || '').includes('|')
    ));

    // group by EventId so multi-line bets on same event become one entry
    const _evtMap = {}, _evtOrder = [];
    rawSelections.forEach(s => {
      const key = s.eventId || s.eventName;
      if (!_evtMap[key]) {
        _evtMap[key] = { ...s, betLines: [] };
        _evtOrder.push(key);
      }
      // if any sub-selection is Opened, mark the whole event as Opened
      if (s.status === 0) _evtMap[key].status = 0;
      _evtMap[key].betLines.push({
        lineType: s.lineType, selectionName: s.selectionName,
        status: s.status, score1: s.score1, score2: s.score2, settlementResult: s.settlementResult,
      });
    });
    const selections = _evtOrder.map(k => _evtMap[k]);

    const err = document.getElementById('json-parse-err');
    if (!ticketId) {
      if (err) { err.textContent = '⚠ 找不到 SQLTicketId'; err.style.display = 'block'; }
      return;
    }
    if (selections.length === 0) {
      if (err) { err.textContent = '⚠ 找不到任何賽事 (EventName)'; err.style.display = 'block'; }
      return;
    }

    _jsonImportData = { ticketId, selections };

    _renderJsonSelectionState(overlay);
  }
