<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Reminder4ME</title>
  <style>
    :root {
      --bg:           #f0ebe4;
      --surface:      #faf8f5;
      --surface2:     #ede8e0;
      --border:       #ddd5c8;
      --border-light: #ece6de;
      --text-pri:     #4a4238;
      --text-sec:     #8a7d72;
      --text-muted:   #b5a99e;
      --blue:         #8facc8;
      --blue-light:   #c5d5e8;
      --blue-bg:      rgba(143,172,200,0.12);
      --orange:       #c4956a;
      --orange-bg:    rgba(196,149,106,0.12);
      --red:          #c47878;
      --red-bg:       rgba(196,120,120,0.12);
      --green:        #7aab8a;
      --green-bg:     rgba(122,171,138,0.12);
      --green-border: rgba(122,171,138,0.4);
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang TC', sans-serif;
      background: var(--bg);
      color: var(--text-pri);
      min-height: 100vh;
    }

    /* ── Header ── */
    .header {
      background: var(--surface);
      border-bottom: 1px solid var(--border);
      padding: 14px 24px;
      display: flex;
      align-items: center;
      gap: 12px;
      position: sticky;
      top: 0;
      z-index: 10;
    }
    .header h1 { font-size: 15px; font-weight: 700; color: var(--text-pri); }
    .header-badge {
      background: var(--red);
      color: #fff;
      border-radius: 10px;
      font-size: 11px;
      font-weight: 700;
      padding: 2px 8px;
      min-width: 22px;
      text-align: center;
      display: none;
    }
    .header-badge.show { display: inline-block; }
    .notification-btn {
      margin-left: auto;
      padding: 6px 12px;
      background: var(--surface2);
      border: 1px solid var(--border);
      border-radius: 6px;
      color: var(--text-sec);
      font-size: 12px;
      cursor: pointer;
    }
    .notification-btn.granted { color: var(--green); border-color: var(--green-border); }

    /* ── Layout ── */
    .container { max-width: 1020px; margin: 0 auto; padding: 16px 20px; }
    .main-layout { display: grid; grid-template-columns: 360px 1fr; gap: 20px; align-items: start; }
    .right-col { min-width: 0; }
    @media (max-width: 720px) { .main-layout { grid-template-columns: 1fr; } }

    /* ── Back to top ── */
    .back-to-top {
      position: fixed;
      bottom: 24px;
      right: 20px;
      width: 40px;
      height: 40px;
      border-radius: 50%;
      background: var(--blue);
      color: #fff;
      border: none;
      font-size: 18px;
      cursor: pointer;
      box-shadow: 0 4px 16px rgba(143,172,200,0.4);
      display: none;
      align-items: center;
      justify-content: center;
      z-index: 900;
      transition: opacity 0.2s;
    }
    .back-to-top.show { display: flex; }
    .back-to-top:hover { background: #7a9ab8; }

    /* ── Form card ── */
    .form-card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 14px;
      margin-bottom: 16px;
    }
    .form-title {
      font-size: 11px;
      font-weight: 700;
      color: var(--text-muted);
      text-transform: uppercase;
      letter-spacing: 0.8px;
      margin-bottom: 12px;
    }
    .form-group { display: flex; flex-direction: column; gap: 5px; margin-bottom: 10px; }
    .form-group:last-child { margin-bottom: 0; }
    .form-group label { font-size: 12px; color: var(--text-sec); }
    .form-group input, .form-group textarea {
      background: var(--surface2);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 7px 10px;
      color: var(--text-pri);
      font-size: 13px;
      outline: none;
      transition: border-color 0.18s;
      width: 100%;
      font-family: inherit;
    }
    .form-group textarea { resize: vertical; min-height: 60px; }
    .form-group input:focus, .form-group textarea:focus { border-color: var(--blue); }
    .form-group input::placeholder, .form-group textarea::placeholder { color: var(--text-muted); }

    /* ── Group blocks ── */
    .group-list { display: flex; flex-direction: column; gap: 10px; margin-bottom: 10px; }
    .group-block {
      background: var(--surface2);
      border: 1px solid var(--border-light);
      border-radius: 10px;
      padding: 12px 14px;
    }
    .group-block-header {
      display: flex;
      align-items: center;
      gap: 8px;
      margin-bottom: 8px;
    }
    .group-block-label { font-size: 11px; font-weight: 700; color: var(--text-muted); flex: 1; }
    .btn-remove-group {
      background: transparent;
      border: none;
      color: var(--text-muted);
      font-size: 17px;
      cursor: pointer;
      padding: 0 2px;
      line-height: 1;
    }
    .btn-remove-group:hover { color: var(--red); }
    .order-rows { display: flex; flex-direction: column; gap: 6px; margin-top: 6px; }
    .order-row { display: flex; gap: 6px; align-items: center; }
    .order-row input { flex: 1; }
    .btn-remove-order {
      background: transparent;
      border: none;
      color: var(--text-muted);
      font-size: 17px;
      cursor: pointer;
      padding: 0 3px;
      flex-shrink: 0;
      line-height: 1;
    }
    .btn-remove-order:hover { color: var(--red); }
    .btn-add-order {
      font-size: 12px;
      color: var(--blue);
      background: transparent;
      border: none;
      cursor: pointer;
      padding: 4px 0;
      text-decoration: underline;
      text-underline-offset: 2px;
    }
    .btn-add-order:hover { color: #7a9ab8; }
    .btn-add-group {
      width: 100%;
      padding: 9px;
      font-size: 13px;
      color: var(--blue);
      background: var(--blue-bg);
      border: 1px dashed var(--blue-light);
      border-radius: 8px;
      cursor: pointer;
      margin-bottom: 14px;
    }
    .btn-add-group:hover { background: rgba(143,172,200,0.2); }
    .shared-fields { display: flex; flex-direction: column; gap: 0; margin-bottom: 14px; }
    .btn-submit {
      width: 100%;
      padding: 11px;
      background: var(--blue);
      color: #fff;
      border: none;
      border-radius: 8px;
      font-size: 14px;
      font-weight: 700;
      cursor: pointer;
      transition: background 0.18s, transform 0.1s;
    }
    .btn-submit:hover { background: #7a9ab8; }
    .btn-submit:active { transform: scale(0.98); }

    /* ── Section header ── */
    .section-header {
      display: flex;
      align-items: center;
      gap: 8px;
      margin-bottom: 12px;
    }
    .section-title {
      font-size: 12px;
      font-weight: 700;
      color: var(--text-muted);
      text-transform: uppercase;
      letter-spacing: 0.8px;
    }
    .count-badge {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      background: var(--red);
      color: #fff;
      border-radius: 10px;
      font-size: 11px;
      font-weight: 700;
      padding: 2px 7px;
      min-width: 22px;
    }
    .count-badge.gray { background: var(--surface2); color: var(--text-sec); border: 1px solid var(--border); }

    /* ── Record card ── */
    .record-card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 8px;
      margin-bottom: 6px;
      overflow: hidden;
      transition: border-color 0.3s;
    }
    .record-card.warn  { border-color: var(--orange); }
    .record-card.alert { border-color: var(--red); background: rgba(196,120,120,0.04); }
    .card-header {
      display: flex;
      align-items: center;
      padding: 7px 10px 6px;
      border-bottom: 1px solid var(--border-light);
      gap: 6px;
    }
    .card-event-name {
      flex: 1;
      font-size: 12px;
      font-weight: 700;
      color: var(--text-pri);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .btn-msg {
      padding: 4px 10px;
      background: var(--surface2);
      border: 1px solid var(--border);
      border-radius: 6px;
      font-size: 12px;
      color: var(--text-sec);
      cursor: pointer;
      flex-shrink: 0;
    }
    .btn-msg:hover { background: var(--border-light); }
    .card-body {
      display: flex;
      align-items: flex-start;
      gap: 8px;
      padding: 8px 10px 10px;
    }

    /* ── Timer box ── */
    .timer-box {
      width: 58px;
      min-width: 58px;
      height: 50px;
      border-radius: 10px;
      border: 2px solid var(--border);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 1px;
      transition: border-color 0.3s, background 0.3s;
      flex-shrink: 0;
    }
    .timer-box .t-time {
      font-size: 14px;
      font-weight: 800;
      line-height: 1;
      font-variant-numeric: tabular-nums;
    }
    .timer-box .t-stage { font-size: 10px; font-weight: 600; letter-spacing: 0.3px; }
    .timer-box.normal { border-color: var(--blue); background: var(--blue-bg); }
    .timer-box.normal .t-time { color: var(--blue); }
    .timer-box.normal .t-stage { color: var(--blue); }
    .timer-box.warn   { border-color: var(--orange); background: var(--orange-bg); }
    .timer-box.warn   .t-time { color: var(--orange); }
    .timer-box.warn   .t-stage { color: var(--orange); }
    .timer-box.alert  { border-color: var(--red); background: var(--red-bg); }
    .timer-box.alert  .t-time { color: var(--red); }
    .timer-box.alert  .t-stage { color: var(--red); }
    .timer-box.expired { border-color: var(--red); background: var(--red-bg); animation: blink 1s infinite; }
    .timer-box.expired .t-time { color: var(--red); font-size: 11px; }
    .timer-box.expired .t-stage { color: var(--red); }
    @keyframes blink { 0%,100% { opacity:1; } 50% { opacity:0.45; } }

    /* ── Record info ── */
    .record-info { flex: 1; min-width: 0; }
    .order-tags { display: flex; flex-wrap: wrap; gap: 5px; margin-bottom: 6px; }
    .order-tag {
      display: inline-flex;
      align-items: center;
      gap: 4px;
      background: var(--blue-bg);
      border: 1px solid var(--blue-light);
      border-radius: 5px;
      padding: 2px 7px;
      font-size: 12px;
      color: var(--blue);
      font-weight: 600;
    }
    .btn-copy-tag {
      background: none;
      border: none;
      cursor: pointer;
      color: var(--text-muted);
      font-size: 12px;
      padding: 0;
      line-height: 1;
    }
    .btn-copy-tag:hover { color: var(--blue); }
    .record-req {
      font-size: 12px;
      color: var(--text-pri);
      font-weight: 600;
      margin-bottom: 2px;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .record-meta { font-size: 12px; color: var(--text-sec); line-height: 1.6; }
    .record-meta b { color: var(--text-pri); font-weight: 600; }

    /* ── Record actions ── */
    .record-actions { display: flex; flex-direction: column; gap: 5px; align-items: flex-end; flex-shrink: 0; }
    .btn-done {
      padding: 5px 12px;
      background: var(--green-bg);
      color: var(--green);
      border: 1px solid var(--green-border);
      border-radius: 6px;
      font-size: 12px;
      font-weight: 600;
      cursor: pointer;
      white-space: nowrap;
    }
    .btn-done:hover { background: rgba(122,171,138,0.22); }
    .btn-summary {
      padding: 5px 12px;
      background: var(--blue-bg);
      color: var(--blue);
      border: 1px solid var(--blue-light);
      border-radius: 6px;
      font-size: 12px;
      font-weight: 600;
      cursor: pointer;
      white-space: nowrap;
    }
    .btn-summary:hover { background: rgba(143,172,200,0.22); }
    .btn-restart {
      padding: 5px 12px;
      background: var(--orange-bg);
      color: var(--orange);
      border: 1px solid rgba(196,149,106,0.3);
      border-radius: 6px;
      font-size: 12px;
      font-weight: 600;
      cursor: pointer;
      white-space: nowrap;
    }
    .btn-restart:hover { background: rgba(196,149,106,0.22); }
    .btn-del {
      padding: 4px 10px;
      background: transparent;
      color: var(--text-muted);
      border: 1px solid var(--border);
      border-radius: 6px;
      font-size: 11px;
      cursor: pointer;
    }
    .btn-del:hover { color: var(--red); border-color: var(--red); }

    /* ── Empty state ── */
    .empty-state { text-align: center; padding: 36px; color: var(--text-muted); font-size: 14px; }

    /* ── Completed section ── */
    .completed-section { margin-top: 16px; }
    /* ── Pending timer ── */
    .timer-box.pending { border-color: var(--text-muted); background: var(--surface2); }
    .timer-box.pending .t-time { color: var(--text-muted); font-size: 11px; }
    .timer-box.pending .t-stage { color: var(--text-muted); }
    .toggle-row { cursor: pointer; display: flex; align-items: center; gap: 8px; user-select: none; }
    .toggle-row:hover .section-title { color: var(--text-sec); }
    .chevron { color: var(--text-muted); font-size: 11px; transition: transform 0.2s; }
    .chevron.open { transform: rotate(180deg); }
    .record-card.done { opacity: 0.55; }

    /* ── Popup overlay ── */
    .popup-overlay {
      position: fixed;
      inset: 0;
      background: rgba(74,66,56,0.45);
      z-index: 1000;
      display: flex;
      align-items: center;
      justify-content: center;
      animation: overlayIn 0.2s ease;
    }
    @keyframes overlayIn { from { opacity:0; } to { opacity:1; } }
    .popup-card {
      background: var(--surface);
      border: 2px solid var(--border);
      border-radius: 18px;
      padding: 24px 26px 26px;
      max-width: 440px;
      width: 92%;
      box-shadow: 0 16px 60px rgba(74,66,56,0.2);
      animation: cardUp 0.28s cubic-bezier(0.16,1,0.3,1);
      position: relative;
    }
    .popup-card.stage1 { border-color: var(--orange); }
    .popup-card.stage2 { border-color: var(--red); }
    .popup-card.submit-popup { border-color: var(--green); }
    @keyframes cardUp { from { transform: translateY(20px) scale(0.97); opacity:0; } to { transform: none; opacity:1; } }
    .popup-close-btn {
      position: absolute; top: 14px; right: 16px;
      background: none; border: none; font-size: 20px;
      color: var(--text-muted); cursor: pointer; line-height: 1;
    }
    .popup-close-btn:hover { color: var(--text-pri); }
    .popup-badge {
      display: inline-block;
      padding: 4px 12px;
      border-radius: 20px;
      font-size: 11px;
      font-weight: 800;
      letter-spacing: 0.5px;
      margin-bottom: 12px;
    }
    .popup-badge.first  { background: var(--orange-bg); color: var(--orange); border: 1px solid rgba(196,149,106,0.35); }
    .popup-badge.final  { background: var(--red-bg); color: var(--red); border: 1px solid rgba(196,120,120,0.4); animation: pulse 0.9s infinite; }
    .popup-badge.success{ background: var(--green-bg); color: var(--green); border: 1px solid var(--green-border); }
    .popup-badge.info   { background: var(--blue-bg); color: var(--blue); border: 1px solid var(--blue-light); }
    @keyframes pulse { 0%,100% { opacity:1; } 50% { opacity:0.5; } }
    .popup-event-name { font-size: 20px; font-weight: 800; color: var(--text-pri); margin-bottom: 14px; }
    .popup-title { font-size: 16px; font-weight: 700; color: var(--text-pri); margin-bottom: 14px; }
    .reply-box {
      background: var(--surface2);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 12px 14px;
      margin-bottom: 12px;
      font-size: 13px;
      color: var(--text-pri);
      line-height: 1.75;
      white-space: pre-wrap;
      word-break: break-word;
    }
    .submit-content-box {
      background: var(--surface2);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 12px 14px;
      margin-bottom: 12px;
      font-size: 13px;
      color: var(--text-pri);
      line-height: 1.75;
      white-space: pre-wrap;
      word-break: break-word;
      font-family: 'Menlo', 'Courier New', monospace;
    }
    .reply-rows { display: flex; flex-direction: column; gap: 6px; margin-bottom: 14px; }
    .reply-row {
      display: flex;
      align-items: center;
      gap: 8px;
      background: var(--surface2);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 8px 10px;
    }
    .reply-row-text {
      flex: 1;
      font-size: 12px;
      color: var(--text-pri);
      line-height: 1.5;
      word-break: break-word;
      white-space: pre-wrap;
    }
    .btn-copy-inline {
      flex-shrink: 0;
      background: none;
      border: none;
      cursor: pointer;
      font-size: 15px;
      color: var(--text-muted);
      padding: 2px 4px;
      border-radius: 4px;
      transition: color 0.15s;
    }
    .btn-copy-inline:hover { color: var(--blue); background: var(--blue-bg); }
    .btn-copy-inline.copied { color: var(--green); }
    .btn-copy-reply {
      width: 100%;
      padding: 9px;
      background: var(--blue-bg);
      color: var(--blue);
      border: 1px solid var(--blue-light);
      border-radius: 8px;
      font-size: 13px;
      font-weight: 600;
      cursor: pointer;
      margin-bottom: 14px;
      transition: background 0.18s;
    }
    .btn-copy-reply:hover { background: rgba(143,172,200,0.22); }
    .btn-copy-reply.copied { background: var(--green-bg); color: var(--green); border-color: var(--green-border); }
    .popup-queue-note { font-size: 12px; color: var(--text-muted); text-align: center; margin-bottom: 12px; }
    .popup-btns { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
    .popup-btns.single { grid-template-columns: 1fr; }
    .btn-popup-done {
      padding: 12px;
      background: var(--green-bg);
      color: var(--green);
      border: 1px solid var(--green-border);
      border-radius: 9px;
      font-size: 14px;
      font-weight: 700;
      cursor: pointer;
    }
    .btn-popup-done:hover { background: rgba(122,171,138,0.25); }
    .btn-popup-sec {
      padding: 12px;
      background: var(--surface2);
      color: var(--text-sec);
      border: 1px solid var(--border);
      border-radius: 9px;
      font-size: 14px;
      font-weight: 600;
      cursor: pointer;
    }
    .btn-popup-sec:hover { background: var(--border); color: var(--text-pri); }
    .msg-textarea {
      width: 100%;
      min-height: 100px;
      background: var(--surface2);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 10px 12px;
      font-size: 13px;
      color: var(--text-pri);
      font-family: inherit;
      resize: vertical;
      outline: none;
      margin-bottom: 12px;
    }
    .msg-textarea:focus { border-color: var(--blue); }

    /* ── Responsive ── */
    @media (max-width: 520px) {
      .card-body { flex-wrap: wrap; }
      .record-actions { flex-direction: row; }
    }
  </style>
</head>
<body>

<div class="header">
  <h1>回覆提醒</h1>
  <span class="header-badge" id="header-badge">0</span>
  <button class="notification-btn" id="notif-btn" onclick="requestNotifPermission()">🔔 開啟通知</button>
</div>

<div class="container">
  <div class="main-layout">

    <!-- ── Left: Add form ── -->
    <div class="left-col">
      <div class="form-card">
        <div class="form-title">新增記錄</div>
        <form id="add-form" onsubmit="handleSubmit(event)">
          <div class="group-list" id="group-list"></div>
          <button type="button" class="btn-add-group" onclick="addFormGroup()">＋ 新增賽事群組</button>
          <div class="shared-fields">
            <div class="form-group">
              <label>需求 *</label>
              <input id="f-req" placeholder="客戶的需求或問題描述" autocomplete="off" required>
            </div>
            <div class="form-group">
              <label>群組名稱 *</label>
              <input id="f-group" placeholder="群組名稱" autocomplete="off" required>
            </div>
            <div class="form-group">
              <label>附加資訊</label>
              <textarea id="f-info" placeholder="選填，附加說明…"></textarea>
            </div>
          </div>
          <button type="submit" class="btn-submit">⏱ 添加計時器</button>
        </form>
      </div>
    </div>

    <!-- ── Right: Records ── -->
    <div class="right-col">
      <div class="section-header">
        <span class="section-title">待處理</span>
        <span class="count-badge" id="active-count" style="display:none">0</span>
      </div>
      <div id="active-records"></div>

      <div class="completed-section">
        <div class="section-header toggle-row" onclick="toggleCompleted()">
          <span class="section-title">已完成</span>
          <span class="count-badge gray" id="done-count">0</span>
          <span class="chevron" id="chevron">▼</span>
        </div>
        <div id="completed-list" style="display:none">
          <div id="completed-records"></div>
        </div>
      </div>
    </div>

  </div>
</div>

<button class="back-to-top" id="back-to-top" onclick="window.scrollTo({top:0,behavior:'smooth'})" title="回到頂部">↑</button>

<!-- ── Popup (injected dynamically) ── -->

<script>
  const STAGE1_MS   = 9 * 60 * 1000;
  const STAGE2_MS   = 9 * 60 * 1000;
  const STORAGE_KEY = 'reminder4me_v3';

  let records      = [];
  let timerHandles = {};
  let popupQueue   = [];
  let activePopupId = null;
  let _pendingCopy = '';   // stores text for popup copy buttons
  let _replyTexts  = { zh: '', en: '', kr: '' };

  // ── Form group state ──
  let groupCounter = 0;
  let formGroups   = []; // [{id, eventName, orderNos:[]}]

  function save() { localStorage.setItem(STORAGE_KEY, JSON.stringify(records)); }
  function load() {
    try { const raw = localStorage.getItem(STORAGE_KEY); records = raw ? JSON.parse(raw) : []; }
    catch(e) { records = []; }
  }

  // ── Helpers ──
  function getRemaining(r) {
    if (r.completedAt) return -1;
    if (r.stage >= 3) return null; // pending — no countdown
    if (r.stage === 1) return STAGE1_MS - (Date.now() - r.createdAt);
    return STAGE2_MS - (Date.now() - (r.stage2StartAt || r.createdAt));
  }
  function timerClass(ms) {
    if (ms === null)  return 'pending';
    if (ms <= 0)      return 'expired';
    if (ms < 60000)   return 'alert';
    if (ms < 3*60000) return 'warn';
    return 'normal';
  }
  function cardClass(ms) {
    if (ms === null || ms > 0 && ms >= 60000) return ms === null ? '' : ms < 3*60000 ? 'warn' : '';
    if (ms <= 0 || ms < 60000) return 'alert';
    return '';
  }
  function fmtTime(ms) {
    if (ms === null) return '待定';
    if (ms <= 0) return '超時';
    const s = Math.ceil(ms / 1000);
    return `${String(Math.floor(s/60)).padStart(2,'0')}:${String(s%60).padStart(2,'0')}`;
  }
  function fmtDuration(ms) {
    const m = Math.floor(ms/60000), s = Math.floor((ms%60000)/1000);
    return m > 0 ? `${m}m${s}s` : `${s}s`;
  }
  function esc(s) {
    return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
  }
  function sortedActive() {
    return records.filter(r => !r.completedAt).sort((a,b) => {
      const ra = getRemaining(a), rb = getRemaining(b);
      if (ra === null && rb === null) return 0;
      if (ra === null) return 1;
      if (rb === null) return -1;
      return ra - rb;
    });
  }
  function sortedDone() {
    return records.filter(r => r.completedAt).sort((a,b) => b.completedAt - a.completedAt);
  }

  // ── Copy util ──
  function copyText(text, btn) {
    navigator.clipboard.writeText(text).then(() => {
      if (btn) {
        const orig = btn.textContent;
        btn.textContent = '✓ 已複製';
        btn.classList.add('copied');
        setTimeout(() => { btn.textContent = orig; btn.classList.remove('copied'); }, 1800);
      }
    }).catch(() => {
      const ta = document.createElement('textarea');
      ta.value = text; document.body.appendChild(ta); ta.select();
      document.execCommand('copy'); document.body.removeChild(ta);
    });
  }
  function copyReply(lang, btn) { copyText(_replyTexts[lang] || '', btn); }

  // ── Form group management ──
  function syncGroupValues() {
    formGroups.forEach(g => {
      const container = document.querySelector(`[data-group="${g.id}"]`);
      if (!container) return;
      g.orderNos   = Array.from(container.querySelectorAll('.order-input')).map(i => i.value);
      g.eventNames = Array.from(container.querySelectorAll('.event-input')).map(i => i.value);
    });
  }

  function renderFormGroups() {
    const list = document.getElementById('group-list');
    list.innerHTML = formGroups.map((g, idx) => `
      <div class="group-block" data-group="${g.id}">
        <div class="group-block-header">
          <span class="group-block-label">賽事群組 ${idx+1}</span>
          ${formGroups.length > 1 ? `<button type="button" class="btn-remove-group" onclick="removeFormGroup('${g.id}')">×</button>` : ''}
        </div>
        <div class="form-group">
          <label>注單號</label>
          <div class="order-rows" id="order-rows-${g.id}">
            ${g.orderNos.map((o, oi) => `
              <div class="order-row">
                <input class="order-input" value="${esc(o)}" placeholder="注單號（選填）" autocomplete="off">
                ${g.orderNos.length > 1 ? `<button type="button" class="btn-remove-order" onclick="removeOrderNo('${g.id}',${oi})">×</button>` : ''}
              </div>`).join('')}
          </div>
          <button type="button" class="btn-add-order" onclick="addOrderNo('${g.id}')">＋ 新增注單號</button>
        </div>
        <div class="form-group">
          <label>賽事名稱 *</label>
          <div class="order-rows" id="event-rows-${g.id}">
            ${g.eventNames.map((e, ei) => `
              <div class="order-row">
                <input class="event-input" value="${esc(e)}" placeholder="賽事名稱" autocomplete="off" required>
                ${g.eventNames.length > 1 ? `<button type="button" class="btn-remove-order" onclick="removeEventName('${g.id}',${ei})">×</button>` : ''}
              </div>`).join('')}
          </div>
          <button type="button" class="btn-add-order" onclick="addEventName('${g.id}')">＋ 新增賽事名稱</button>
        </div>
      </div>`).join('');
  }

  function addFormGroup() {
    syncGroupValues();
    const id = `g${++groupCounter}`;
    formGroups.push({ id, orderNos: [''], eventNames: [''] });
    renderFormGroups();
  }

  function removeFormGroup(id) {
    syncGroupValues();
    formGroups = formGroups.filter(g => g.id !== id);
    renderFormGroups();
  }

  function addOrderNo(gid) {
    syncGroupValues();
    const g = formGroups.find(x => x.id === gid);
    if (g) g.orderNos.push('');
    renderFormGroups();
  }

  function removeOrderNo(gid, idx) {
    syncGroupValues();
    const g = formGroups.find(x => x.id === gid);
    if (g && g.orderNos.length > 1) g.orderNos.splice(idx, 1);
    renderFormGroups();
  }

  function addEventName(gid) {
    syncGroupValues();
    const g = formGroups.find(x => x.id === gid);
    if (g) g.eventNames.push('');
    renderFormGroups();
  }

  function removeEventName(gid, idx) {
    syncGroupValues();
    const g = formGroups.find(x => x.id === gid);
    if (g && g.eventNames.length > 1) g.eventNames.splice(idx, 1);
    renderFormGroups();
  }

  function initFormGroups() {
    groupCounter = 0;
    formGroups = [{ id: `g${++groupCounter}`, orderNos: [''], eventNames: [''] }];
    renderFormGroups();
  }

  // ── Record CRUD ──
  function addRecord(eventName, orderNos, requirement, group, additionalInfo) {
    const r = {
      id:             `r${Date.now()}${Math.random().toString(36).slice(2,5)}`,
      eventName:      eventName.trim(),
      orderNos:       orderNos.map(o => o.trim()).filter(Boolean),
      requirement:    requirement.trim(),
      group:          group.trim(),
      additionalInfo: additionalInfo.trim(),
      createdAt:      Date.now(),
      stage:          1,
      stage2StartAt:  null,
      completedAt:    null,
      eventNote:      '',
    };
    records.push(r);
    save();
    schedule(r);
    fullRender();
    return r;
  }

  function markDone(id) {
    const r = records.find(x => x.id === id);
    if (!r || r.completedAt) return;
    r.completedAt = Date.now();
    clearTimeout(timerHandles[id]);
    delete timerHandles[id];
    popupQueue = popupQueue.filter(x => x !== id);
    if (activePopupId === id) dismissPopup();
    save(); fullRender();
  }

  function deleteRecord(id) {
    records = records.filter(x => x.id !== id);
    clearTimeout(timerHandles[id]);
    delete timerHandles[id];
    popupQueue = popupQueue.filter(x => x !== id);
    if (activePopupId === id) dismissPopup();
    save(); fullRender();
  }

  function ackStage1(id) {
    const r = records.find(x => x.id === id);
    if (!r || r.stage !== 1) return;
    r.stage = 2; r.stage2StartAt = Date.now();
    save(); dismissPopup(); schedule(r); fullRender();
  }

  function dismissAndPend(id) {
    const r = records.find(x => x.id === id);
    if (r && r.stage === 2) {
      r.stage = 3;
      clearTimeout(timerHandles[id]);
      delete timerHandles[id];
      save(); fullRender();
    }
    dismissPopup();
  }

  function restartTimer(id) {
    const r = records.find(x => x.id === id);
    if (!r) return;
    clearTimeout(timerHandles[id]);
    delete timerHandles[id];
    // If pending (stage 3), reset to stage 1 first
    if (r.stage >= 3) {
      r.stage = 1; r.createdAt = Date.now(); r.stage2StartAt = null;
      save();
    }
    // Clear from queue and immediately show current stage popup
    popupQueue = popupQueue.filter(x => x !== id);
    if (activePopupId === id) { const el = document.getElementById('popup-overlay'); if (el) el.remove(); activePopupId = null; }
    fullRender();
    activePopupId = id;
    renderPopup(r);
    playSound();
    sendBrowserNotif(r);
  }

  // ── Timer scheduling ──
  function schedule(r) {
    if (r.completedAt || r.stage >= 3) return;
    clearTimeout(timerHandles[r.id]);
    const remaining = getRemaining(r);
    if (remaining <= 0) enqueue(r.id);
    else timerHandles[r.id] = setTimeout(() => enqueue(r.id), remaining);
  }
  function scheduleAll() { records.filter(r => !r.completedAt).forEach(schedule); }

  // ── Popup queue ──
  function enqueue(id) {
    if (popupQueue.includes(id) || activePopupId === id) return;
    const r = records.find(x => x.id === id);
    if (!r || r.completedAt) return;
    popupQueue.push(id);
    processQueue();
  }
  function processQueue() {
    if (activePopupId || popupQueue.length === 0) return;
    const id = popupQueue.shift();
    const r  = records.find(x => x.id === id);
    if (!r || r.completedAt) { processQueue(); return; }
    activePopupId = id;
    renderPopup(r);
    playSound();
    sendBrowserNotif(r);
  }
  function dismissPopup() {
    activePopupId = null;
    const el = document.getElementById('popup-overlay');
    if (el) el.remove();
    setTimeout(processQueue, 200);
  }

  // ── Sound ──
  function playSound() {
    try {
      const ctx = new (window.AudioContext || window.webkitAudioContext)();
      const beep = (freq, start, dur, vol=0.28) => {
        const osc = ctx.createOscillator(), gain = ctx.createGain();
        osc.connect(gain); gain.connect(ctx.destination);
        osc.type = 'sine'; osc.frequency.value = freq;
        gain.gain.setValueAtTime(vol, ctx.currentTime + start);
        gain.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + start + dur);
        osc.start(ctx.currentTime + start);
        osc.stop(ctx.currentTime + start + dur + 0.01);
      };
      beep(880,0.00,0.12); beep(1100,0.18,0.12); beep(880,0.36,0.22);
    } catch(e) {}
  }

  // ── Notifications ──
  async function requestNotifPermission() {
    if (!('Notification' in window)) { alert('此瀏覽器不支援桌面通知'); return; }
    const result = await Notification.requestPermission();
    updateNotifBtn();
    if (result === 'granted') new Notification('✅ 通知已開啟', { body: '提醒出現時會同步通知您' });
  }
  function updateNotifBtn() {
    const btn = document.getElementById('notif-btn');
    if (!btn) return;
    if (!('Notification' in window)) { btn.style.display='none'; return; }
    if (Notification.permission === 'granted') {
      btn.textContent = '🔔 通知已開啟'; btn.classList.add('granted'); btn.disabled = true;
    } else {
      btn.textContent = '🔔 開啟通知'; btn.classList.remove('granted'); btn.disabled = false;
    }
  }
  function sendBrowserNotif(r) {
    if (!('Notification' in window) || Notification.permission !== 'granted') return;
    const stage = r.stage === 1 ? '第一次提醒' : '最終提醒！';
    new Notification(`${stage} ─ ${r.eventName}`, {
      body: `需求：${r.requirement}\n群組：${r.group}`,
      requireInteraction: true,
    });
  }

  // ── Render ──
  function fullRender() {
    renderActive(); renderDone(); updateHeaderBadge();
    if (activePopupId) {
      const r = records.find(x => x.id === activePopupId);
      if (r) renderPopup(r);
    }
  }

  function renderActive() {
    const active = sortedActive();
    const el = document.getElementById('active-records');
    const badge = document.getElementById('active-count');
    badge.textContent = active.length;
    badge.style.display = active.length ? 'inline-flex' : 'none';
    if (active.length === 0) { el.innerHTML = '<div class="empty-state">目前沒有待處理的記錄</div>'; return; }
    el.innerHTML = active.map(r => {
      const ms = getRemaining(r), tc = timerClass(ms), cc = cardClass(ms), t = fmtTime(ms);
      const stageLabel = r.stage === 1 ? '第1次' : r.stage === 2 ? '第2次' : '待定';
      const orderTagsHtml = r.orderNos.length
        ? r.orderNos.map(o => `<span class="order-tag">${esc(o)}<button class="btn-copy-tag" title="複製" data-val="${esc(o)}" onclick="copyText(this.dataset.val,this)">⧉</button></span>`).join('')
        : '';
      return `
        <div class="record-card ${cc}" id="card-${r.id}">
          <div class="card-header">
            <span class="card-event-name">🏆 ${esc(r.eventName)}</span>
            <button class="btn-msg" onclick="openMsgPopup('${r.id}')">📝 訊息</button>
          </div>
          <div class="card-body">
            <div class="timer-box ${tc}" id="timer-${r.id}">
              <span class="t-time">${t}</span>
              <span class="t-stage">${stageLabel}</span>
            </div>
            <div class="record-info">
              ${orderTagsHtml ? `<div class="order-tags">${orderTagsHtml}</div>` : ''}
              <div class="record-req" title="${esc(r.requirement)}">${esc(r.requirement)}</div>
              <div class="record-meta">群組：<b>${esc(r.group)}</b>${r.additionalInfo ? `<br>備註：${esc(r.additionalInfo)}` : ''}</div>
            </div>
            <div class="record-actions">
              <button class="btn-done"    onclick="markDone('${r.id}')">✓ 搞定</button>
              <button class="btn-summary" onclick="showSummaryPopup('${r.id}')">📋 概要</button>
              <button class="btn-restart" onclick="restartTimer('${r.id}')">↺ 重新計時</button>
              <button class="btn-del"     onclick="deleteRecord('${r.id}')">移除</button>
            </div>
          </div>
        </div>`;
    }).join('');
  }

  function renderDone() {
    const done = sortedDone();
    const el = document.getElementById('completed-records');
    document.getElementById('done-count').textContent = done.length;
    if (done.length === 0) { el.innerHTML = '<div class="empty-state">沒有已完成的記錄</div>'; return; }
    el.innerHTML = done.slice(0,30).map(r => {
      const dur = fmtDuration(r.completedAt - r.createdAt);
      return `
        <div class="record-card done">
          <div class="card-header">
            <span class="card-event-name">🏆 ${esc(r.eventName)}</span>
          </div>
          <div class="card-body">
            <div class="timer-box" style="border-color:var(--border)">
              <span class="t-time" style="font-size:12px;color:var(--text-muted)">${dur}</span>
              <span class="t-stage" style="color:var(--text-muted)">完成</span>
            </div>
            <div class="record-info">
              <div class="record-req">${esc(r.requirement)}</div>
              <div class="record-meta">群組：<b>${esc(r.group)}</b></div>
            </div>
            <div class="record-actions">
              <button class="btn-del" onclick="deleteRecord('${r.id}')">刪除</button>
            </div>
          </div>
        </div>`;
    }).join('');
  }

  // ── Popups ──
  function renderPopup(r, forceFinal = false) {
    const existing = document.getElementById('popup-overlay');
    if (existing) existing.remove();
    const isFinal   = forceFinal || r.stage === 2;
    const queueLeft = popupQueue.length;
    const name      = r.eventName;

    _replyTexts = isFinal ? {
      en: `${name}\nWe've escalated to the relevant team for investigation and we will keep you posted. Thank you for your patience. - Sunny`,
      zh: `${name}\n已为您提交相关单位确认，若有进一步更新，将会立即与您告知，提前感谢您的耐心。- Sunny`,
      kr: `${name}\n해당 팀에 조사를 요청했으며, 진행 상황을 계속 알려드리겠습니다. 기다려 주셔서 감사합니다. - Sunny`,
    } : {
      en: `${name}\nOne moment. We've submitted it to the relevant department. - Sunny`,
      zh: `${name}\n已为您反馈至相关单位查询中，请您稍候。- Sunny`,
      kr: `${name}\n잠시만요. 관련 부서에 제출했습니다. - Sunny`,
    };

    const overlay = document.createElement('div');
    overlay.id = 'popup-overlay';
    overlay.className = 'popup-overlay';
    overlay.innerHTML = `
      <div class="popup-card ${isFinal ? 'stage2' : 'stage1'}">
        <button class="popup-close-btn" onclick="dismissPopup()">×</button>
        <div class="popup-badge ${isFinal ? 'final' : 'first'}">${isFinal ? '⚠️ 最終提醒' : '🔔 第一次提醒'}</div>
        <div class="popup-event-name">🏆 ${esc(name)}</div>
        <div class="reply-rows">
          <div class="reply-row">
            <span class="reply-row-text">${esc(_replyTexts.en)}</span>
            <button class="btn-copy-inline" onclick="copyReply('en',this)" title="Copy">📋</button>
          </div>
          <div class="reply-row">
            <span class="reply-row-text">${esc(_replyTexts.zh)}</span>
            <button class="btn-copy-inline" onclick="copyReply('zh',this)" title="複製">📋</button>
          </div>
          <div class="reply-row">
            <span class="reply-row-text">${esc(_replyTexts.kr)}</span>
            <button class="btn-copy-inline" onclick="copyReply('kr',this)" title="복사">📋</button>
          </div>
        </div>
        ${queueLeft > 0 ? `<div class="popup-queue-note">還有 ${queueLeft} 個提醒在等待中</div>` : ''}
        <div class="popup-btns">
          <button class="btn-popup-done" onclick="markDone('${r.id}')">✓ 已回覆</button>
          <button class="btn-popup-sec" onclick="${isFinal ? `dismissAndPend('${r.id}')` : `ackStage1('${r.id}')`}">${isFinal ? '關閉' : '繼續計時'}</button>
        </div>
      </div>`;
    document.body.appendChild(overlay);
  }

  function openMsgPopup(id) {
    const r = records.find(x => x.id === id);
    if (!r) return;
    const existing = document.getElementById('popup-overlay');
    if (existing) existing.remove();
    const overlay = document.createElement('div');
    overlay.id = 'popup-overlay';
    overlay.className = 'popup-overlay';
    overlay.innerHTML = `
      <div class="popup-card msg-popup" style="border-color:var(--border)">
        <button class="popup-close-btn" onclick="closeMsgPopup()">×</button>
        <div class="popup-badge info">📝 賽事記錄</div>
        <div class="popup-title">🏆 ${esc(r.eventName)}</div>
        <textarea class="msg-textarea" id="msg-textarea-${id}" placeholder="在此輸入賽事相關訊息...">${esc(r.eventNote || '')}</textarea>
        <button class="btn-copy-reply" onclick="saveCopyMsg('${id}',this)">📋 複製記錄</button>
      </div>`;
    document.body.appendChild(overlay);
  }

  function closeMsgPopup() {
    const el = document.getElementById('popup-overlay');
    if (el) el.remove();
  }

  function saveCopyMsg(id, btn) {
    const r = records.find(x => x.id === id);
    if (!r) return;
    const ta = document.getElementById(`msg-textarea-${id}`);
    r.eventNote = ta ? ta.value : '';
    save();
    copyText(`${r.eventName}\n${r.eventNote}`, btn);
  }

  function buildSummaryText(groups, requirement, group, additionalInfo) {
    const parts = [];
    groups.forEach(g => {
      g.orderNos.filter(Boolean).forEach(o => parts.push(o));
      (g.eventNames || []).filter(Boolean).forEach(e => parts.push(e));
    });
    parts.push(requirement, group);
    if (additionalInfo) parts.push(additionalInfo);
    return parts.join('\n');
  }

  function getRecordSummary(id) {
    const r = records.find(x => x.id === id);
    if (!r) return '';
    const parts = [...r.orderNos.filter(Boolean), r.eventName, r.requirement, r.group];
    if (r.additionalInfo) parts.push(r.additionalInfo);
    return parts.join('\n');
  }

  function showSummaryPopup(id) {
    const content = getRecordSummary(id);
    if (!content) return;
    _pendingCopy = content;
    const existing = document.getElementById('popup-overlay');
    if (existing) existing.remove();
    const overlay = document.createElement('div');
    overlay.id = 'popup-overlay';
    overlay.className = 'popup-overlay';
    overlay.innerHTML = `
      <div class="popup-card submit-popup">
        <button class="popup-close-btn" onclick="dismissPopup()">×</button>
        <div class="popup-badge success">📋 概要</div>
        <div class="submit-content-box">${esc(content)}</div>
        <button class="btn-copy-reply" onclick="copyText(_pendingCopy,this)">📋 複製內容</button>
      </div>`;
    document.body.appendChild(overlay);
  }

  function showSubmitPopup(groups, requirement, group, additionalInfo) {
    const content = buildSummaryText(groups, requirement, group, additionalInfo);
    _pendingCopy = content;

    const existing = document.getElementById('popup-overlay');
    if (existing) existing.remove();
    const overlay = document.createElement('div');
    overlay.id = 'popup-overlay';
    overlay.className = 'popup-overlay';
    overlay.innerHTML = `
      <div class="popup-card submit-popup">
        <button class="popup-close-btn" onclick="dismissPopup()">×</button>
        <div class="popup-badge success">✅ 已建立計時器</div>
        <div class="submit-content-box">${esc(content)}</div>
        <button class="btn-copy-reply" onclick="copyText(_pendingCopy,this)">📋 複製內容</button>
      </div>`;
    document.body.appendChild(overlay);
  }

  // ── Tick timers ──
  function tickTimers() {
    sortedActive().forEach(r => {
      const ms = getRemaining(r);
      if (ms === null) return; // pending — no tick needed
      const timerEl = document.getElementById(`timer-${r.id}`);
      const cardEl  = document.getElementById(`card-${r.id}`);
      if (!timerEl) return;
      const tc = timerClass(ms);
      timerEl.className = `timer-box ${tc}`;
      timerEl.querySelector('.t-time').textContent = fmtTime(ms);
      if (cardEl) cardEl.className = `record-card ${cardClass(ms)}`;
    });
    updateHeaderBadge();
  }

  function updateHeaderBadge() {
    const active = sortedActive();
    const badge  = document.getElementById('header-badge');
    if (!badge) return;
    badge.textContent = active.length;
    badge.classList.toggle('show', active.length > 0);
    badge.style.background = active.some(r => { const ms = getRemaining(r); return ms !== null && ms <= 0; }) ? '#a05555' : 'var(--red)';
  }

  // ── Form submit ──
  function handleSubmit(e) {
    e.preventDefault();
    syncGroupValues();
    const req  = document.getElementById('f-req').value.trim();
    const grp  = document.getElementById('f-group').value.trim();
    const info = document.getElementById('f-info').value.trim();
    if (!req || !grp) return;

    // Flatten: each (group × eventName) → one record
    const recordsToAdd = [];
    formGroups.forEach(g => {
      const validNames = g.eventNames.map(e => e.trim()).filter(Boolean);
      if (validNames.length) recordsToAdd.push({ orderNos: g.orderNos, eventNames: validNames });
    });
    if (!recordsToAdd.length) { alert('請輸入至少一個賽事名稱'); return; }

    recordsToAdd.forEach(g => g.eventNames.forEach(name => addRecord(name, g.orderNos, req, grp, info)));

    showSubmitPopup(recordsToAdd, req, grp, info);

    formGroups = [{ id: `g${++groupCounter}`, orderNos: [''], eventNames: [''] }];
    renderFormGroups();
    document.getElementById('f-req').value   = '';
    document.getElementById('f-group').value = '';
    document.getElementById('f-info').value  = '';
  }

  // ── Toggle completed ──
  function toggleCompleted() {
    const list    = document.getElementById('completed-list');
    const chevron = document.getElementById('chevron');
    const isOpen  = list.style.display !== 'none';
    list.style.display = isOpen ? 'none' : 'block';
    chevron.classList.toggle('open', !isOpen);
  }

  // ── Init ──
  function init() {
    load(); scheduleAll(); fullRender(); updateNotifBtn();
    initFormGroups();
    setInterval(tickTimers, 1000);
  }
  document.addEventListener('DOMContentLoaded', init);

  // Back-to-top button
  window.addEventListener('scroll', () => {
    const btn = document.getElementById('back-to-top');
    if (btn) btn.classList.toggle('show', window.scrollY > window.innerHeight * 0.8);
  });
</script>
</body>
</html>
