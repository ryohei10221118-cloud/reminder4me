            const timeNote  = upcoming ? ' · 尚未開賽' : stale ? ' · 超過24小時' : '';
            const na = v => (v === null || v === undefined || v === '') ? 'n/a' : String(v);
            const defaultChecked = sorted.length === 1 ? true : s.status === 0;
            const betLinesHtml = (s.betLines || []).map(bl => {

              const scoreLine = hasScore && hasSettle ? `${na(bl.score1)}-${na(bl.score2)} / ${na(bl.settlementResult)}`
                              : hasScore ? `${na(bl.score1)}-${na(bl.score2)}` : null;
              return (blLine ? `<div class="json-bet-line">${esc(blLine)}</div>` : '')
                   + (scoreLine ? `<div class="json-score-line">${esc(scoreLine)}</div>` : '');
            }).join('');
            return `
            <label class="json-event-item${s.status === 0 ? ' is-opened' : ''}">
              <input type="checkbox" id="json-cb-${s.origIdx}" ${defaultChecked ? 'checked' : ''}>
              <div style="flex:1;min-width:0">
                <div style="display:flex;align-items:center;gap:8px">
                  <span class="json-event-name">${esc(s.eventName)}</span>
                  ${_jsonStatusBadge(s.status)}
                  <span class="json-event-time"${timeColor ? ` style="color:${timeColor}"` : ''}>${_jsonToUtc8(s.startDate)}${timeNote}</span>
                  <button onclick="event.preventDefault();_copyJsonEventName(${s.origIdx})" style="background:none;border:none;font-size:11px;color:var(--text-muted);cursor:pointer;padding:1px 4px;border-radius:3px;flex-shrink:0;line-height:1" title="複製賽事名稱" onmouseover="this.style.color='var(--text-pri)'" onmouseout="this.style.color='var(--text-muted)'">📋</button>
                </div>

          }).join('')}
        </div>
        <div style="display:flex;gap:8px;margin-top:8px">
          <button class="btn-copy-reply" style="flex:1;margin:0" onclick="_confirmJsonSelection()">✓ 匯入</button>
          <button class="btn-popup-sec" style="flex:1" onclick="_renderJsonPasteState(document.getElementById('popup-overlay'))">← 返回</button>
        </div>

      </div>`;
  }

  function _copyJsonEventName(idx) {
    const name = _jsonImportData?.selections[idx]?.eventName || '';
    navigator.clipboard.writeText(name).catch(() => {});

  function _confirmJsonSelection() {
    if (!_jsonImportData) return;
    const checked = _jsonImportData.selections
      .map((_, i) => i)
      .filter(i => { const cb = document.getElementById(`json-cb-${i}`); return cb && cb.checked; });

  function _doJsonImport(overlay, indices) {
    if (!_jsonImportData) return;
    const { ticketId, selections } = _jsonImportData;
    const eventNames    = indices.map(i => selections[i].eventName);
    const eventStatuses = indices.map(i => selections[i].status);
    const betInfos      = indices.map(i => ({
      eventId:          selections[i].eventId,
      leagueName:       selections[i].leagueName,
      status:           selections[i].status,
      startDate:        selections[i].startDate,
      betLines:         selections[i].betLines || [],
      // keep flat fields for backward compat
      lineType:         selections[i].lineType,
      selectionName:    selections[i].selectionName,
      score1:           selections[i].score1,
      score2:           selections[i].score2,
      settlementResult: selections[i].settlementResult,
    }));

    syncGroupValues();

    const matched = formGroups.filter(g =>
      g.eventNames.some(en => en.trim() && eventNames.includes(en.trim()))
    );

    if (matched.length) {
      _showMergeDialog(overlay, matched, ticketId, eventNames, eventStatuses);
      return;
    }

    _applyJsonNewGroup(overlay, ticketId, eventNames, eventStatuses, betInfos);
  }

  function _applyJsonNewGroup(overlay, ticketId, eventNames, eventStatuses, betInfos) {
    const hasData = formGroups.length > 1 ||
      formGroups[0].orderNos.some(o => o.trim()) ||
      formGroups[0].eventNames.some(e => e.trim());
    if (hasData) {
      formGroups.push({ id: `g${++groupCounter}`, orderNos: [ticketId], eventNames, eventStatuses, betInfos });
    } else {
      formGroups[0] = { id: formGroups[0].id, orderNos: [ticketId], eventNames, eventStatuses, betInfos };
    }
    _jsonImportData = null;
    renderFormGroups();
    _renderNoteHints(eventNames);
    _renderJsonPasteState(overlay, `已新增注單 ${ticketId}`);
  }

  function _showMergeDialog(overlay, matched, ticketId, eventNames, eventStatuses) {
    const mergeRows = matched.map((g, mi) => {
      const label = g.eventNames.filter(Boolean).join(' / ');
      const tickets = g.orderNos.filter(Boolean).join(', ');
      return `<button class="btn-popup-sec" style="width:100%;text-align:left;padding:10px 12px;margin-bottom:6px"
        onclick="_doMerge(${mi})">
        <div style="font-size:12px;font-weight:700;color:var(--text-pri);margin-bottom:2px">${esc(label)}</div>
        <div style="font-size:11px;color:var(--text-muted)">${esc(tickets)}</div>
      </button>`;
    }).join('');

    _pendingMergeData = { overlay, matched, ticketId, eventNames, eventStatuses };

    overlay.innerHTML = `
      <div class="popup-card msg-popup" style="border-color:var(--border);max-width:480px;width:92%">
        <button class="popup-close-btn" onclick="closeMsgPopup()">×</button>
        <div class="popup-badge info">📥 匯入 JSON</div>
        <div class="popup-title" style="margin-bottom:4px">發現相同賽事</div>
        <div style="font-size:12px;color:var(--text-muted);margin-bottom:12px">注單 <b>${esc(ticketId)}</b> 含有已存在的賽事，要合併還是獨立新增？</div>
        <div style="font-size:12px;font-weight:700;color:var(--text-sec);margin-bottom:6px">合併到：</div>
        <div style="max-height:200px;overflow-y:auto">${mergeRows}</div>
        <div style="display:flex;gap:8px;margin-top:10px">
          <button class="btn-copy-reply" style="flex:1;margin:0" onclick="_doSeparate()">＋ 獨立新增</button>
          <button class="btn-popup-sec" style="flex:1" onclick="_renderJsonPasteState(document.getElementById('popup-overlay'))">← 返回</button>
        </div>
        <button class="btn-popup-sec" style="margin-top:6px;width:100%" onclick="closeMsgPopup()">完成</button>
      </div>`;
  }

  let _pendingMergeData = null;
  function _doMerge(matchedIdx) {
    if (!_pendingMergeData) return;
    const { overlay, matched, ticketId } = _pendingMergeData;
    const g = matched[matchedIdx];
    if (g && !g.orderNos.includes(ticketId)) g.orderNos.push(ticketId);
    _jsonImportData = null;
    _pendingMergeData = null;
    renderFormGroups();
    _renderJsonPasteState(overlay, `已合併注單 ${ticketId}`);
  }
  function _doSeparate() {
    if (!_pendingMergeData) return;
    const { overlay, ticketId, eventNames, eventStatuses } = _pendingMergeData;
    _pendingMergeData = null;
    _applyJsonNewGroup(overlay, ticketId, eventNames, eventStatuses);
  }

  // ── Record CRUD ──
  // backward-compat helper
  function getEventNames(r) {
    return r.eventNames || (r.eventName ? [r.eventName] : ['']);
  }

  function addRecord(eventNames, orderNos, requirement, group, additionalInfo, lang = null, batchId = null, betInfos = null) {
    const names = (Array.isArray(eventNames) ? eventNames : [eventNames]).map(e => e.trim()).filter(Boolean);
    const r = {
      id:             `r${Date.now()}${Math.random().toString(36).slice(2,5)}`,
      batchId:        batchId,
      eventNames:     names,
      orderNos:       orderNos.map(o => o.trim()).filter(Boolean),
      requirement:    requirement.trim(),
      group:          group.trim(),
      additionalInfo: additionalInfo.trim(),
      lang:           lang,
      betInfos:       betInfos || null,
      createdAt:      Date.now(),
      stage:          1,
      stage2StartAt:  null,
      completedAt:    null,
      eventNotes:     {},
      eventNoteTimes: {},
    };
    records.push(r);
    save();
    schedule(r);
    fullRender();
    return r;
  }

  function markEventSettled(id, ei) {
    const r = records.find(x => x.id === id);
    if (!r || r.completedAt) return;
    if (!r.settledEventIndices) r.settledEventIndices = [];
    const pos = r.settledEventIndices.indexOf(ei);
    if (pos >= 0) {
      r.settledEventIndices.splice(pos, 1); // toggle off
    } else {
      r.settledEventIndices.push(ei);
    }
    const totalEvents = getEventNames(r).length;
    if (r.settledEventIndices.length >= totalEvents) {
      markDone(id);
      return;
    }
    save();
    renderActive();
  }

  function markDone(id) {
    const r = records.find(x => x.id === id);
    if (!r || r.completedAt) return;
    r.completedAt = Date.now();
    clearTimeout(timerHandles[id]);
    delete timerHandles[id];
    popupQueue = popupQueue.filter(x => x !== id);
    if (activePopupId === id) dismissPopup();
    selectedIds.delete(id);
    save(); fullRender();
  }

  function markAllDone() {
    const active = records.filter(r => !r.completedAt);
    if (!active.length) return;
    const now = Date.now();
    active.forEach(r => {
      r.completedAt = now;
      clearTimeout(timerHandles[r.id]);
      delete timerHandles[r.id];
      popupQueue = popupQueue.filter(x => x !== r.id);
      if (activePopupId === r.id) dismissPopup();
      selectedIds.delete(r.id);
    });
    save(); fullRender();
  }

  // ── Batch selection ──
  function toggleSelectAll(batchId, checked) {
    const group = records.filter(r => r.batchId === batchId && !r.completedAt);
    group.forEach(r => {
      if (checked) selectedIds.add(r.id);
      else selectedIds.delete(r.id);
      const cb = document.getElementById(`cb-${r.id}`);
      const card = document.getElementById(`card-${r.id}`);
      if (cb) cb.checked = checked;
      if (card) card.classList.toggle('card-selected', checked);
    });
    updateBatchBar(batchId);
  }

  function toggleSelect(id) {
    if (selectedIds.has(id)) selectedIds.delete(id);
    else selectedIds.add(id);
    const cb = document.getElementById(`cb-${id}`);
    const card = document.getElementById(`card-${id}`);
    if (cb) cb.checked = selectedIds.has(id);
    if (card) card.classList.toggle('card-selected', selectedIds.has(id));
    const batchId = getBatchIdFor(id);
    updateBatchBar(batchId);
    // sync select-all checkbox
    if (batchId) {
      const group = records.filter(r => r.batchId === batchId && !r.completedAt);
      const allCb = document.getElementById(`cb-all-${batchId}`);
      if (allCb) allCb.checked = group.length > 0 && group.every(r => selectedIds.has(r.id));
    }
  }

  function getBatchIdFor(id) {
    const r = records.find(x => x.id === id);
    return r ? r.batchId : null;
  }

  function updateBatchBar(batchId) {
    if (!batchId) return;
    const bar = document.getElementById(`batch-bar-${batchId}`);
    if (!bar) return;
    const selected = [...selectedIds].filter(id => {
      const r = records.find(x => x.id === id);
      return r && r.batchId === batchId && !r.completedAt;
    });
    const countEl = bar.querySelector('.batch-bar-count');
    if (countEl) countEl.textContent = selected.length > 0 ? `已選 ${selected.length}` : '';
    bar.querySelectorAll('.batch-bar-btn').forEach(b => b.disabled = selected.length === 0);
  }

  function batchRestartTimer(batchId) {
    const toRestart = [...selectedIds].filter(id => {
      const r = records.find(x => x.id === id);
      return r && r.batchId === batchId && !r.completedAt;
    });
    if (!toRestart.length) return;

    let isFinal = false;
    const allEventNames = [];
    let lang = null, group = '';

    toRestart.forEach(id => {
      const r = records.find(x => x.id === id);
      if (!r) return;
      clearTimeout(timerHandles[id]); delete timerHandles[id];
      if (r.stage === 2) isFinal = true;
      if (r.stage >= 3) { r.stage = 1; r.createdAt = Date.now(); r.stage2StartAt = null; }
      else if (r.stage === 2) { r.stage2StartAt = Date.now(); }
      else { r.createdAt = Date.now(); }
      popupQueue = popupQueue.filter(x => x !== id);
      if (activePopupId === id) { const el = document.getElementById('popup-overlay'); if (el) el.remove(); activePopupId = null; }
      getEventNames(r).forEach(n => { if (n && !allEventNames.includes(n)) allEventNames.push(n); });
      if (!lang && r.lang) lang = r.lang;
      if (!group && r.group) group = r.group;
    });

    save(); fullRender();
    _showBatchRestartReply(toRestart, allEventNames, lang, isFinal);
  }

      kr: `${name}\n해당 팀에 조사를 요청했으며, 진행 상황을 계속 알려드리겠습니다. 기다려 주셔서 감사합니다.${agentSuffix}`,
    } : {

            <button class="btn-copy-inline" onclick="copyReply('en',this)" title="Copy">📋</button>

            <button class="btn-copy-inline" onclick="copyReply('zh',this)" title="複製">📋</button>
          </div>
          <div class="reply-row${lang === 'kr' ? ' lang-highlight' : (lang ? ' lang-dim' : '')}">
            <span class="reply-row-text">${esc(_replyTexts.kr)}</span>
            <button class="btn-copy-inline" onclick="copyReply('kr',this)" title="복사">📋</button>
          </div>
        </div>
        <div class="popup-btns">
          <button class="btn-popup-done" onclick="_batchMarkDoneFromPopup()">✓ 已回覆</button>
          <button class="btn-popup-sec" onclick="${isFinal ? '_batchDismissAndPend()' : '_batchAckStage1()'}">${isFinal ? '關閉' : '繼續計時'}</button>
        </div>
      </div>`;
    document.body.appendChild(overlay);

  function _batchMarkDoneFromPopup() {
    const now = Date.now();
    _batchRestartIds.forEach(id => {
      const r = records.find(x => x.id === id);
      if (!r || r.completedAt) return;
      r.completedAt = now;
      clearTimeout(timerHandles[id]); delete timerHandles[id];
      popupQueue = popupQueue.filter(x => x !== id);
      selectedIds.delete(id);
    });
    _batchRestartIds = [];
    save(); dismissPopup(); fullRender();
  }

  function _batchAckStage1() {
    _batchRestartIds.forEach(id => {
      const r = records.find(x => x.id === id);
      if (!r || r.stage !== 1) return;
      r.stage = 2; r.stage2StartAt = Date.now();
      schedule(r);
    });
    _batchRestartIds = [];
    save(); dismissPopup(); fullRender();
  }

  function _batchDismissAndPend() {
    _batchRestartIds.forEach(id => {
      const r = records.find(x => x.id === id);
      if (!r || r.stage !== 2) return;
      r.stage = 3;
      clearTimeout(timerHandles[id]); delete timerHandles[id];
    });
    _batchRestartIds = [];
    save(); fullRender(); dismissPopup();
  }

  function batchMarkDone(batchId) {
    const toMark = [...selectedIds].filter(id => {
      const r = records.find(x => x.id === id);
      return r && r.batchId === batchId && !r.completedAt;
    });
    toMark.forEach(id => {
      const r = records.find(x => x.id === id);
      if (!r) return;
      r.completedAt = Date.now();
      clearTimeout(timerHandles[id]); delete timerHandles[id];
      popupQueue = popupQueue.filter(x => x !== id);
      if (activePopupId === id) dismissPopup();
      selectedIds.delete(id);

  }

          <button class="btn-copy-reply" style="flex:1;margin-bottom:0;background:var(--green-bg);border-color:var(--green-border);color:var(--green)" onclick="saveCopyBatchMsg('${batchId}',this,true)">✓ 複製並完成</button>

  function saveCopyBatchMsg(batchId, btn, markAllDone = false) {
    const toProcess = [...selectedIds].filter(id => {
      const r = records.find(x => x.id === id);
      return r && r.batchId === batchId && !r.completedAt;
    }).map(id => records.find(x => x.id === id));

    const lines = [];
    toProcess.forEach(r => {
      const names = getEventNames(r);
      const ta = document.getElementById(`batch-ta-${r.id}`);
      const msg = ta ? ta.value.trim() : '';
      if (!r.eventNotes) r.eventNotes = {};
      if (!r.eventNoteTimes) r.eventNoteTimes = {};
      const now = Date.now();
      names.forEach(n => { r.eventNotes[n] = msg; if (msg) r.eventNoteTimes[n] = now; });
      lines.push(`${names.join('\n')}${msg ? '\n' + msg : ''}`);
    });
    save();
    _refreshNoteHints();
    copyText(lines.join('\n\n'), btn);
    if (markAllDone) {
      setTimeout(() => {
        toProcess.forEach(r => {
          r.completedAt = Date.now();
          clearTimeout(timerHandles[r.id]); delete timerHandles[r.id];
          popupQueue = popupQueue.filter(x => x !== r.id);
          if (activePopupId === r.id) dismissPopup();
          selectedIds.delete(r.id);
        });
        save(); fullRender();
        closeMsgPopup();
      }, 500);
    }
  }

  function deleteRecord(id) {
    records = records.filter(x => x.id !== id);
    clearTimeout(timerHandles[id]);
    delete timerHandles[id];
    popupQueue = popupQueue.filter(x => x !== id);
    if (activePopupId === id) dismissPopup();
    save(); fullRender();
  }

  function ackStage1(id) {
    const r = records.find(x => x.id === id);
    if (!r || r.stage !== 1) return;
    r.stage = 2; r.stage2StartAt = Date.now();
    save(); dismissPopup(); schedule(r); fullRender();
  }

  function dismissAndPend(id) {
    const r = records.find(x => x.id === id);
    if (r && r.stage === 2) {
      r.stage = 3;
      clearTimeout(timerHandles[id]);
      delete timerHandles[id];
      save(); fullRender();
    }
    dismissPopup();
  }

  function restartTimer(id) {
    const r = records.find(x => x.id === id);
    if (!r) return;
    clearTimeout(timerHandles[id]);
    delete timerHandles[id];
    // If pending (stage 3), reset to stage 1 first
    if (r.stage >= 3) {
      r.stage = 1; r.createdAt = Date.now(); r.stage2StartAt = null;
      save();
    }
    // Clear from queue and immediately show current stage popup
    popupQueue = popupQueue.filter(x => x !== id);
    if (activePopupId === id) { const el = document.getElementById('popup-overlay'); if (el) el.remove(); activePopupId = null; }
    fullRender();
    activePopupId = id;
    renderPopup(r);
    playSound();
    sendBrowserNotif(r);
  }

  // ── Timer scheduling ──
  function schedule(r) {
    if (r.completedAt || r.stage >= 3) return;
    clearTimeout(timerHandles[r.id]);
    const remaining = getRemaining(r);
    if (remaining <= 0) enqueue(r.id);
    else timerHandles[r.id] = setTimeout(() => enqueue(r.id), remaining);
  }
  function scheduleAll() { records.filter(r => !r.completedAt).forEach(schedule); }

  // ── Popup queue ──
  function enqueue(id) {
    if (popupQueue.includes(id) || activePopupId === id) return;
    const r = records.find(x => x.id === id);
    if (!r || r.completedAt) return;
    popupQueue.push(id);
    processQueue();
  }
  function processQueue() {
    if (activePopupId || popupQueue.length === 0) return;
    const id = popupQueue.shift();
    const r  = records.find(x => x.id === id);
    if (!r || r.completedAt) { processQueue(); return; }
    activePopupId = id;
    renderPopup(r);
    playSound();
    sendBrowserNotif(r);
  }
  function dismissPopup() {
    activePopupId = null;
    const el = document.getElementById('popup-overlay');
    if (el) el.remove();
    setTimeout(processQueue, 200);
  }

  // ── Sound ──
  function playSound() {
    try {
      const ctx = new (window.AudioContext || window.webkitAudioContext)();
      const beep = (freq, start, dur, vol=0.28) => {
        const osc = ctx.createOscillator(), gain = ctx.createGain();
        osc.connect(gain); gain.connect(ctx.destination);
        osc.type = 'sine'; osc.frequency.value = freq;
        gain.gain.setValueAtTime(vol, ctx.currentTime + start);
        gain.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + start + dur);
        osc.start(ctx.currentTime + start);
        osc.stop(ctx.currentTime + start + dur + 0.01);
      };
      beep(880,0.00,0.12); beep(1100,0.18,0.12); beep(880,0.36,0.22);
    } catch(e) {}
  }

      parts.push(`需求：${r.requirement}  ·  群組：${r.group}`);
      return parts.join('\n');

    const text = lines.join('\n\n');

  // ── Daily Settlement ──

  // ── Notifications ──
  async function requestNotifPermission() {
    if (!('Notification' in window)) { alert('此瀏覽器不支援桌面通知'); return; }
    const result = await Notification.requestPermission();
    updateNotifBtn();
    if (result === 'granted') new Notification('✅ 通知已開啟', { body: '提醒出現時會同步通知您' });
  }
  function updateNotifBtn() {
    const btn = document.getElementById('notif-btn');
    if (!btn) return;
    if (!('Notification' in window)) { btn.style.display='none'; return; }
    if (Notification.permission === 'granted') {
      btn.textContent = '🔔 通知已開啟'; btn.classList.add('granted'); btn.disabled = true;
    } else {
      btn.textContent = '🔔 開啟通知'; btn.classList.remove('granted'); btn.disabled = false;
    }
  }
  function sendBrowserNotif(r) {
    if (!('Notification' in window) || Notification.permission !== 'granted') return;
    const stage = r.stage === 1 ? '第一次提醒' : '最終提醒！';
    const n = new Notification(`${stage} ─ ${getEventNames(r)[0]}`, {
      body: `需求：${r.requirement}\n群組：${r.group}`,

  function renderCardHtml(r, inBatch = false, dupSet = null) {
    const ms = getRemaining(r), tc = timerClass(ms), cc = cardClass(ms), t = fmtTime(ms);
    const stageLabel = r.stage === 1 ? '第1次' : r.stage === 2 ? '第2次' : '待定';
    const orderTagsHtml = r.orderNos.length
      ? r.orderNos.map(o => `<span class="order-tag" title="點擊複製" onclick="copyText('${o.replace(/'/g,"\\'")}',this)">${esc(o)}</span>`).join('')
      : '';
    const eventNames = getEventNames(r);
    const settledSet = new Set(r.settledEventIndices || []);
    const isMulti = eventNames.length > 1;
    const eventRowsHtml = eventNames.map((name, ei) => {
      const isDup = dupSet && dupSet.has(name);
      const isSettled = settledSet.has(ei);
      const nameClass = ['card-event-name', isDup ? 'dup' : '', isSettled ? 'settled' : ''].filter(Boolean).join(' ');
      const titleTxt = isDup ? '此賽事出現在其他待處理卡片，點擊複製' : '點擊複製';
      const settleBtn = isMulti
        ? `<button class="btn-event-settle${isSettled ? ' settled' : ''}" onclick="markEventSettled('${r.id}',${ei})" title="${isSettled ? '取消標記' : '標記此賽事已完成'}">✓</button>`

      ? `<input type="checkbox" class="batch-cb" id="cb-${r.id}" ${selectedIds.has(r.id) ? 'checked' : ''} onchange="toggleSelect('${r.id}')">`
      : '';

            ${_buildBetInfoHtml(r)}

  function renderActive() {
    const active = sortedActive();
    const el = document.getElementById('active-records');
    const badge = document.getElementById('active-count');
    badge.textContent = active.length;
    badge.style.display = active.length ? 'inline-flex' : 'none';
    if (active.length === 0) { el.innerHTML = '<div class="empty-state">目前沒有待處理的記錄</div>'; return; }

    // build duplicate event name set across all active records
    const _nameCount = {};
    active.forEach(r => getEventNames(r).forEach(n => { if (n) _nameCount[n] = (_nameCount[n] || 0) + 1; }));
    const dupSet = new Set(Object.keys(_nameCount).filter(n => _nameCount[n] > 1));

    // separate batch vs solo records
    const batches = {};
    const solos = [];
    active.forEach(r => {
      if (r.batchId) {
        if (!batches[r.batchId]) batches[r.batchId] = [];
        batches[r.batchId].push(r);
      } else {
        solos.push(r);
      }
    });

    // sort key: min remaining time in batch / solo remaining (null=pending → Infinity)
    const sortKey = ms => ms === null ? Infinity : ms;
    const batchMinMs = bid => Math.min(...batches[bid].map(r => sortKey(getRemaining(r))));

    // interleave batches and solos sorted by urgency
    const items = [
      ...Object.keys(batches).map(bid => ({ type: 'batch', bid, ms: batchMinMs(bid) })),
      ...solos.map(r => ({ type: 'solo', r, ms: sortKey(getRemaining(r)) })),
    ].sort((a, b) => a.ms - b.ms);

    const parts = [];
    items.forEach(item => {
      if (item.type === 'solo') { parts.push(renderCardHtml(item.r, false, dupSet)); return; }
      const bid = item.bid;
      const group = batches[bid];
      const selCount = group.filter(r => selectedIds.has(r.id)).length;
      const grpName = group[0].group;
      const allChecked = group.length > 0 && group.every(r => selectedIds.has(r.id));
      parts.push(`
        <div class="batch-group" id="batch-${bid}">
          <div class="batch-group-header">
            <input type="checkbox" class="batch-cb" id="cb-all-${bid}" ${allChecked ? 'checked' : ''} onchange="toggleSelectAll('${bid}',this.checked)" title="全選">
            <span class="batch-group-label">${esc(grpName)}</span>
            <span class="batch-group-count">${group.length} 張</span>
            <div class="batch-group-actions" id="batch-bar-${bid}">
              <span class="batch-bar-count">${selCount > 0 ? `已選 ${selCount}` : ''}</span>
              <button class="batch-bar-btn batch-bar-done"    ${selCount === 0 ? 'disabled' : ''} onclick="batchMarkDone('${bid}')">✓ 完成</button>
              <button class="batch-bar-btn batch-bar-restart" ${selCount === 0 ? 'disabled' : ''} onclick="batchRestartTimer('${bid}')">↺ 重新計時</button>
              <button class="batch-bar-btn batch-bar-msg"     ${selCount === 0 ? 'disabled' : ''} onclick="showBatchMsgPopup('${bid}')">📝 批量訊息</button>
            </div>
          </div>
          ${group.map(r => renderCardHtml(r, true, dupSet)).join('')}
        </div>`);
    });

    el.innerHTML = parts.join('');
  }

  function buildSummaryText(groups, requirement, group, additionalInfo) {
    const groupLines = groups.map(g => {
      const lines = [];
      g.orderNos.filter(Boolean).forEach(o => lines.push(o));
      (g.eventNames || []).filter(Boolean).forEach((e, ei) => {
        lines.push(e);
        const bi = (g.betInfos || [])[ei];
        if (bi) {
          const bls = bi.betLines && bi.betLines.length ? bi.betLines
                    : (bi.lineType || bi.selectionName) ? [{ lineType: bi.lineType, selectionName: bi.selectionName }] : [];
          bls.forEach(bl => {
            const p = [bl.lineType, bl.selectionName].filter(Boolean).join(' / ');
            if (p) lines.push(p);
          });
        }
      });
      return lines.join('\n');
    }).filter(Boolean);
    const tail = [requirement, group, additionalInfo].filter(Boolean).join('\n');
    if (groupLines.length === 0) return tail;
    const last = groupLines[groupLines.length - 1] + (tail ? '\n' + tail : '');
    return [...groupLines.slice(0, -1), last].join('\n\n');
  }

  function getRecordSummary(id) {
    const r = records.find(x => x.id === id);
    if (!r) return '';
    const parts = [...r.orderNos.filter(Boolean)];
    getEventNames(r).forEach((name, ei) => {
      if (!name) return;
      parts.push(name);
      const bi = (r.betInfos || [])[ei];
      if (bi) {
        const bls = bi.betLines && bi.betLines.length ? bi.betLines
                  : (bi.lineType || bi.selectionName) ? [{ lineType: bi.lineType, selectionName: bi.selectionName }] : [];
        bls.forEach(bl => {
          const p = [bl.lineType, bl.selectionName].filter(Boolean).join(' / ');
          if (p) parts.push(p);
        });
      }
    });
    parts.push(r.requirement, r.group);
    if (r.additionalInfo) parts.push(r.additionalInfo);
    return parts.filter(Boolean).join('\n');
  }

  // ── Tick timers ──
  function tickTimers() {
    sortedActive().forEach(r => {
      const ms = getRemaining(r);
      if (ms === null) return; // pending — no tick needed
      const timerEl = document.getElementById(`timer-${r.id}`);
      const cardEl  = document.getElementById(`card-${r.id}`);
      if (!timerEl) return;
      const tc = timerClass(ms);
      timerEl.className = `timer-box ${tc}`;
      timerEl.querySelector('.t-time').textContent = fmtTime(ms);
      if (cardEl) cardEl.className = `record-card ${cardClass(ms)}`;
    });
    updateHeaderBadge();
  }

  function updateHeaderBadge() {
    const active = sortedActive();
    const badge  = document.getElementById('header-badge');
    if (!badge) return;
    badge.textContent = active.length;
    badge.classList.toggle('show', active.length > 0);
    badge.style.background = active.some(r => { const ms = getRemaining(r); return ms !== null && ms <= 0; }) ? '#a05555' : 'var(--red)';
  }

  // ── Form submit ──
  function setFormLang(lang) {
    formLang = formLang === lang ? null : lang;
    document.querySelectorAll('.lang-sel-btn').forEach(b => b.classList.toggle('active', b.dataset.lang === formLang));
  }

  function handleSubmit(e) {
    e.preventDefault();
    syncGroupValues();
    const req  = document.getElementById('f-req').value.trim();
    const grp  = document.getElementById('f-group').value.trim();
    const info = document.getElementById('f-info').value.trim();
    if (!req || !grp) return;

    // Flatten: each (group × eventName) → one record
    const recordsToAdd = [];
    formGroups.forEach(g => {
      const validNames = g.eventNames.map(e => e.trim()).filter(Boolean);
      if (validNames.length) recordsToAdd.push({ orderNos: g.orderNos, eventNames: validNames, betInfos: g.betInfos || null });
    });
    if (!recordsToAdd.length) { alert('請輸入至少一個賽事名稱'); return; }

    const batchId = recordsToAdd.length > 1 ? `b${Date.now()}` : null;
    recordsToAdd.forEach(g => addRecord(g.eventNames, g.orderNos, req, grp, info, formLang, batchId, g.betInfos));
    _grpHistSave(grp);

    showSubmitPopup(recordsToAdd, req, grp, info);

    formGroups = [{ id: `g${++groupCounter}`, orderNos: [''], eventNames: [''] }];
    _noteHintsMap = {};
    renderFormGroups();
    document.getElementById('f-req').value   = '';
    document.getElementById('f-group').value = '';
    document.getElementById('f-info').value  = '';
  }

  // ── Init ──
  // ── Group name autocomplete ──
  const GRP_HIST_KEY = 'reminder4me_grp_hist';
  const GRP_MAX      = 200;
  let _grpHiIdx      = -1;

  function _grpHistLoad() {
    try { return JSON.parse(localStorage.getItem(GRP_HIST_KEY) || '[]'); } catch(e) { return []; }
  }
  function _grpHistSave(name) {
    if (!name) return;
    let list = _grpHistLoad().filter(x => x !== name);
    list.unshift(name);
    if (list.length > GRP_MAX) list = list.slice(0, GRP_MAX);
    localStorage.setItem(GRP_HIST_KEY, JSON.stringify(list));
  }
  function _grpOnInput(inp) {
    const q = inp.value.trim().toLowerCase();
    const list = _grpHistLoad();
    const matches = q
      ? list.filter(x => x.toLowerCase().includes(q)).slice(0, 8)
      : list.slice(0, 8);
    _grpHiIdx = -1;
    _grpShowDrop(matches, inp);
  }
  function _grpShowDrop(matches, inp) {
    const drop = document.getElementById('grp-dropdown');
    if (!drop) return;
    if (!matches.length) { drop.style.display = 'none'; return; }
    drop.innerHTML = matches.map((m, i) => {
      const safe = m.replace(/'/g, "\\'");
      return `<div class="req-option" data-i="${i}" onmousedown="_grpPick('${safe}')">
        <span class="grp-drop-label">${esc(m)}</span>
        <button class="grp-drop-del" onmousedown="event.stopPropagation();_grpHistDelete('${safe}',event)" title="删除">×</button>
      </div>`;
    }).join('');
    drop.style.display = 'block';
  }
  function _grpHistDelete(name, ev) {
    if (ev) ev.stopPropagation();
    const list = _grpHistLoad().filter(x => x !== name);
    localStorage.setItem(GRP_HIST_KEY, JSON.stringify(list));
    const inp = document.getElementById('f-group');
    if (inp) _grpOnInput(inp);
  }
  function _grpPick(name) {
    const inp = document.getElementById('f-group');
    if (inp) inp.value = name;
    const drop = document.getElementById('grp-dropdown');
    if (drop) drop.style.display = 'none';
    _grpHiIdx = -1;
  }
  function _grpOnKey(e) {
    const drop = document.getElementById('grp-dropdown');
    if (!drop || drop.style.display === 'none') return;
    const items = drop.querySelectorAll('.req-option');
    if (e.key === 'ArrowDown') {
      e.preventDefault();
      _grpHiIdx = Math.min(_grpHiIdx + 1, items.length - 1);
      items.forEach((el, i) => el.classList.toggle('highlighted', i === _grpHiIdx));
    } else if (e.key === 'ArrowUp') {
      e.preventDefault();
      _grpHiIdx = Math.max(_grpHiIdx - 1, -1);
      items.forEach((el, i) => el.classList.toggle('highlighted', i === _grpHiIdx));
    } else if (e.key === 'Enter' && _grpHiIdx >= 0) {
      e.preventDefault();
      items[_grpHiIdx]?.dispatchEvent(new MouseEvent('mousedown'));
    } else if (e.key === 'Escape') {
      drop.style.display = 'none'; _grpHiIdx = -1;
    }
  }
  function _grpOnBlur() {
    setTimeout(() => {
      const drop = document.getElementById('grp-dropdown');
      if (drop) drop.style.display = 'none';
      _grpHiIdx = -1;
    }, 150);
  }

  const PRUNE_CHECK_KEY = 'reminder4me_last_prune';
  const PRUNE_INTERVAL  = 60 * 60 * 1000; // 1 hour

  function pruneOldCompleted() {
    const now = Date.now();
    const last = Number(localStorage.getItem(PRUNE_CHECK_KEY) || 0);
    if (now - last < PRUNE_INTERVAL) return;
    localStorage.setItem(PRUNE_CHECK_KEY, String(now));
    const cutoff = now - 7 * 24 * 60 * 60 * 1000;
    const before = records.length;
    records = records.filter(r => !r.completedAt || r.completedAt >= cutoff);
    if (records.length !== before) { save(); fullRender(); }
  }

  function _grpMigrateFromRecords() {
    if (localStorage.getItem(GRP_HIST_KEY)) return; // already exists, skip
    const freq = {};
    records.forEach(r => { if (r.group) freq[r.group] = (freq[r.group] || 0) + 1; });
    const sorted = Object.keys(freq).sort((a, b) => freq[b] - freq[a]);
    if (sorted.length) localStorage.setItem(GRP_HIST_KEY, JSON.stringify(sorted));
  }

  function _grpDedupCase() {
    const DEDUP_KEY = 'reminder4me_grp_dedup_v1';
    if (localStorage.getItem(DEDUP_KEY)) return;
    const list = _grpHistLoad();
    const seen = new Set();
    const deduped = list.filter(x => {
      const lc = x.toLowerCase();
      if (seen.has(lc)) return false;
      seen.add(lc);
      return true;
    });
    localStorage.setItem(GRP_HIST_KEY, JSON.stringify(deduped));
    localStorage.setItem(DEDUP_KEY, '1');
  }

  function init() {
    load(); loadAgentName(); loadQuickReplies(); _ensLoad(); pruneOldCompleted(); scheduleAll(); fullRender(); updateNotifBtn();
    _grpMigrateFromRecords();
    _grpDedupCase();
    initFormGroups();
    setInterval(tickTimers, 1000);
    document.addEventListener('visibilitychange', () => {
      if (document.visibilityState === 'visible') pruneOldCompleted();
    });
  }
  document.addEventListener('DOMContentLoaded', init);

  document.addEventListener('click', e => {
    if (!e.target.closest('#req-combobox')) {
      const drop = document.getElementById('req-dropdown');
      if (drop) drop.style.display = 'none';
    }
  });

  // Back-to-top button
  window.addEventListener('scroll', () => {
    const btn = document.getElementById('back-to-top');
    if (btn) btn.classList.toggle('show', window.scrollY > window.innerHeight * 0.8);
  });

  // ── Event Message Compose ──
  let _msgEvents = [];

  function showMsgComposePopup() {
    _msgEvents = [];
    const existing = document.getElementById('msg-compose-overlay');
    if (existing) existing.remove();
    const overlay = document.createElement('div');
    overlay.className = 'popup-overlay';
    overlay.id = 'msg-compose-overlay';
    document.body.appendChild(overlay);
    overlay.addEventListener('mousedown', e => { if (e.target === overlay) _closeMsgCompose(); });
    _renderMsgCompose(overlay);
  }

  function _closeMsgCompose() {
    const el = document.getElementById('msg-compose-overlay');
    if (el) el.remove();
  }

  function _renderMsgCompose(overlay) {
    const sorted = _msgEvents
      .map((ev, origIdx) => ({ ...ev, origIdx }))
      .sort((a, b) => {
        const aWon = a.status === 2;
        const bWon = b.status === 2;
        if (aWon !== bWon) return aWon ? 1 : -1;
        return a.origIdx - b.origIdx;
      });
    const eventRows = sorted.map((ev) => {
      const i = ev.origIdx;
      const isWon = ev.status === 2;
      const st = _jsonStatusMap[ev.status];
      const borderStyle = !isWon && st ? `border-left:3px solid ${st.color};` : '';
      const statusBadge = st ? `<span style="font-size:11px;font-weight:600;color:${st.color};white-space:nowrap">${st.label}</span>` : '';
      const hintKey = ev.eventName.trim();
      const hasHint = hintKey && !!_getHint(hintKey);
      const hintIcon = hasHint ? `<button type="button" class="note-hint-icon-btn" data-event="${esc(hintKey)}" onclick="showNoteHintPopup(this.dataset.event)" title="有歷史記錄">📌</button>` : '';
      const upcoming = ev.startDate && _jsonIsUpcoming(ev.startDate);
      const stale    = ev.startDate && ev.status === 0 && _jsonIsStale(ev.startDate);
      const timeColor = upcoming ? 'var(--red)' : stale ? 'var(--orange)' : 'var(--text-muted)';
      const timeNote  = upcoming ? ' · 尚未開賽' : stale ? ' · 超過24小時' : '';
      const timeHtml  = ev.startDate ? `<span style="font-size:11px;color:${timeColor};white-space:nowrap">${_jsonToUtc8(ev.startDate)}${timeNote}</span>` : '';
      return `
      <div class="msg-event-row" id="msg-ev-${i}" style="${borderStyle}">
        <div class="msg-event-header">
          <div class="msg-event-name-row">
            <span class="msg-event-name">${esc(ev.eventName)}</span>
            <button class="msg-event-remove" onclick="_removeMsgEvent(${i})" title="移除">×</button>
          </div>
          <div class="msg-event-meta-row">
            ${statusBadge}${hintIcon}${timeHtml}
            <span class="msg-event-id">EventId: ${esc(String(ev.eventId))}</span>
          </div>
        </div>
        <textarea class="msg-event-notes" id="msg-notes-${i}" placeholder="備註（留空則不複製此賽事）...">${esc(ev.notes || '')}</textarea>
      </div>`;
    }).join('');

    overlay.innerHTML = `
      <div class="popup-card msg-popup" style="border-color:var(--border);max-width:520px;width:92%;max-height:88vh;display:flex;flex-direction:column;padding:0;overflow:hidden">
        <div style="display:flex;align-items:center;justify-content:space-between;padding:16px 20px;border-bottom:1px solid var(--border-light);flex-shrink:0">
          <div style="font-size:15px;font-weight:700;color:var(--text-pri)">📨 賽事訊息產生器</div>
          <button onclick="_closeMsgCompose()" style="background:none;border:none;font-size:20px;color:var(--text-muted);cursor:pointer;line-height:1;padding:2px 4px;border-radius:5px" onmouseover="this.style.color='var(--text-pri)'" onmouseout="this.style.color='var(--text-muted)'">×</button>
        </div>
        <div style="padding:16px 20px 20px;display:flex;flex-direction:column;flex:1;overflow:hidden;min-height:0">
          <textarea class="msg-textarea" id="msg-compose-ta" placeholder="貼入注單 JSON（可連續貼多張）..." style="height:88px;flex-shrink:0;margin-bottom:6px"></textarea>
          <div id="msg-parse-err" style="display:none;font-size:12px;color:var(--red);margin-bottom:8px;padding:6px 10px;background:var(--red-bg);border-radius:6px;flex-shrink:0"></div>
          ${_msgEvents.length > 0 ? `
            <div style="font-size:11px;color:var(--text-muted);text-transform:uppercase;letter-spacing:.6px;margin-bottom:8px;flex-shrink:0">${_msgEvents.length} 場賽事</div>
            <div id="msg-events-list" style="display:flex;flex-direction:column;gap:10px;overflow-y:auto;margin-bottom:10px;flex:1">${eventRows}</div>
            <label style="display:flex;align-items:center;gap:6px;font-size:12px;color:var(--text-sec);margin-bottom:10px;flex-shrink:0;cursor:pointer">
              <input type="checkbox" id="msg-include-eventid" checked style="accent-color:var(--blue);width:14px;height:14px;cursor:pointer">
              附上 EventId
            </label>
            <button class="btn-copy-reply" style="width:100%;margin:0;flex-shrink:0" onclick="_copyMsgCompose()">📋 複製</button>
          ` : `
            <div style="text-align:center;padding:28px 0 8px;color:var(--text-muted);font-size:13px;flex:1">貼入 JSON 後賽事會自動出現在這裡</div>
          `}
        </div>
      </div>`;

    const ta = overlay.querySelector('#msg-compose-ta');
    ta.addEventListener('paste', () => setTimeout(() => _parseMsgJson(overlay), 80));
    setTimeout(() => ta.focus(), 50);
  }

  function _parseMsgJson(overlay) {
    const ta = document.getElementById('msg-compose-ta');
    if (!ta) return;
    const raw = ta.value.trim();
    if (!raw) return;
    _saveCurrentMsgNotes();
    const err = document.getElementById('msg-parse-err');
    let data;
    try { data = JSON.parse(raw); } catch(e) {
      if (err) { err.textContent = '⚠ JSON 格式錯誤，請確認後再試'; err.style.display = 'block'; }
      return;
    }
    const selections = (data.Selections || [])
      .map(s => ({ eventName: s.EventName || '', eventId: String(s.EventId || ''), status: s.SelectionStatus ?? null, startDate: s.StartEventDate || null }))
      .filter(s => s.eventName && s.eventId);
    if (selections.length === 0) {
      if (err) { err.textContent = '⚠ 找不到任何賽事 (EventName / EventId)'; err.style.display = 'block'; }
      return;
    }
    const existingIds = new Set(_msgEvents.map(e => String(e.eventId)));
    selections.forEach(s => {
      if (!existingIds.has(s.eventId)) _msgEvents.push({ eventName: s.eventName, eventId: s.eventId, status: s.status, startDate: s.startDate || null, notes: '' });
    });
    if (err) err.style.display = 'none';
    ta.value = '';
    _renderMsgCompose(overlay);
  }

  function _saveCurrentMsgNotes() {
    _msgEvents.forEach((ev, i) => {
      const ta = document.getElementById(`msg-notes-${i}`);
      if (ta) ev.notes = ta.value;
    });
  }

  function _removeMsgEvent(idx) {
    _saveCurrentMsgNotes();
    _msgEvents.splice(idx, 1);
    const overlay = document.getElementById('msg-compose-overlay');
    if (overlay) _renderMsgCompose(overlay);
  }

  function _copyMsgCompose() {
    _saveCurrentMsgNotes();
    const includeEventId = document.getElementById('msg-include-eventid')?.checked !== false;
    const parts = _msgEvents
      .filter(ev => ev.notes && ev.notes.trim())
      .map(ev => includeEventId
        ? `${ev.eventName}\nEventId: ${ev.eventId}\n${ev.notes.trim()}`
        : `${ev.eventName}\n${ev.notes.trim()}`);
    if (!parts.length) { alert('請至少填寫一筆備註'); return; }
    // save notes (including links) to standalone store so 📌 works later
    _msgEvents.forEach(ev => { if (ev.notes && ev.notes.trim()) _ensSet(ev.eventName, ev.notes); });
    const text = parts.join('\n\n');
    navigator.clipboard.writeText(text).then(() => _closeMsgCompose()).catch(() => {
      const ta = document.createElement('textarea');
      ta.value = text;
      Object.assign(ta.style, { position: 'fixed', opacity: '0', top: '0', left: '0' });
      document.body.appendChild(ta);
      ta.select();
      document.execCommand('copy');
      ta.remove();
      _closeMsgCompose();
    });
  }
</script>
</body>
</html>
