<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Reminder4ME</title>
  <style>
    :root {
      --bg:           #f0ebe4;
      --surface:      #faf8f5;
      --surface2:     #ede8e0;
      --border:       #ddd5c8;
      --border-light: #ece6de;
      --text-pri:     #4a4238;
      --text-sec:     #8a7d72;
      --text-muted:   #b5a99e;
      --blue:         #8facc8;
      --blue-light:   #c5d5e8;
      --blue-bg:      rgba(143,172,200,0.12);
      --orange:       #c4956a;
      --orange-bg:    rgba(196,149,106,0.12);
      --red:          #c47878;
      --red-bg:       rgba(196,120,120,0.12);
      --green:        #7aab8a;
      --green-bg:     rgba(122,171,138,0.12);
      --green-border: rgba(122,171,138,0.4);
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang TC', sans-serif;
      background: var(--bg);
      color: var(--text-pri);
      min-height: 100vh;
    }

    /* ── Header ── */
    .header {
      background: var(--surface);
      border-bottom: 1px solid var(--border);
      padding: 14px 24px;
      display: flex;
      align-items: center;
      gap: 12px;
      position: sticky;
      top: 0;
      z-index: 10;
    }
    .header h1 { font-size: 15px; font-weight: 700; color: var(--text-pri); }
    .header-badge {
      background: var(--red);
      color: #fff;
      border-radius: 10px;
      font-size: 11px;
      font-weight: 700;
      padding: 2px 8px;
      min-width: 22px;
      text-align: center;
      display: none;
    }
    .header-badge.show { display: inline-block; }
    .notification-btn {
      padding: 6px 12px;
      background: var(--surface2);
      border: 1px solid var(--border);
      border-radius: 6px;
      color: var(--text-sec);
      font-size: 12px;
      cursor: pointer;
    }
    .notification-btn.granted { color: var(--green); border-color: var(--green-border); }
    .settlement-btn {
      padding: 6px 12px;
      background: var(--surface2);
      border: 1px solid var(--border);
      border-radius: 6px;
      color: var(--text-sec);
      font-size: 12px;
      cursor: pointer;
    }
    .settlement-btn:hover { background: var(--orange-bg); border-color: var(--orange); color: var(--orange); }
    .agent-name-input {
      padding: 6px 12px;
      border: 1px solid var(--border);
      border-radius: 6px;
      background: var(--surface2);
      color: var(--text-pri);
      font-size: 12px;
      width: 100px;
      outline: none;
    }
    .agent-name-input:focus { border-color: var(--blue-light); background: var(--surface); }
    .agent-name-input::placeholder { color: var(--text-muted); }

    /* ── Layout ── */
    .container { max-width: 1020px; margin: 0 auto; padding: 16px 20px; }
    .main-layout { display: grid; grid-template-columns: 360px 1fr; gap: 20px; align-items: start; }
    .right-col { min-width: 0; }
    @media (max-width: 720px) { .main-layout { grid-template-columns: 1fr; } }

    /* ── Back to top ── */
    .back-to-top {
      position: fixed;
      bottom: 24px;
      right: 20px;
      width: 40px;
      height: 40px;
      border-radius: 50%;
      background: var(--blue);
      color: #fff;
      border: none;
      font-size: 18px;
      cursor: pointer;
      box-shadow: 0 4px 16px rgba(143,172,200,0.4);
      display: none;
      align-items: center;
      justify-content: center;
      z-index: 900;
      transition: opacity 0.2s;
    }
    .back-to-top.show { display: flex; }
    .back-to-top:hover { background: #7a9ab8; }

    /* ── Form card ── */
    .form-card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 14px;
      margin-bottom: 16px;
    }
    .form-title {
      font-size: 11px;
      font-weight: 700;
      color: var(--text-muted);
      text-transform: uppercase;
      letter-spacing: 0.8px;
      margin-bottom: 12px;
      display: flex; align-items: center; justify-content: space-between;
    }
    .btn-clear-form {
      font-size: 11px; font-weight: 500; text-transform: none; letter-spacing: 0;
      color: var(--text-muted); background: none; border: none; cursor: pointer;
      padding: 2px 6px; border-radius: 5px; transition: color 0.15s, background 0.15s;
    }
    .btn-clear-form:hover { color: var(--red); background: var(--red-bg); }
    .form-group { display: flex; flex-direction: column; gap: 5px; margin-bottom: 10px; }
    .form-group:last-child { margin-bottom: 0; }
    .form-group label { font-size: 12px; color: var(--text-sec); }
    .form-group input, .form-group textarea {
      background: var(--surface2);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 7px 10px;
      color: var(--text-pri);
      font-size: 13px;
      outline: none;
      transition: border-color 0.18s;
      width: 100%;
      font-family: inherit;
    }
    .form-group textarea { resize: vertical; min-height: 60px; }
    .form-group input:focus, .form-group textarea:focus { border-color: var(--blue); }
    .form-group input::placeholder, .form-group textarea::placeholder { color: var(--text-muted); }

    /* ── Group blocks ── */
    .group-list { display: flex; flex-direction: column; gap: 10px; margin-bottom: 10px; }
    .group-block {
      background: var(--surface2);
      border: 1px solid var(--border-light);
      border-radius: 10px;
      padding: 12px 14px;
    }
    .group-block-header {
      display: flex;
      align-items: center;
      gap: 8px;
      margin-bottom: 8px;
    }
    .group-block-label { font-size: 11px; font-weight: 700; color: var(--text-muted); flex: 1; }
    .btn-remove-group {
      background: transparent;
      border: none;
      color: var(--text-muted);
      font-size: 17px;
      cursor: pointer;
      padding: 0 2px;
      line-height: 1;
    }
    .btn-remove-group:hover { color: var(--red); }
    .order-rows { display: flex; flex-direction: column; gap: 6px; margin-top: 6px; }
    .order-row { display: flex; gap: 6px; align-items: center; }
    .order-row input { flex: 1; }
    .btn-remove-order {
      background: transparent;
      border: none;
      color: var(--text-muted);
      font-size: 17px;
      cursor: pointer;
      padding: 0 3px;
      flex-shrink: 0;
      line-height: 1;
    }
    .btn-remove-order:hover { color: var(--red); }
    .btn-add-inline {
      flex-shrink: 0;
      width: 22px;
      height: 22px;
      border-radius: 50%;
      border: 1px solid var(--blue-light);
      background: var(--blue-bg);
      color: var(--blue);
      font-size: 15px;
      line-height: 1;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 0;
    }
    .btn-add-inline:hover { background: rgba(143,172,200,0.25); }
    .btn-add-group {
      width: 100%;
      padding: 9px;
      font-size: 13px;
      color: var(--blue);
      background: var(--blue-bg);
      border: 1px dashed var(--blue-light);
      border-radius: 8px;
      cursor: pointer;
      margin-bottom: 14px;
    }
    .btn-add-group:hover { background: rgba(143,172,200,0.2); }
    .btn-import-json {
      padding: 9px 14px; font-size: 13px; white-space: nowrap;
      color: var(--orange); background: var(--orange-bg);
      border: 1px dashed rgba(196,149,106,0.5); border-radius: 8px; cursor: pointer;
    }
    .btn-import-json:hover { background: rgba(196,149,106,0.2); }

    /* ── Requirement combobox ── */
    .req-combobox { position: relative; display: flex; gap: 6px; align-items: center; }
    .req-input-row { display: contents; }
    .req-input {
      flex: 1; padding: 8px 12px; border: 1px solid var(--border); border-radius: 8px;
      background: var(--surface2); font-size: 13px; color: var(--text-pri); outline: none;
      transition: border-color 0.15s, background 0.15s;
    }
    .req-input:focus { border-color: var(--blue-light); background: var(--surface); }
    .req-toggle {
      flex-shrink: 0; width: 32px; height: 32px;
      border: 1px solid var(--border); border-radius: 8px; background: var(--surface2);
      cursor: pointer; color: var(--text-sec);
      display: flex; align-items: center; justify-content: center;
      transition: all 0.15s;
    }
    .req-toggle:hover { background: var(--blue-bg); color: var(--blue); border-color: var(--blue-light); }
    .req-dropdown {
      position: absolute; top: calc(100% + 4px); left: 0; right: 38px;
      background: var(--surface); border: 1px solid var(--border);
      border-radius: 8px; box-shadow: 0 4px 16px rgba(0,0,0,0.1);
      z-index: 50; overflow: hidden; max-height: 200px; overflow-y: auto;
    }
    .req-option {
      padding: 9px 14px; font-size: 13px; cursor: pointer; color: var(--text-pri);
    }
    .req-option:hover, .req-option.highlighted { background: var(--blue-bg); color: var(--blue); }
    .req-option-hint { font-size: 11px; color: var(--text-muted); margin-top: 1px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .gear-btn { background: none; border: none; cursor: pointer; font-size: 13px; color: var(--text-muted); padding: 0; line-height: 1; }
    .gear-btn:hover { color: var(--text-sec); }

    /* ── Presets gear modal ── */
    .preset-modal-overlay {
      position: fixed; inset: 0; background: rgba(0,0,0,0.25);
      display: flex; align-items: center; justify-content: center; z-index: 200;
    }
    .preset-modal {
      background: var(--surface); border: 1px solid var(--border); border-radius: 12px;
      padding: 20px; width: 400px; max-width: 92vw;
      box-shadow: 0 8px 32px rgba(0,0,0,0.12);
    }
    .preset-list-scroll { max-height: 280px; overflow-y: auto; padding-right: 2px; margin-bottom: 2px; }
    .preset-row {
      display: flex; align-items: center; gap: 6px; padding: 6px 8px;
      background: var(--surface2); border: 1px solid var(--border); border-radius: 8px; margin-bottom: 6px;
      cursor: default;
    }
    .preset-row.drag-over { border-color: var(--blue-light); background: var(--blue-bg); }
    .preset-bet-toggle {
      display: flex; align-items: center; gap: 3px; flex-shrink: 0;
      font-size: 11px; color: var(--text-muted); cursor: pointer; user-select: none;
      white-space: nowrap;
    }
    .preset-bet-toggle input { accent-color: var(--blue); cursor: pointer; margin: 0; }
    .preset-bet-toggle:has(input:checked) { color: var(--blue); }
    .preset-drag-handle {
      cursor: grab; color: var(--text-muted); font-size: 14px; flex-shrink: 0;
      padding: 0 2px; line-height: 1; user-select: none;
    }
    .preset-drag-handle:active { cursor: grabbing; }
    .preset-edit-input {
      border: 1px solid transparent; border-radius: 5px; background: transparent;
      font-size: 12px; color: var(--text-pri); outline: none; padding: 2px 5px;
      transition: border-color 0.15s, background 0.15s;
    }
    .preset-edit-input:hover { border-color: var(--border); background: var(--surface); }
    .preset-edit-input:focus { border-color: var(--blue-light); background: var(--surface); }
    .preset-edit-label { width: 62px; flex-shrink: 0; font-weight: 700; color: var(--text-sec); }
    .preset-edit-value { flex: 1; color: var(--text-muted); min-width: 0; }
    .btn-del-preset { background: none; border: none; cursor: pointer; color: var(--text-muted); font-size: 15px; padding: 0 2px; flex-shrink: 0; }
    .btn-del-preset:hover { color: var(--red); }
    .preset-add-grid { display: grid; grid-template-columns: 80px 1fr auto; gap: 6px; margin-top: 8px; }
    .preset-add-input {
      padding: 7px 10px; border: 1px solid var(--border); border-radius: 7px;
      background: var(--surface2); font-size: 12px; color: var(--text-pri); outline: none;
    }
    .preset-add-input:focus { border-color: var(--blue-light); }
    .json-event-item {
      display: flex; align-items: flex-start; gap: 10px;
      padding: 8px 10px; border-radius: 8px; cursor: pointer;
      border: 1px solid var(--border); background: var(--surface2); margin-bottom: 6px;
    }
    .json-event-item.is-opened { background: var(--blue-bg); border-color: var(--blue-light); }
    .json-event-item:hover { background: var(--blue-bg); border-color: var(--blue-light); }
    .json-event-item input[type=checkbox] { margin-top: 2px; accent-color: var(--blue); flex-shrink: 0; }
    .json-event-name { font-size: 13px; font-weight: 600; color: var(--text-pri); }
    .json-event-time { font-size: 11px; color: var(--text-sec); margin-left: auto; white-space: nowrap; flex-shrink: 0; }
    .json-bet-line { font-size: 12px; color: var(--text-pri); margin-top: 3px; }
    .json-score-line { font-size: 12px; color: var(--text-sec); margin-top: 1px; }
    .shared-fields { display: flex; flex-direction: column; gap: 0; margin-bottom: 14px; }
    .btn-submit {
      width: 100%;
      padding: 11px;
      background: var(--blue);
      color: #fff;
      border: none;
      border-radius: 8px;
      font-size: 14px;
      font-weight: 700;
      cursor: pointer;
      transition: background 0.18s, transform 0.1s;
    }
    .btn-submit:hover { background: #7a9ab8; }
    .btn-submit:active { transform: scale(0.98); }
    .lang-select-group { display: flex; gap: 6px; }
    .lang-sel-btn {
      flex: 1; padding: 6px 0; border-radius: 6px; font-size: 12px; font-weight: 600;
      border: 1px solid var(--border); background: var(--surface2); color: var(--text-muted);
      cursor: pointer; transition: all 0.15s;
    }
    .lang-sel-btn:hover { border-color: var(--blue); color: var(--blue); }
    .lang-sel-btn.active { background: var(--blue); border-color: var(--blue); color: #fff; }

    /* ── Section header ── */
    .section-header {
      display: flex;
      align-items: center;
      gap: 8px;
      margin-bottom: 12px;
    }
    .export-btn {
      margin-left: auto;
      padding: 4px 10px;
      background: var(--surface2);
      border: 1px solid var(--border);
      border-radius: 6px;
      font-size: 11px;
      color: var(--text-sec);
      cursor: pointer;
    }
    .export-btn:hover { background: var(--blue-bg); border-color: var(--blue-light); color: var(--blue); }
    .section-title {
      font-size: 12px;
      font-weight: 700;
      color: var(--text-muted);
      text-transform: uppercase;
      letter-spacing: 0.8px;
    }
    .count-badge {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      background: var(--red);
      color: #fff;
      border-radius: 10px;
      font-size: 11px;
      font-weight: 700;
      padding: 2px 7px;
      min-width: 22px;
    }
    .count-badge.gray { background: var(--surface2); color: var(--text-sec); border: 1px solid var(--border); }

    /* ── Batch group ── */
    .batch-group { display: flex; flex-direction: column; gap: 0; margin-bottom: 14px; border: 1.5px solid var(--border); border-radius: 12px; overflow: hidden; background: var(--surface2); }
    .batch-group-header { border-radius: 0; border: none; border-bottom: 1px solid var(--border); }
    .batch-group .record-card { border-radius: 0; border: none; border-bottom: 1px solid var(--border-light); margin: 0; }
    .batch-group .record-card:last-child { border-bottom: none; }
    .batch-group-header {
      display: flex; align-items: center; gap: 8px;
      padding: 6px 10px; background: var(--surface2);
      border: 1px solid var(--border); border-radius: 8px;
      flex-wrap: wrap;
    }
    .batch-group-label { font-size: 12px; font-weight: 700; color: var(--text-sec); }
    .batch-group-count { font-size: 11px; color: var(--text-muted); background: var(--bg); border: 1px solid var(--border-light); border-radius: 10px; padding: 1px 7px; }
    .batch-group-actions { display: flex; gap: 6px; align-items: center; margin-left: auto; flex-wrap: wrap; }
    .batch-bar-count { font-size: 12px; color: var(--blue); font-weight: 600; }
    .batch-cb {
      width: 16px; height: 16px; flex-shrink: 0; cursor: pointer;
      accent-color: var(--blue); margin-right: 2px;
    }
    .batch-card .card-header { display: flex; align-items: flex-start; gap: 8px; }
    .card-selected { outline: 2px solid var(--blue-light); }
    .batch-bar-btn {
      padding: 4px 10px; border-radius: 6px; font-size: 11px; font-weight: 600;
      cursor: pointer; border: 1px solid; white-space: nowrap;
    }
    .batch-bar-done    { background: var(--green-bg);  border-color: var(--green-border); color: var(--green); }
    .batch-bar-restart { background: var(--orange-bg); border-color: rgba(196,149,106,0.4); color: var(--orange); }
    .batch-bar-msg     { background: var(--surface);   border-color: var(--border); color: var(--text-sec); }
    .batch-bar-btn[disabled] { opacity: 0.35; cursor: default; }
    .batch-msg-item { margin-bottom: 10px; }
    .batch-msg-label { font-size: 12px; font-weight: 600; color: var(--text-sec); margin-bottom: 4px; }

    /* ── Record card ── */
    .record-card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 8px;
      margin-bottom: 6px;
      overflow: hidden;
      transition: border-color 0.3s;
    }
    .record-card.warn  { border-color: var(--orange); }
    .record-card.alert { border-color: var(--red); background: rgba(196,120,120,0.04); }
    .card-header {
      display: flex;
      align-items: stretch;
      padding: 7px 10px 6px;
      border-bottom: 1px solid var(--border-light);
      gap: 6px;
    }
    .card-events { display: flex; flex-direction: column; flex: 1; gap: 3px; min-width: 0; }
    .card-event-row { display: flex; align-items: center; gap: 5px; }
    .card-event-name {
      flex: 1;
      font-size: 12px;
      font-weight: 700;
      color: var(--text-pri);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .btn-msg {
      padding: 4px 10px;
      background: var(--surface2);
      border: 1px solid var(--border);
      border-radius: 6px;
      font-size: 12px;
      color: var(--text-sec);
      cursor: pointer;
      flex-shrink: 0;
    }
    .btn-msg:hover { background: var(--border-light); }
    .card-body {
      display: flex;
      align-items: flex-start;
      gap: 8px;
      padding: 8px 10px 10px;
    }

    /* ── Timer box ── */
    .timer-box {
      width: 58px;
      min-width: 58px;
      height: 50px;
      border-radius: 10px;
      border: 2px solid var(--border);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 1px;
      transition: border-color 0.3s, background 0.3s;
      flex-shrink: 0;
    }
    .timer-box .t-time {
      font-size: 14px;
      font-weight: 800;
      line-height: 1;
      font-variant-numeric: tabular-nums;
    }
    .timer-box .t-stage { font-size: 10px; font-weight: 600; letter-spacing: 0.3px; }
    .timer-box.normal { border-color: var(--blue); background: var(--blue-bg); }
    .timer-box.normal .t-time { color: var(--blue); }
    .timer-box.normal .t-stage { color: var(--blue); }
    .timer-box.warn   { border-color: var(--orange); background: var(--orange-bg); }
    .timer-box.warn   .t-time { color: var(--orange); }
    .timer-box.warn   .t-stage { color: var(--orange); }
    .timer-box.alert  { border-color: var(--red); background: var(--red-bg); }
    .timer-box.alert  .t-time { color: var(--red); }
    .timer-box.alert  .t-stage { color: var(--red); }
    .timer-box.expired { border-color: var(--red); background: var(--red-bg); animation: blink 1s infinite; }
    .timer-box.expired .t-time { color: var(--red); font-size: 11px; }
    .timer-box.expired .t-stage { color: var(--red); }
    @keyframes blink { 0%,100% { opacity:1; } 50% { opacity:0.45; } }

    /* ── Record info ── */
    .record-info { flex: 1; min-width: 0; }
    .order-tags { display: flex; flex-wrap: wrap; gap: 5px; margin-bottom: 6px; }
    .order-tag {
      display: inline-flex;
      align-items: center;
      gap: 4px;
      background: var(--blue-bg);
      border: 1px solid var(--blue-light);
      border-radius: 5px;
      padding: 2px 7px;
      font-size: 12px;
      color: var(--blue);
      font-weight: 600;
    }
    .btn-copy-tag {
      background: none;
      border: none;
      cursor: pointer;
      color: var(--text-muted);
      font-size: 12px;
      padding: 0;
      line-height: 1;
      transition: transform 0.2s ease, color 0.2s ease;
    }
    .btn-copy-tag:hover { color: var(--blue); }
    .btn-copy-tag.copied { color: var(--green); transform: scale(1.4); transition: transform 0.12s ease, color 0.12s ease; }
    .record-req {
      font-size: 12px;
      color: var(--text-pri);
      font-weight: 600;
      margin-bottom: 2px;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .record-meta { font-size: 12px; color: var(--text-sec); line-height: 1.6; }
    .record-meta b { color: var(--text-pri); font-weight: 600; }
    .record-meta-note {
      overflow: hidden; display: -webkit-box;
      -webkit-line-clamp: 2; -webkit-box-orient: vertical;
    }
    .bet-info-block { margin-top: 6px; padding-top: 6px; border-top: 1px solid var(--border-light); }
    .bet-league-line { font-size: 11px; color: var(--text-muted); font-weight: 600; margin-bottom: 2px; }
    .bet-info-row { display: flex; align-items: flex-start; gap: 6px; justify-content: space-between; }
    .bet-info-line {

    .bet-time-line  { font-size: 11px; color: var(--text-muted); margin-top: 3px; }
    .header-search-wrap { display: flex; align-items: center; gap: 3px; }
    .header-search-input { width: 180px; padding: 6px 10px; font-size: 12px; line-height: 1.5; box-sizing: border-box; border: 1px solid var(--border); border-radius: 6px; background: var(--surface2); color: var(--text-pri); outline: none; }
    .header-search-input:focus { border-color: var(--blue); background: var(--surface); }
    .header-search-input::placeholder { color: var(--text-muted); }
    .search-clear-btn { background: none; border: none; font-size: 15px; color: var(--text-muted); cursor: pointer; padding: 0 3px; line-height: 1; }
    .search-clear-btn:hover { color: var(--text-pri); }
    .note-hint-icon-btn { background: none; border: none; font-size: 13px; cursor: pointer; padding: 0 2px; line-height: 1; color: var(--blue); flex-shrink: 0; }
    .note-hint-icon-btn:hover { opacity: 0.7; }
    .note-hint-card { background: var(--blue-bg); border: 1px solid var(--blue-light); border-radius: 8px; padding: 8px 10px; margin-bottom: 8px; }
    .note-hint-event { font-size: 12px; font-weight: 700; color: var(--text-pri); margin-bottom: 3px; }
    .note-hint-text { font-size: 12px; color: var(--text-sec); white-space: pre-wrap; word-break: break-word; }
    .note-hint-time { font-size: 11px; color: var(--text-muted); margin-top: 4px; }

    /* ── Record actions ── */
    .record-actions { display: flex; flex-direction: column; gap: 5px; align-items: flex-end; flex-shrink: 0; }
    .btn-done {
      padding: 5px 12px;
      background: var(--green-bg);
      color: var(--green);
      border: 1px solid var(--green-border);
      border-radius: 6px;
      font-size: 12px;
      font-weight: 600;
      cursor: pointer;
      white-space: nowrap;
    }
    .btn-done:hover { background: rgba(122,171,138,0.22); }
    .btn-summary {
      padding: 5px 12px;
      background: var(--blue-bg);
      color: var(--blue);
      border: 1px solid var(--blue-light);
      border-radius: 6px;
      font-size: 12px;
      font-weight: 600;
      cursor: pointer;
      white-space: nowrap;
    }
    .btn-summary:hover { background: rgba(143,172,200,0.22); }
    .btn-restart {
      padding: 5px 12px;
      background: var(--orange-bg);
      color: var(--orange);
      border: 1px solid rgba(196,149,106,0.3);

    .btn-del {

      color: var(--text-muted);
      border: 1px solid var(--border);
      border-radius: 6px;
      font-size: 11px;
      cursor: pointer;

    /* ── Empty state ── */
    .empty-state { text-align: center; padding: 36px; color: var(--text-muted); font-size: 14px; }

    /* ── Completed section ── */
    .completed-section { margin-top: 16px; }
    /* ── Pending timer ── */
    .timer-box.pending { border-color: var(--text-muted); background: var(--surface2); }
    .timer-box.pending .t-time { color: var(--text-muted); font-size: 11px; }
    .timer-box.pending .t-stage { color: var(--text-muted); }
    .toggle-row { cursor: pointer; display: flex; align-items: center; gap: 8px; user-select: none; }
    .toggle-row:hover .section-title { color: var(--text-sec); }
    .chevron { color: var(--text-muted); font-size: 11px; transition: transform 0.2s; }
    .chevron.open { transform: rotate(180deg); }
    .record-card.done { opacity: 0.55; }

    /* ── Popup overlay ── */
    .popup-overlay {
      position: fixed;
      inset: 0;
      background: rgba(74,66,56,0.45);
      z-index: 1000;
      display: flex;
      align-items: center;
      justify-content: center;
      animation: overlayIn 0.2s ease;
    }
    @keyframes overlayIn { from { opacity:0; } to { opacity:1; } }
    .popup-card {
      background: var(--surface);
      border: 2px solid var(--border);
      border-radius: 18px;
      padding: 24px 26px 26px;
      max-width: 440px;
      width: 92%;
      box-shadow: 0 16px 60px rgba(74,66,56,0.2);
      animation: cardUp 0.28s cubic-bezier(0.16,1,0.3,1);

    }
    .popup-card.stage1 { border-color: var(--orange); }
    .popup-card.stage2 { border-color: var(--red); }
    .popup-card.submit-popup { border-color: var(--green); }
    @keyframes cardUp { from { transform: translateY(20px) scale(0.97); opacity:0; } to { transform: none; opacity:1; } }
    .popup-close-btn {
      position: absolute; top: 14px; right: 16px;
      background: none; border: none; font-size: 20px;
      color: var(--text-muted); cursor: pointer; line-height: 1;
    }
    .popup-close-btn:hover { color: var(--text-pri); }
    .popup-badge {
      display: inline-block;
      padding: 4px 12px;
      border-radius: 20px;
      font-size: 11px;
      font-weight: 800;
      letter-spacing: 0.5px;
      margin-bottom: 12px;
    }
    .popup-badge.first  { background: var(--orange-bg); color: var(--orange); border: 1px solid rgba(196,149,106,0.35); }
    .popup-badge.final  { background: var(--red-bg); color: var(--red); border: 1px solid rgba(196,120,120,0.4); animation: pulse 0.9s infinite; }
    .popup-badge.success{ background: var(--green-bg); color: var(--green); border: 1px solid var(--green-border); }
    .popup-badge.info   { background: var(--blue-bg); color: var(--blue); border: 1px solid var(--blue-light); }
    @keyframes pulse { 0%,100% { opacity:1; } 50% { opacity:0.5; } }
    .popup-event-name { font-size: 20px; font-weight: 800; color: var(--text-pri); margin-bottom: 8px; }
    .popup-meta-info { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 14px; min-height: 0; }
    .popup-meta-info:empty { display: none; }
    .popup-meta-tag { background: var(--surface2); border: 1px solid var(--border); border-radius: 4px; padding: 2px 7px; font-size: 11px; color: var(--text-sec); font-family: monospace; }
    .popup-meta-group { background: var(--orange-bg); border: 1px solid rgba(196,149,106,0.3); border-radius: 4px; padding: 2px 7px; font-size: 11px; color: var(--orange); font-weight: 600; }
    .popup-title { font-size: 16px; font-weight: 700; color: var(--text-pri); margin-bottom: 14px; }
    .reply-box {
      background: var(--surface2);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 12px 14px;
      margin-bottom: 12px;
      font-size: 13px;

    .reply-row.lang-highlight .reply-row-text { color: var(--text-pri); font-weight: 500; }

    .reply-row-text {

    .btn-copy-reply.copied { background: var(--green-bg); color: var(--green); border-color: var(--green-border); transform: scale(1.03); }
    .popup-queue-note { font-size: 12px; color: var(--text-muted); text-align: center; margin-bottom: 12px; }
    .popup-btns { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
    .popup-btns.single { grid-template-columns: 1fr; }
    .btn-popup-done {
      padding: 12px;
      background: var(--green-bg);
      color: var(--green);
      border: 1px solid var(--green-border);
      border-radius: 9px;

      font-weight: 700;
      cursor: pointer;
    }
    .btn-popup-done:hover { background: rgba(122,171,138,0.25); }
    .btn-popup-sec {
      padding: 12px;
      background: var(--surface2);
      color: var(--text-sec);
      border: 1px solid var(--border);

    .btn-icon-sm { background: none; border: 1px solid var(--border); border-radius: 4px; padding: 1px 5px; font-size: 12px; cursor: pointer; color: var(--text-muted); line-height: 1.4; }

    .msg-compose-btn {
      padding: 6px 12px;

      color: var(--text-sec);

    }

      display: flex;

    .msg-event-remove { background: none; border: none; font-size: 16px; color: var(--text-muted); cursor: pointer; line-height: 1; padding: 0 2px; flex-shrink: 0; }
    .msg-event-remove:hover { color: var(--red); }
    .msg-event-notes {
      width: 100%; background: var(--surface); border: 1px solid var(--border);
      border-radius: 7px; padding: 7px 10px; font-size: 13px; color: var(--text-pri);
      font-family: inherit; resize: vertical; outline: none; min-height: 58px;

    /* ── Responsive ── */
    @media (max-width: 520px) {
      .card-body { flex-wrap: wrap; }
      .record-actions { flex-direction: row; }
    }
  </style>
</head>
<body>

<div class="header">
  <h1>回覆提醒</h1>
  <span class="header-badge" id="header-badge">0</span>
  <button class="msg-compose-btn" onclick="showMsgComposePopup()">📨 賽事訊息</button>
  <button class="settlement-btn" onclick="showSettlementPopup()">📊 每日結算</button>
  <div class="header-search-wrap">
    <input id="records-search" type="text" class="header-search-input" placeholder="搜尋 ID 或賽事…" oninput="onSearchInput()">
    <button class="search-clear-btn" id="search-clear-btn" onclick="clearSearch()" style="display:none">×</button>
  </div>
  <span style="flex:1"></span>
  <button class="notification-btn" id="notif-btn" onclick="requestNotifPermission()">🔔 開啟通知</button>
  <input class="agent-name-input" id="agent-name" type="text" placeholder="你的名字" oninput="saveAgentName()" />
</div>

<div class="container">
  <div class="main-layout">

    <!-- ── Left: Add form ── -->
    <div class="left-col">
      <div class="form-card">
        <div class="form-title">
          <span>新增記錄</span>
          <button type="button" class="btn-clear-form" onclick="clearForm()" title="清除所有內容">清空</button>
        </div>
        <form id="add-form" onsubmit="handleSubmit(event)">
          <div class="group-list" id="group-list"></div>
          <div style="display:flex;gap:8px;margin-bottom:10px">
            <button type="button" class="btn-add-group" style="flex:1;margin-bottom:0" onclick="addFormGroup()">＋ 新增賽事群組</button>
            <button type="button" class="btn-import-json" onclick="showJsonImportPopup()">📥 JSON</button>
          </div>
          <div class="shared-fields">
            <div class="form-group">
              <label>需求 * <button type="button" class="gear-btn" onclick="openPresetsModal()" title="管理預設需求">⚙️</button></label>
              <div class="req-combobox" id="req-combobox">
                <div class="req-input-row">
                  <input id="f-req" class="req-input" placeholder="客戶的需求或問題描述" autocomplete="off" required oninput="onReqInput()" onfocus="onReqInput()" onkeydown="onReqKeydown(event)">
                  <button type="button" class="req-toggle" onclick="toggleReqDrop()" title="顯示建議">
                    <svg width="12" height="12" viewBox="0 0 12 12" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><polyline points="2,4 6,8 10,4"/></svg>
                  </button>
                </div>
                <div class="req-dropdown" id="req-dropdown" style="display:none"></div>
              </div>
            </div>
            <div class="form-group">
              <label>群組名稱 *</label>
              <input id="f-group" placeholder="群組名稱" autocomplete="off" required>
            </div>
            <div class="form-group">
              <label>附加資訊</label>
              <textarea id="f-info" placeholder="選填，附加說明…"></textarea>
            </div>
          </div>
          <div class="form-group">
            <label>回覆語言</label>
            <div class="lang-select-group" id="lang-select">
              <button type="button" class="lang-sel-btn" data-lang="en" onclick="setFormLang('en')">EN</button>
              <button type="button" class="lang-sel-btn" data-lang="zh" onclick="setFormLang('zh')">中</button>
              <button type="button" class="lang-sel-btn" data-lang="kr" onclick="setFormLang('kr')">KR</button>
            </div>
          </div>
          <button type="submit" class="btn-submit">⏱ 添加計時器</button>
        </form>
      </div>
    </div>

    <!-- ── Right: Records ── -->
    <div class="right-col">
      <div class="section-header">
        <span class="section-title">待處理</span>
        <span class="count-badge" id="active-count" style="display:none">0</span>
        <button class="export-btn" onclick="markAllDone()" title="全部標記為已完成">✓ 全完成</button>
        <button class="export-btn" onclick="showExportPopup()" title="匯出所有待處理">📤 匯出</button>
      </div>
      <div id="active-records"></div>

      <div class="completed-section">
        <div class="section-header toggle-row" onclick="toggleCompleted()">
          <span class="section-title">已完成</span>
          <span class="count-badge gray" id="done-count">0</span>
          <span class="chevron" id="chevron">▼</span>
        </div>
        <div id="completed-list" style="display:none">
          <div id="completed-records"></div>
        </div>
      </div>
    </div>

  </div>
</div>

<button class="back-to-top" id="back-to-top" onclick="window.scrollTo({top:0,behavior:'smooth'})" title="回到頂部">↑</button>

<!-- ── Popup (injected dynamically) ── -->

<script>
  const STAGE1_MS   = 9 * 60 * 1000;
  const STAGE2_MS   = 9 * 60 * 1000;
  const STORAGE_KEY = 'reminder4me_v3';

  let records      = [];
  let timerHandles = {};
  let popupQueue   = [];
  let activePopupId = null;
  let _pendingCopy = '';   // stores text for popup copy buttons
  let _replyTexts  = { zh: '', en: '', kr: '' };
  let selectedIds  = new Set();

  // ── Form group state ──
  let groupCounter = 0;
  let formGroups   = []; // [{id, eventName, orderNos:[]}]
  let formLang     = null; // 'en'|'zh'|'kr'|null

  function save() { localStorage.setItem(STORAGE_KEY, JSON.stringify(records)); }
  function load() {
    try { const raw = localStorage.getItem(STORAGE_KEY); records = raw ? JSON.parse(raw) : []; }
    catch(e) { records = []; }
  }
  function getAgentName() { return (document.getElementById('agent-name') || {}).value?.trim() || ''; }
  function saveAgentName() { localStorage.setItem('reminder4me_agent', getAgentName()); }

  // ── Requirement presets ──
  const PRESETS_KEY = 'reminder4me_req_presets';
  const DEFAULT_PRESETS = [
    { label: '結算',    value: 'set pls' },
    { label: '賽果',    value: 'Pls check if the settlement is correct and a link, ty' },
    { label: '盤口賠率', value: 'Pls check if the market and odds are correct, ty' },
    { label: '無效進球', value: 'Pls check if any disallowed goal, ty' },
  ];
  function loadPresets() {
    try { const r = localStorage.getItem(PRESETS_KEY); return r ? JSON.parse(r) : [...DEFAULT_PRESETS]; }
    catch(e) { return [...DEFAULT_PRESETS]; }
  }
  function savePresetsData(p) { localStorage.setItem(PRESETS_KEY, JSON.stringify(p)); }

  let _reqHighlight = -1;
  function getFilteredPresets(q) {
    const presets = loadPresets();
    if (!q) return presets;
    const lq = q.toLowerCase();
    return presets.filter(p => p.label.toLowerCase().includes(lq) || p.value.toLowerCase().includes(lq));
  }
  function renderReqDropdown(items) {
    const drop = document.getElementById('req-dropdown');
    if (!items.length) { drop.style.display = 'none'; return; }
    _reqHighlight = -1;
    drop.innerHTML = items.map((p, i) =>
      `<div class="req-option" data-idx="${i}" onmousedown="pickPreset(${i})" onmouseover="highlightReq(${i})">
        <div>${esc(p.label)}</div>
        <div class="req-option-hint">${esc(p.value)}</div>
      </div>`
    ).join('');
    drop.style.display = 'block';
    drop._items = items;
  }
  function onReqInput() {
    const q = document.getElementById('f-req').value;
    renderReqDropdown(getFilteredPresets(q));
  }
  function toggleReqDrop() {
    const drop = document.getElementById('req-dropdown');
    if (drop.style.display !== 'none') { drop.style.display = 'none'; return; }
    renderReqDropdown(loadPresets());
  }
  function pickPreset(i) {
    const drop = document.getElementById('req-dropdown');
    const item = (drop._items || [])[i];
    if (!item) return;
    document.getElementById('f-req').value = item.value;
    drop.style.display = 'none';
  }
  function highlightReq(i) {
    _reqHighlight = i;
    document.querySelectorAll('.req-option').forEach((el, idx) => el.classList.toggle('highlighted', idx === i));
  }
  function onReqKeydown(e) {
    const drop = document.getElementById('req-dropdown');
    if (drop.style.display === 'none') return;
    const opts = drop.querySelectorAll('.req-option');
    if (e.key === 'ArrowDown') { e.preventDefault(); _reqHighlight = Math.min(_reqHighlight + 1, opts.length - 1); opts.forEach((el, i) => el.classList.toggle('highlighted', i === _reqHighlight)); }
    else if (e.key === 'ArrowUp') { e.preventDefault(); _reqHighlight = Math.max(_reqHighlight - 1, 0); opts.forEach((el, i) => el.classList.toggle('highlighted', i === _reqHighlight)); }
    else if (e.key === 'Enter' && _reqHighlight >= 0) { e.preventDefault(); pickPreset(_reqHighlight); }
    else if (e.key === 'Escape') { drop.style.display = 'none'; }
  }

  // Presets management modal
  function openPresetsModal() {
    const existing = document.getElementById('presets-modal-overlay');
    if (existing) existing.remove();
    const overlay = document.createElement('div');
    overlay.className = 'preset-modal-overlay';
    overlay.id = 'presets-modal-overlay';
    overlay.addEventListener('click', e => { if (e.target === overlay) overlay.remove(); });
    overlay.innerHTML = `
      <div class="preset-modal">
        <div style="font-size:15px;font-weight:700;margin-bottom:14px">⚙️ 管理預設需求</div>
        <div class="preset-list-scroll"><div id="presets-list-inner"></div></div>
        <div class="preset-add-grid" style="margin-top:10px">
          <input class="preset-add-input" id="new-preset-label" placeholder="標題" maxlength="12">
          <input class="preset-add-input" id="new-preset-value" placeholder="填入內容" onkeydown="if(event.key==='Enter')addPresetItem()">

  let _presetDragSrc = -1;

  function _pSaveLabel(i, el) {

  function _pSaveValue(i, el) {

  function _presetShowsBetInfo(requirementValue) {

  function _buildBetInfoHtml(r) {
    if (!r.betInfos) return '';
    const na = v => (v === null || v === undefined || v === '') ? 'n/a' : String(v);
    const rows = r.betInfos.map(b => {
      if (!b) return '';
      const leaguePart = b.leagueName ? `<div class="bet-league-line">${esc(b.leagueName)}</div>` : '';
      const st = b.status !== null && b.status !== undefined ? _jsonStatusMap[b.status] : null;
      const statusBadge = st ? `<span class="bet-status-badge" style="color:${st.color}">${st.label}</span>` : '';
      const line1 = `${na(b.lineType)} / ${na(b.selectionName)}`;
      const hasScore = b.score1 !== null || b.score2 !== null;
      const hasSettlement = b.settlementResult !== null && b.settlementResult !== '';
      const scorePart = hasScore ? `${na(b.score1)}-${na(b.score2)}` : null;
      const settlePart = hasSettlement ? na(b.settlementResult) : null;
      const scoreLine = (scorePart && settlePart) ? `${scorePart} / ${settlePart}`
                      : scorePart ? scorePart
                      : settlePart ? settlePart
                      : null;
      let timePart = '';
      if (b.startDate) {
        const upcoming = _jsonIsUpcoming(b.startDate);
        const stale    = b.status === 0 && _jsonIsStale(b.startDate);
        const timeStr  = _jsonToUtc8(b.startDate);
        if (upcoming)   timePart = `<div class="bet-time-line" style="color:var(--red)">⏰ 尚未開賽 · ${esc(timeStr)}</div>`;
        else if (stale) timePart = `<div class="bet-time-line" style="color:var(--orange)">⚠ &gt;24h · ${esc(timeStr)}</div>`;
        else            timePart = `<div class="bet-time-line">${esc(timeStr)}</div>`;
      }
      return leaguePart
           + `<div class="bet-info-row"><span class="bet-info-line" title="${esc(line1)}">${esc(line1)}</span>${statusBadge}</div>`
           + (scoreLine ? `<div class="bet-score-line">${esc(scoreLine)}</div>` : '')

    }).filter(Boolean).join('');
    return rows ? `<div class="bet-info-block">${rows}</div>` : '';

  // ── Helpers ──
  function getRemaining(r) {
    if (r.completedAt) return -1;
    if (r.stage >= 3) return null; // pending — no countdown
    if (r.stage === 1) return STAGE1_MS - (Date.now() - r.createdAt);
    return STAGE2_MS - (Date.now() - (r.stage2StartAt || r.createdAt));
  }
  function timerClass(ms) {
    if (ms === null)  return 'pending';
    if (ms <= 0)      return 'expired';
    if (ms < 60000)   return 'alert';
    if (ms < 3*60000) return 'warn';
    return 'normal';
  }
  function cardClass(ms) {
    if (ms === null || ms > 0 && ms >= 60000) return ms === null ? '' : ms < 3*60000 ? 'warn' : '';
    if (ms <= 0 || ms < 60000) return 'alert';
    return '';
  }
  function fmtTime(ms) {
    if (ms === null) return '待定';
    if (ms <= 0) return '超時';
    const s = Math.ceil(ms / 1000);
    return `${String(Math.floor(s/60)).padStart(2,'0')}:${String(s%60).padStart(2,'0')}`;
  }
  function fmtDuration(ms) {
    const m = Math.floor(ms/60000), s = Math.floor((ms%60000)/1000);
    return m > 0 ? `${m}m${s}s` : `${s}s`;
  }
  function esc(s) {
    return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
  }
  function sortedActive() {
    return records.filter(r => !r.completedAt && _matchesSearch(r)).sort((a,b) => {
      const ra = getRemaining(a), rb = getRemaining(b);
      if (ra === null && rb === null) return 0;
      if (ra === null) return 1;
      if (rb === null) return -1;
      return ra - rb;
    });
  }
  function sortedDone() {
    return records.filter(r => r.completedAt && _matchesSearch(r)).sort((a,b) => b.completedAt - a.completedAt);
  }

  let _searchQuery = '';
  function _matchesSearch(r) {
    if (!_searchQuery) return true;
    const q = _searchQuery;

  // ── Copy util ──
  function copyText(text, btn) {
    navigator.clipboard.writeText(text).then(() => {
      if (btn) {
        btn.classList.add('copied');
        setTimeout(() => btn.classList.remove('copied'), 1800);
      }
    }).catch(() => {
      const ta = document.createElement('textarea');
      ta.value = text; document.body.appendChild(ta); ta.select();
      document.execCommand('copy'); document.body.removeChild(ta);
      if (btn) {
        btn.classList.add('copied');
        setTimeout(() => btn.classList.remove('copied'), 1800);
      }
    });
  }

  // ── JSON Import ──
  let _jsonImportData = null;

  const _jsonStatusMap = {
    0: { label: 'Opened',    color: 'var(--blue)' },
    1: { label: 'Lost',      color: 'var(--red)' },
    2: { label: 'Won',       color: 'var(--green)' },

  };
  function _jsonStatusBadge(st) {
    const s = _jsonStatusMap[st];
    if (!s) return '';

  }
  function _jsonToUtc8(iso) {
    if (!iso) return '';
    const d = new Date(iso);
    const u8 = new Date(d.getTime() + 8 * 3600000);
    const pad = n => String(n).padStart(2,'0');
    return `${u8.getUTCFullYear()}/${pad(u8.getUTCMonth()+1)}/${pad(u8.getUTCDate())} ${pad(u8.getUTCHours())}:${pad(u8.getUTCMinutes())} (UTC+8)`;
  }
  function _tsToUtc8(ts) {
    const u8 = new Date(ts + 8 * 3600000);
    const pad = n => String(n).padStart(2,'0');
    return `${u8.getUTCFullYear()}-${pad(u8.getUTCMonth()+1)}-${pad(u8.getUTCDate())} ${pad(u8.getUTCHours())}:${pad(u8.getUTCMinutes())} (UTC+8)`;
  }
  let _noteHintsMap = {};
  function _renderNoteHints(eventNames) {
    _noteHintsMap = {};
    for (const name of eventNames) {
      if (!name) continue;
      for (const rec of records) {
        if (!rec.eventNotes) continue;
        const note = rec.eventNotes[name];
        if (!note || _noteHintsMap[name]) continue;
        const ts = rec.eventNoteTimes && rec.eventNoteTimes[name];
        _noteHintsMap[name] = { note, timeStr: ts ? _tsToUtc8(ts) : '' };
      }
    }
    renderFormGroups();
  }
  function showNoteHintPopup(eventName) {

  function _jsonIsUpcoming(iso) {
    if (!iso) return false;

  function _jsonIsStale(iso) {

  function showJsonImportPopup() {

  function _renderJsonPasteState(overlay, successMsg) {
    overlay.innerHTML = `
      <div class="popup-card msg-popup" style="border-color:var(--border);max-width:480px;width:92%">
        <button class="popup-close-btn" onclick="closeMsgPopup()">×</button>

        <textarea class="msg-textarea" id="json-import-ta" placeholder="貼入 JSON..." style="height:140px;resize:vertical"></textarea>
        <div id="json-parse-err" style="display:none;font-size:12px;color:var(--red);margin-top:6px;padding:6px 10px;background:var(--red-bg);border-radius:6px"></div>
        <button class="btn-popup-sec" style="margin-top:10px;width:100%" onclick="closeMsgPopup()">完成</button>
      </div>`;
    const ta = overlay.querySelector('#json-import-ta');
    ta.addEventListener('paste', () => setTimeout(() => _autoParseJson(overlay), 80));
    setTimeout(() => ta.focus(), 50);

  function _autoParseJson(overlay) {
    const ta = document.getElementById('json-import-ta');
    if (!ta) return;
    const raw = ta.value.trim();
    if (!raw) return;

    let data;
    try { data = JSON.parse(raw); } catch(e) {
      const err = document.getElementById('json-parse-err');
      if (err) { err.textContent = '⚠ JSON 格式錯誤，請確認後再試'; err.style.display = 'block'; }
      return;
    }

    const ticketMatch = raw.match(/"SQLTicketId"\s*:\s*(\d+)/);
    const ticketId = ticketMatch ? ticketMatch[1] : String(data.SQLTicketId || '');
    const selections = (data.Selections || []).map(s => ({
      eventName:        s.EventName || '',
      eventId:          s.EventId || '',
      leagueName:       s.LeagueName || s.League || s.CompetitionName || '',
      startDate:        s.StartEventDate || null,
      status:           s.SelectionStatus ?? null,
      lineType:         s.LineTypeName || '',
      selectionName:    s.SelectionName || '',
      score1:           s.Score1 ?? null,
      score2:           s.Score2 ?? null,
      settlementResult: s.SettlementResult || '',
    })).filter(s => s.eventName);

    const err = document.getElementById('json-parse-err');
    if (!ticketId) {
      if (err) { err.textContent = '⚠ 找不到 SQLTicketId'; err.style.display = 'block'; }
      return;
    }
    if (selections.length === 0) {
      if (err) { err.textContent = '⚠ 找不到任何賽事 (EventName)'; err.style.display = 'block'; }
      return;
    }

    _jsonImportData = { ticketId, selections };

    _renderJsonSelectionState(overlay);
  }

  function _renderJsonSelectionState(overlay) {
    if (!_jsonImportData) return;
    const { ticketId, selections } = _jsonImportData;
    const _statusSortOrder = { 0:0, 1:1, 3:2, 4:3, 2:4, 32:5, 15:6 };
    const sorted = selections
      .map((s, i) => ({ ...s, origIdx: i }))
      .sort((a, b) => (_statusSortOrder[a.status] ?? 7) - (_statusSortOrder[b.status] ?? 7));
    overlay.innerHTML = `
      <div class="popup-card msg-popup" style="border-color:var(--border);max-width:480px;width:92%">
        <button class="popup-close-btn" onclick="closeMsgPopup()">×</button>
        <div class="popup-badge info">📥 匯入 JSON</div>
        <div class="popup-title" style="margin-bottom:4px">選擇要帶入的賽事</div>
        <div style="font-size:12px;color:var(--text-muted);margin-bottom:10px">注單號：${esc(ticketId)}</div>
        <div id="json-sel-list" style="max-height:340px;overflow-y:auto;padding-right:2px">
          ${sorted.length > 1 ? `
          <div style="display:flex;align-items:center;gap:6px;margin-bottom:8px;padding-bottom:6px;border-bottom:1px solid var(--border-light)">
            <input type="checkbox" id="json-cb-all" onchange="document.querySelectorAll('[id^=json-cb-]:not(#json-cb-all)').forEach(cb=>cb.checked=this.checked)">
            <label for="json-cb-all" style="font-size:12px;color:var(--text-sec);cursor:pointer">全選</label>
          </div>` : ''}
          ${sorted.map((s) => {
            const upcoming = _jsonIsUpcoming(s.startDate);
            const stale    = s.status === 0 && _jsonIsStale(s.startDate);
            const timeColor = upcoming ? 'var(--red)' : stale ? 'var(--orange)' : '';
            const timeNote  = upcoming ? ' · 尚未開賽' : stale ? ' · 超過24小時' : '';
            const na = v => (v === null || v === undefined || v === '') ? 'n/a' : String(v);
            const betLine = s.lineType || s.selectionName
              ? `${na(s.lineType)} / ${na(s.selectionName)}` : null;
            const hasScore = s.score1 !== null && s.score1 !== undefined;
            const hasSettle = s.settlementResult !== null && s.settlementResult !== '' && s.settlementResult !== undefined;
            const scoreLine = hasScore && hasSettle ? `${na(s.score1)}-${na(s.score2)} / ${na(s.settlementResult)}`
                            : hasScore ? `${na(s.score1)}-${na(s.score2)}` : null;
            const defaultChecked = sorted.length === 1 ? true : s.status === 0;
            return `
            <label class="json-event-item${s.status === 0 ? ' is-opened' : ''}">
              <input type="checkbox" id="json-cb-${s.origIdx}" ${defaultChecked ? 'checked' : ''}>
              <div style="flex:1;min-width:0">
                <div style="display:flex;align-items:center;gap:8px">
                  <span class="json-event-name">${esc(s.eventName)}</span>
                  ${_jsonStatusBadge(s.status)}
                  <span class="json-event-time"${timeColor ? ` style="color:${timeColor}"` : ''}>${_jsonToUtc8(s.startDate)}${timeNote}</span>
                  <button onclick="event.preventDefault();_copyJsonEventName(${s.origIdx})" style="background:none;border:none;font-size:11px;color:var(--text-muted);cursor:pointer;padding:1px 4px;border-radius:3px;flex-shrink:0;line-height:1" title="複製賽事名稱" onmouseover="this.style.color='var(--text-pri)'" onmouseout="this.style.color='var(--text-muted)'">📋</button>
                </div>
                ${betLine ? `<div class="json-bet-line">${esc(betLine)}</div>` : ''}
                ${scoreLine ? `<div class="json-score-line">${esc(scoreLine)}</div>` : ''}
              </div>
            </label>`;
          }).join('')}
        </div>
        <div style="display:flex;gap:8px;margin-top:8px">
          <button class="btn-copy-reply" style="flex:1;margin:0" onclick="_confirmJsonSelection()">✓ 匯入</button>
          <button class="btn-popup-sec" style="flex:1" onclick="_renderJsonPasteState(document.getElementById('popup-overlay'))">← 返回</button>
        </div>
        <button class="btn-popup-sec" style="margin-top:6px;width:100%" onclick="closeMsgPopup()">完成</button>
      </div>`;
  }

  function _copyJsonEventName(idx) {
    const name = _jsonImportData?.selections[idx]?.eventName || '';
    navigator.clipboard.writeText(name).catch(() => {});
  }

  function _confirmJsonSelection() {
    if (!_jsonImportData) return;
    const checked = _jsonImportData.selections
      .map((_, i) => i)
      .filter(i => { const cb = document.getElementById(`json-cb-${i}`); return cb && cb.checked; });
    if (checked.length === 0) { alert('請至少勾選一場賽事'); return; }
    _doJsonImport(document.getElementById('popup-overlay'), checked);
  }

  function _doJsonImport(overlay, indices) {
    if (!_jsonImportData) return;
    const { ticketId, selections } = _jsonImportData;
    const eventNames    = indices.map(i => selections[i].eventName);
    const eventStatuses = indices.map(i => selections[i].status);
    const betInfos      = indices.map(i => ({
      eventId:          selections[i].eventId,
      leagueName:       selections[i].leagueName,
      status:           selections[i].status,
      startDate:        selections[i].startDate,
      lineType:         selections[i].lineType,
      selectionName:    selections[i].selectionName,
      score1:           selections[i].score1,
      score2:           selections[i].score2,
      settlementResult: selections[i].settlementResult,
    }));

    syncGroupValues();

    const matched = formGroups.filter(g =>
      g.eventNames.some(en => en.trim() && eventNames.includes(en.trim()))
    );

    if (matched.length) {
      _showMergeDialog(overlay, matched, ticketId, eventNames, eventStatuses);
      return;
    }

    _applyJsonNewGroup(overlay, ticketId, eventNames, eventStatuses, betInfos);
  }

  function _applyJsonNewGroup(overlay, ticketId, eventNames, eventStatuses, betInfos) {
    const hasData = formGroups.length > 1 ||
      formGroups[0].orderNos.some(o => o.trim()) ||
      formGroups[0].eventNames.some(e => e.trim());
    if (hasData) {
      formGroups.push({ id: `g${++groupCounter}`, orderNos: [ticketId], eventNames, eventStatuses, betInfos });
    } else {
      formGroups[0] = { id: formGroups[0].id, orderNos: [ticketId], eventNames, eventStatuses, betInfos };
    }
    _jsonImportData = null;
    renderFormGroups();
    _renderNoteHints(eventNames);
    _renderJsonPasteState(overlay, `已新增注單 ${ticketId}`);
  }

  function _showMergeDialog(overlay, matched, ticketId, eventNames, eventStatuses) {
    const mergeRows = matched.map((g, mi) => {
      const label = g.eventNames.filter(Boolean).join(' / ');
      const tickets = g.orderNos.filter(Boolean).join(', ');
      return `<button class="btn-popup-sec" style="width:100%;text-align:left;padding:10px 12px;margin-bottom:6px"
        onclick="_doMerge(${mi})">
        <div style="font-size:12px;font-weight:700;color:var(--text-pri);margin-bottom:2px">${esc(label)}</div>
        <div style="font-size:11px;color:var(--text-muted)">${esc(tickets)}</div>
      </button>`;
    }).join('');

    _pendingMergeData = { overlay, matched, ticketId, eventNames, eventStatuses };

    overlay.innerHTML = `
      <div class="popup-card msg-popup" style="border-color:var(--border);max-width:480px;width:92%">
        <button class="popup-close-btn" onclick="closeMsgPopup()">×</button>
        <div class="popup-badge info">📥 匯入 JSON</div>
        <div class="popup-title" style="margin-bottom:4px">發現相同賽事</div>
        <div style="font-size:12px;color:var(--text-muted);margin-bottom:12px">注單 <b>${esc(ticketId)}</b> 含有已存在的賽事，要合併還是獨立新增？</div>
        <div style="font-size:12px;font-weight:700;color:var(--text-sec);margin-bottom:6px">合併到：</div>
        <div style="max-height:200px;overflow-y:auto">${mergeRows}</div>
        <div style="display:flex;gap:8px;margin-top:10px">
          <button class="btn-copy-reply" style="flex:1;margin:0" onclick="_doSeparate()">＋ 獨立新增</button>
          <button class="btn-popup-sec" style="flex:1" onclick="_renderJsonPasteState(document.getElementById('popup-overlay'))">← 返回</button>
        </div>
        <button class="btn-popup-sec" style="margin-top:6px;width:100%" onclick="closeMsgPopup()">完成</button>
      </div>`;
  }

  let _pendingMergeData = null;
  function _doMerge(matchedIdx) {
    if (!_pendingMergeData) return;
    const { overlay, matched, ticketId } = _pendingMergeData;
    const g = matched[matchedIdx];
    if (g && !g.orderNos.includes(ticketId)) g.orderNos.push(ticketId);
    _jsonImportData = null;
    _pendingMergeData = null;
    renderFormGroups();
    _renderJsonPasteState(overlay, `已合併注單 ${ticketId}`);
  }
  function _doSeparate() {
    if (!_pendingMergeData) return;
    const { overlay, ticketId, eventNames, eventStatuses } = _pendingMergeData;
    _pendingMergeData = null;
    _applyJsonNewGroup(overlay, ticketId, eventNames, eventStatuses);
  }

  // ── Record CRUD ──
  // backward-compat helper
  function getEventNames(r) {
    return r.eventNames || (r.eventName ? [r.eventName] : ['']);
  }

  function addRecord(eventNames, orderNos, requirement, group, additionalInfo, lang = null, batchId = null, betInfos = null) {
    const names = (Array.isArray(eventNames) ? eventNames : [eventNames]).map(e => e.trim()).filter(Boolean);
    const r = {
      id:             `r${Date.now()}${Math.random().toString(36).slice(2,5)}`,
      batchId:        batchId,
      eventNames:     names,
      orderNos:       orderNos.map(o => o.trim()).filter(Boolean),
      requirement:    requirement.trim(),
      group:          group.trim(),
      additionalInfo: additionalInfo.trim(),
      lang:           lang,
      betInfos:       betInfos || null,
      createdAt:      Date.now(),
      stage:          1,
      stage2StartAt:  null,
      completedAt:    null,
      eventNotes:     {},
      eventNoteTimes: {},
    };
    records.push(r);
    save();
    schedule(r);
    fullRender();
    return r;
  }

  function markDone(id) {
    const r = records.find(x => x.id === id);
    if (!r || r.completedAt) return;
    r.completedAt = Date.now();
    clearTimeout(timerHandles[id]);
    delete timerHandles[id];
    popupQueue = popupQueue.filter(x => x !== id);
    if (activePopupId === id) dismissPopup();
    selectedIds.delete(id);
    save(); fullRender();
  }

  function markAllDone() {
    const active = records.filter(r => !r.completedAt);
    if (!active.length) return;
    const now = Date.now();
    active.forEach(r => {
      r.completedAt = now;
      clearTimeout(timerHandles[r.id]);
      delete timerHandles[r.id];
      popupQueue = popupQueue.filter(x => x !== r.id);
      if (activePopupId === r.id) dismissPopup();
      selectedIds.delete(r.id);
    });
    save(); fullRender();
  }

  // ── Batch selection ──
  function toggleSelectAll(batchId, checked) {
    const group = records.filter(r => r.batchId === batchId && !r.completedAt);
    group.forEach(r => {
      if (checked) selectedIds.add(r.id);
      else selectedIds.delete(r.id);
      const cb = document.getElementById(`cb-${r.id}`);
      const card = document.getElementById(`card-${r.id}`);
      if (cb) cb.checked = checked;
      if (card) card.classList.toggle('card-selected', checked);
    });
    updateBatchBar(batchId);
  }

  function toggleSelect(id) {
    if (selectedIds.has(id)) selectedIds.delete(id);
    else selectedIds.add(id);
    const cb = document.getElementById(`cb-${id}`);
    const card = document.getElementById(`card-${id}`);
    if (cb) cb.checked = selectedIds.has(id);
    if (card) card.classList.toggle('card-selected', selectedIds.has(id));
    const batchId = getBatchIdFor(id);
    updateBatchBar(batchId);
    // sync select-all checkbox
    if (batchId) {
      const group = records.filter(r => r.batchId === batchId && !r.completedAt);
      const allCb = document.getElementById(`cb-all-${batchId}`);
      if (allCb) allCb.checked = group.length > 0 && group.every(r => selectedIds.has(r.id));
    }
  }

  function getBatchIdFor(id) {
    const r = records.find(x => x.id === id);
    return r ? r.batchId : null;
  }

  function updateBatchBar(batchId) {
    if (!batchId) return;
    const bar = document.getElementById(`batch-bar-${batchId}`);
    if (!bar) return;
    const selected = [...selectedIds].filter(id => {
      const r = records.find(x => x.id === id);
      return r && r.batchId === batchId && !r.completedAt;
    });
    const countEl = bar.querySelector('.batch-bar-count');
    if (countEl) countEl.textContent = selected.length > 0 ? `已選 ${selected.length}` : '';
    bar.querySelectorAll('.batch-bar-btn').forEach(b => b.disabled = selected.length === 0);
  }

  function batchRestartTimer(batchId) {
    const toRestart = [...selectedIds].filter(id => {
      const r = records.find(x => x.id === id);
      return r && r.batchId === batchId && !r.completedAt;
    });
    if (!toRestart.length) return;

    let isFinal = false;
    const allEventNames = [];
    let lang = null, group = '';

    toRestart.forEach(id => {
      const r = records.find(x => x.id === id);
      if (!r) return;
      clearTimeout(timerHandles[id]); delete timerHandles[id];
      if (r.stage === 2) isFinal = true;
      if (r.stage >= 3) { r.stage = 1; r.createdAt = Date.now(); r.stage2StartAt = null; }
      else if (r.stage === 2) { r.stage2StartAt = Date.now(); }
      else { r.createdAt = Date.now(); }
      popupQueue = popupQueue.filter(x => x !== id);
      if (activePopupId === id) { const el = document.getElementById('popup-overlay'); if (el) el.remove(); activePopupId = null; }
      getEventNames(r).forEach(n => { if (n && !allEventNames.includes(n)) allEventNames.push(n); });
      if (!lang && r.lang) lang = r.lang;
      if (!group && r.group) group = r.group;
    });

    save(); fullRender();
    _showBatchRestartReply(toRestart, allEventNames, lang, isFinal);
  }

  let _batchRestartIds = [];
  function _showBatchRestartReply(ids, allEventNames, lang, isFinal) {
    const existing = document.getElementById('popup-overlay');
    if (existing) existing.remove();
    _batchRestartIds = ids;
    const name = allEventNames.join('\n');
    const agentSuffix = getAgentName() ? ` - ${getAgentName()}` : '';
    _replyTexts = isFinal ? {
      en: `${name}\nWe've escalated to the relevant team for investigation and we will keep you posted. Thank you for your patience.${agentSuffix}`,
      zh: `${name}\n已为您提交相关单位确认，若有进一步更新，将会立即与您告知，提前感谢您的耐心。${getAgentName() ? `- ${getAgentName()}` : ''}`,
      kr: `${name}\n해당 팀에 조사를 요청했으며, 진행 상황을 계속 알려드리겠습니다. 기다려 주셔서 감사합니다.${agentSuffix}`,
    } : {
      en: `${name}\nOne moment. We've submitted it to the relevant department.${agentSuffix}`,
      zh: `${name}\n已为您反馈至相关单位查询中，请您稍候。${getAgentName() ? `- ${getAgentName()}` : ''}`,
      kr: `${name}\n잠시만요. 관련 부서에 제출했습니다.${agentSuffix}`,
    };
    const overlay = document.createElement('div');
    overlay.id = 'popup-overlay';
    overlay.className = 'popup-overlay';
    overlay.innerHTML = `
      <div class="popup-card ${isFinal ? 'stage2' : 'stage1'}">
        <button class="popup-close-btn" onclick="dismissPopup()">×</button>
        <div class="popup-badge ${isFinal ? 'final' : 'first'}">${isFinal ? '⚠️ 最終提醒' : '🔔 第一次提醒'}</div>
        <div class="popup-event-name" style="white-space:pre-line">🏆 ${esc(name)}</div>
        <div class="reply-rows">
          <div class="reply-row${lang === 'en' ? ' lang-highlight' : (lang ? ' lang-dim' : '')}">
            <span class="reply-row-text">${esc(_replyTexts.en)}</span>
            <button class="btn-copy-inline" onclick="copyReply('en',this)" title="Copy">📋</button>
          </div>
          <div class="reply-row${lang === 'zh' ? ' lang-highlight' : (lang ? ' lang-dim' : '')}">
            <span class="reply-row-text">${esc(_replyTexts.zh)}</span>
            <button class="btn-copy-inline" onclick="copyReply('zh',this)" title="複製">📋</button>
          </div>
          <div class="reply-row${lang === 'kr' ? ' lang-highlight' : (lang ? ' lang-dim' : '')}">
            <span class="reply-row-text">${esc(_replyTexts.kr)}</span>
            <button class="btn-copy-inline" onclick="copyReply('kr',this)" title="복사">📋</button>
          </div>
        </div>
        <div class="popup-btns">
          <button class="btn-popup-done" onclick="_batchMarkDoneFromPopup()">✓ 已回覆</button>
          <button class="btn-popup-sec" onclick="${isFinal ? '_batchDismissAndPend()' : '_batchAckStage1()'}">${isFinal ? '關閉' : '繼續計時'}</button>
        </div>
      </div>`;
    document.body.appendChild(overlay);
    attachOverlayClose(overlay);
    playSound();
  }

  function _batchMarkDoneFromPopup() {
    const now = Date.now();
    _batchRestartIds.forEach(id => {
      const r = records.find(x => x.id === id);
      if (!r || r.completedAt) return;
      r.completedAt = now;
      clearTimeout(timerHandles[id]); delete timerHandles[id];
      popupQueue = popupQueue.filter(x => x !== id);
      selectedIds.delete(id);
    });
    _batchRestartIds = [];
    save(); dismissPopup(); fullRender();
  }

  function _batchAckStage1() {
    _batchRestartIds.forEach(id => {
      const r = records.find(x => x.id === id);
      if (!r || r.stage !== 1) return;
      r.stage = 2; r.stage2StartAt = Date.now();
      schedule(r);
    });
    _batchRestartIds = [];
    save(); dismissPopup(); fullRender();
  }

  function _batchDismissAndPend() {
    _batchRestartIds.forEach(id => {
      const r = records.find(x => x.id === id);
      if (!r || r.stage !== 2) return;
      r.stage = 3;
      clearTimeout(timerHandles[id]); delete timerHandles[id];
    });
    _batchRestartIds = [];
    save(); fullRender(); dismissPopup();
  }

  function batchMarkDone(batchId) {
    const toMark = [...selectedIds].filter(id => {
      const r = records.find(x => x.id === id);
      return r && r.batchId === batchId && !r.completedAt;
    });
    toMark.forEach(id => {
      const r = records.find(x => x.id === id);
      if (!r) return;
      r.completedAt = Date.now();
      clearTimeout(timerHandles[id]); delete timerHandles[id];
      popupQueue = popupQueue.filter(x => x !== id);
      if (activePopupId === id) dismissPopup();
      selectedIds.delete(id);
    });
    save(); fullRender();
  }

  function showBatchMsgPopup(batchId) {
    const toProcess = [...selectedIds].filter(id => {
      const r = records.find(x => x.id === id);
      return r && r.batchId === batchId && !r.completedAt;
    }).map(id => records.find(x => x.id === id));
    if (!toProcess.length) return;

    const existing = document.getElementById('popup-overlay');
    if (existing) existing.remove();
    const overlay = document.createElement('div');
    overlay.id = 'popup-overlay';
    overlay.className = 'popup-overlay';
    overlay.innerHTML = `
      <div class="popup-card msg-popup" style="border-color:var(--border);max-width:460px;width:92%">
        <button class="popup-close-btn" onclick="closeMsgPopup()">×</button>
        <div class="popup-badge info">📝 批量訊息</div>
        <div class="popup-title" style="margin-bottom:14px">共 ${toProcess.length} 場賽事</div>
        ${toProcess.map(r => {
          const names = getEventNames(r);
          const note = (r.eventNotes && names[0]) ? (r.eventNotes[names[0]] || '') : '';
          return `<div class="batch-msg-item">
            <div class="batch-msg-label">🏆 ${esc(names.join(' / '))}</div>
            <textarea class="msg-textarea" id="batch-ta-${r.id}" placeholder="輸入賽事訊息...">${esc(note)}</textarea>
          </div>`;
        }).join('')}
        <div style="display:flex;gap:8px;margin-top:4px">
          <button class="btn-copy-reply" style="flex:1;margin-bottom:0" onclick="saveCopyBatchMsg('${batchId}',this)">📋 複製全部</button>
          <button class="btn-copy-reply" style="flex:1;margin-bottom:0;background:var(--green-bg);border-color:var(--green-border);color:var(--green)" onclick="saveCopyBatchMsg('${batchId}',this,true)">✓ 複製並完成</button>
        </div>
      </div>`;
    document.body.appendChild(overlay);
    attachOverlayClose(overlay);
    const first = overlay.querySelector('.msg-textarea');
    if (first) first.focus();
  }

  function saveCopyBatchMsg(batchId, btn, markAllDone = false) {
    const toProcess = [...selectedIds].filter(id => {
      const r = records.find(x => x.id === id);
      return r && r.batchId === batchId && !r.completedAt;
    }).map(id => records.find(x => x.id === id));

    const lines = [];
    toProcess.forEach(r => {
      const names = getEventNames(r);
      const ta = document.getElementById(`batch-ta-${r.id}`);
      const msg = ta ? ta.value.trim() : '';
      if (!r.eventNotes) r.eventNotes = {};
      if (!r.eventNoteTimes) r.eventNoteTimes = {};
      const now = Date.now();
      names.forEach(n => { r.eventNotes[n] = msg; if (msg) r.eventNoteTimes[n] = now; });
      lines.push(`${names.join('\n')}${msg ? '\n' + msg : ''}`);
    });
    save();
    copyText(lines.join('\n\n'), btn);
    if (markAllDone) {
      setTimeout(() => {
        toProcess.forEach(r => {
          r.completedAt = Date.now();
          clearTimeout(timerHandles[r.id]); delete timerHandles[r.id];
          popupQueue = popupQueue.filter(x => x !== r.id);
          if (activePopupId === r.id) dismissPopup();
          selectedIds.delete(r.id);
        });
        save(); fullRender();
        closeMsgPopup();
      }, 500);
    }
  }

  function deleteRecord(id) {
    records = records.filter(x => x.id !== id);
    clearTimeout(timerHandles[id]);
    delete timerHandles[id];
    popupQueue = popupQueue.filter(x => x !== id);
    if (activePopupId === id) dismissPopup();
    save(); fullRender();
  }

  function ackStage1(id) {
    const r = records.find(x => x.id === id);
    if (!r || r.stage !== 1) return;
    r.stage = 2; r.stage2StartAt = Date.now();
    save(); dismissPopup(); schedule(r); fullRender();
  }

  function dismissAndPend(id) {
    const r = records.find(x => x.id === id);
    if (r && r.stage === 2) {
      r.stage = 3;
      clearTimeout(timerHandles[id]);
      delete timerHandles[id];
      save(); fullRender();
    }
    dismissPopup();
  }

  function restartTimer(id) {
    const r = records.find(x => x.id === id);
    if (!r) return;
    clearTimeout(timerHandles[id]);
    delete timerHandles[id];
    // If pending (stage 3), reset to stage 1 first
    if (r.stage >= 3) {
      r.stage = 1; r.createdAt = Date.now(); r.stage2StartAt = null;
      save();
    }
    // Clear from queue and immediately show current stage popup
    popupQueue = popupQueue.filter(x => x !== id);
    if (activePopupId === id) { const el = document.getElementById('popup-overlay'); if (el) el.remove(); activePopupId = null; }
    fullRender();
    activePopupId = id;
    renderPopup(r);
    playSound();
    sendBrowserNotif(r);
  }

  // ── Timer scheduling ──
  function schedule(r) {
    if (r.completedAt || r.stage >= 3) return;
    clearTimeout(timerHandles[r.id]);
    const remaining = getRemaining(r);
    if (remaining <= 0) enqueue(r.id);
    else timerHandles[r.id] = setTimeout(() => enqueue(r.id), remaining);
  }
  function scheduleAll() { records.filter(r => !r.completedAt).forEach(schedule); }

  // ── Popup queue ──
  function enqueue(id) {
    if (popupQueue.includes(id) || activePopupId === id) return;
    const r = records.find(x => x.id === id);
    if (!r || r.completedAt) return;
    popupQueue.push(id);
    processQueue();
  }
  function processQueue() {
    if (activePopupId || popupQueue.length === 0) return;
    const id = popupQueue.shift();
    const r  = records.find(x => x.id === id);
    if (!r || r.completedAt) { processQueue(); return; }
    activePopupId = id;
    renderPopup(r);
    playSound();
    sendBrowserNotif(r);
  }
  function dismissPopup() {
    activePopupId = null;
    const el = document.getElementById('popup-overlay');
    if (el) el.remove();
    setTimeout(processQueue, 200);
  }

  // ── Sound ──
  function playSound() {
    try {
      const ctx = new (window.AudioContext || window.webkitAudioContext)();
      const beep = (freq, start, dur, vol=0.28) => {
        const osc = ctx.createOscillator(), gain = ctx.createGain();
        osc.connect(gain); gain.connect(ctx.destination);
        osc.type = 'sine'; osc.frequency.value = freq;
        gain.gain.setValueAtTime(vol, ctx.currentTime + start);
        gain.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + start + dur);
        osc.start(ctx.currentTime + start);
        osc.stop(ctx.currentTime + start + dur + 0.01);
      };
      beep(880,0.00,0.12); beep(1100,0.18,0.12); beep(880,0.36,0.22);
    } catch(e) {}
  }

          <button style="flex:1;padding:9px;background:var(--orange-bg);border:1px solid rgba(196,149,106,0.4);border-radius:8px;font-size:13px;font-weight:600;color:var(--orange);cursor:pointer" onclick="confirmSettlement()">✅ 結算並清除</button>

  function confirmSettlement() {
    const done = sortedDone();
    if (done.length === 0) { dismissPopup(); return; }
    if (!confirm(`確定要結算並清除 ${done.length} 筆完成記錄嗎？此操作不可復原。`)) return;
    const doneIds = new Set(done.map(r => r.id));
    records = records.filter(r => !doneIds.has(r.id));
    save();
    fullRender();
    dismissPopup();

  // ── Notifications ──
  async function requestNotifPermission() {
    if (!('Notification' in window)) { alert('此瀏覽器不支援桌面通知'); return; }
    const result = await Notification.requestPermission();
    updateNotifBtn();
    if (result === 'granted') new Notification('✅ 通知已開啟', { body: '提醒出現時會同步通知您' });
  }
  function updateNotifBtn() {
    const btn = document.getElementById('notif-btn');
    if (!btn) return;
    if (!('Notification' in window)) { btn.style.display='none'; return; }
    if (Notification.permission === 'granted') {
      btn.textContent = '🔔 通知已開啟'; btn.classList.add('granted'); btn.disabled = true;
    } else {
      btn.textContent = '🔔 開啟通知'; btn.classList.remove('granted'); btn.disabled = false;
    }
  }
  function sendBrowserNotif(r) {
    if (!('Notification' in window) || Notification.permission !== 'granted') return;
    const stage = r.stage === 1 ? '第一次提醒' : '最終提醒！';
    const n = new Notification(`${stage} ─ ${getEventNames(r)[0]}`, {
      body: `需求：${r.requirement}\n群組：${r.group}`,
    });
    setTimeout(() => n.close(), 2000);
  }

  function renderActive() {
    const active = sortedActive();
    const el = document.getElementById('active-records');
    const badge = document.getElementById('active-count');
    badge.textContent = active.length;
    badge.style.display = active.length ? 'inline-flex' : 'none';
    if (active.length === 0) { el.innerHTML = '<div class="empty-state">目前沒有待處理的記錄</div>'; return; }

    // separate batch vs solo records
    const batches = {};
    const solos = [];
    active.forEach(r => {
      if (r.batchId) {
        if (!batches[r.batchId]) batches[r.batchId] = [];
        batches[r.batchId].push(r);
      } else {
        solos.push(r);
      }
    });

    // sort key: min remaining time in batch / solo remaining (null=pending → Infinity)
    const sortKey = ms => ms === null ? Infinity : ms;
    const batchMinMs = bid => Math.min(...batches[bid].map(r => sortKey(getRemaining(r))));

    // interleave batches and solos sorted by urgency
    const items = [
      ...Object.keys(batches).map(bid => ({ type: 'batch', bid, ms: batchMinMs(bid) })),
      ...solos.map(r => ({ type: 'solo', r, ms: sortKey(getRemaining(r)) })),
    ].sort((a, b) => a.ms - b.ms);

    const parts = [];
    items.forEach(item => {
      if (item.type === 'solo') { parts.push(renderCardHtml(item.r, false)); return; }
      const bid = item.bid;
      const group = batches[bid];
      const selCount = group.filter(r => selectedIds.has(r.id)).length;
      const grpName = group[0].group;
      const allChecked = group.length > 0 && group.every(r => selectedIds.has(r.id));
      parts.push(`
        <div class="batch-group" id="batch-${bid}">
          <div class="batch-group-header">
            <input type="checkbox" class="batch-cb" id="cb-all-${bid}" ${allChecked ? 'checked' : ''} onchange="toggleSelectAll('${bid}',this.checked)" title="全選">

            <span class="batch-group-count">${group.length} 張</span>

              <button class="batch-bar-btn batch-bar-restart" ${selCount === 0 ? 'disabled' : ''} onclick="batchRestartTimer('${bid}')">↺ 重新計時</button>
              <button class="batch-bar-btn batch-bar-msg"     ${selCount === 0 ? 'disabled' : ''} onclick="showBatchMsgPopup('${bid}')">📝 批量訊息</button>
            </div>
          </div>
          ${group.map(r => renderCardHtml(r, true)).join('')}
        </div>`);
    });

    el.innerHTML = parts.join('');
  }

  function saveCopyMsg(id, eventIdx, btn) {
    const r = records.find(x => x.id === id);
    if (!r) return;
    const names = getEventNames(r);
    const eventName = names[eventIdx] || names[0] || '';
    if (!r.eventNotes) r.eventNotes = {};
    if (!r.eventNoteTimes) r.eventNoteTimes = {};
    const ta = document.getElementById(`msg-textarea-${id}-${eventIdx}`);
    r.eventNotes[eventName] = ta ? ta.value : '';
    if (r.eventNotes[eventName]) r.eventNoteTimes[eventName] = Date.now();
    save();
    const betInfo = r.betInfos && r.betInfos[eventIdx];
    const eventId = betInfo && betInfo.eventId ? betInfo.eventId : '';
    const parts = [eventName];
    if (eventId) parts.push(`EventId: ${eventId}`);
    if (r.eventNotes[eventName]) parts.push(r.eventNotes[eventName]);
    copyText(parts.join('\n'), btn);

  function buildSummaryText(groups, requirement, group, additionalInfo) {
    const groupLines = groups.map(g => {
      const lines = [];
      g.orderNos.filter(Boolean).forEach(o => lines.push(o));
      (g.eventNames || []).filter(Boolean).forEach(e => lines.push(e));
      return lines.join('\n');
    }).filter(Boolean);
    const tail = [requirement, group, additionalInfo].filter(Boolean).join('\n');
    if (groupLines.length === 0) return tail;
    const last = groupLines[groupLines.length - 1] + (tail ? '\n' + tail : '');
    return [...groupLines.slice(0, -1), last].join('\n\n');
  }

  function getRecordSummary(id) {
    const r = records.find(x => x.id === id);
    if (!r) return '';
    const parts = [...r.orderNos.filter(Boolean), ...getEventNames(r), r.requirement, r.group];
    if (r.additionalInfo) parts.push(r.additionalInfo);
    return parts.join('\n');
  }
