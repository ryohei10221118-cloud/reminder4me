    const overlay = document.createElement('div');
    overlay.id = 'popup-overlay';
    overlay.className = 'popup-overlay';
    overlay.innerHTML = `
      <div class="popup-card submit-popup">
        <button class="popup-close-btn" onclick="dismissPopup()">×</button>
        <div class="popup-badge success">📋 概要</div>
        <div class="submit-content-box">${esc(content)}</div>
        <button class="btn-copy-reply" onclick="copyAndClose(_pendingCopy,this)">📋 複製內容</button>
      </div>`;
    document.body.appendChild(overlay);
    attachOverlayClose(overlay);
  }

  function showSubmitPopup(groups, requirement, group, additionalInfo) {
    const content = buildSummaryText(groups, requirement, group, additionalInfo);
    _pendingCopy = content;

    const existing = document.getElementById('popup-overlay');
    if (existing) existing.remove();
    const overlay = document.createElement('div');
    overlay.id = 'popup-overlay';
    overlay.className = 'popup-overlay';
    overlay.innerHTML = `
      <div class="popup-card submit-popup">
        <button class="popup-close-btn" onclick="dismissPopup()">×</button>
        <div class="popup-badge success">✅ 已建立計時器</div>
        <div class="submit-content-box">${esc(content)}</div>
        <button class="btn-copy-reply" onclick="copyAndClose(_pendingCopy,this)">📋 複製內容</button>
      </div>`;
    document.body.appendChild(overlay);
    attachOverlayClose(overlay);
  }

  // ── Tick timers ──
  function tickTimers() {
    sortedActive().forEach(r => {
      const ms = getRemaining(r);
      if (ms === null) return; // pending — no tick needed
      const timerEl = document.getElementById(`timer-${r.id}`);
      const cardEl  = document.getElementById(`card-${r.id}`);
      if (!timerEl) return;
      const tc = timerClass(ms);
      timerEl.className = `timer-box ${tc}`;
      timerEl.querySelector('.t-time').textContent = fmtTime(ms);
      if (cardEl) cardEl.className = `record-card ${cardClass(ms)}`;
    });
    updateHeaderBadge();
  }

  function updateHeaderBadge() {
    const active = sortedActive();
    const badge  = document.getElementById('header-badge');
    if (!badge) return;
    badge.textContent = active.length;
    badge.classList.toggle('show', active.length > 0);
    badge.style.background = active.some(r => { const ms = getRemaining(r); return ms !== null && ms <= 0; }) ? '#a05555' : 'var(--red)';
  }

  // ── Form submit ──
  function setFormLang(lang) {
    formLang = formLang === lang ? null : lang;
    document.querySelectorAll('.lang-sel-btn').forEach(b => b.classList.toggle('active', b.dataset.lang === formLang));
  }

  function handleSubmit(e) {
    e.preventDefault();
    syncGroupValues();
    const req  = document.getElementById('f-req').value.trim();
    const grp  = document.getElementById('f-group').value.trim();
    const info = document.getElementById('f-info').value.trim();
    if (!req || !grp) return;

    // Flatten: each (group × eventName) → one record
    const recordsToAdd = [];
    formGroups.forEach(g => {
      const validNames = g.eventNames.map(e => e.trim()).filter(Boolean);
      if (validNames.length) recordsToAdd.push({ orderNos: g.orderNos, eventNames: validNames, betInfos: g.betInfos || null });
    });
    if (!recordsToAdd.length) { alert('請輸入至少一個賽事名稱'); return; }

    const batchId = recordsToAdd.length > 1 ? `b${Date.now()}` : null;
    recordsToAdd.forEach(g => addRecord(g.eventNames, g.orderNos, req, grp, info, formLang, batchId, g.betInfos));

    showSubmitPopup(recordsToAdd, req, grp, info);

    formGroups = [{ id: `g${++groupCounter}`, orderNos: [''], eventNames: [''] }];
    _noteHintsMap = {};
    renderFormGroups();
    document.getElementById('f-req').value   = '';
    document.getElementById('f-group').value = '';
    document.getElementById('f-info').value  = '';
  }

  // ── Toggle completed ──
  function toggleCompleted() {
    const list    = document.getElementById('completed-list');
    const chevron = document.getElementById('chevron');
    const isOpen  = list.style.display !== 'none';
    list.style.display = isOpen ? 'none' : 'block';
    chevron.classList.toggle('open', !isOpen);
  }

  // ── Init ──
  function init() {
    load(); loadAgentName(); scheduleAll(); fullRender(); updateNotifBtn();
    initFormGroups();
    setInterval(tickTimers, 1000);
  }
  document.addEventListener('DOMContentLoaded', init);

  document.addEventListener('click', e => {
    if (!e.target.closest('#req-combobox')) {
      const drop = document.getElementById('req-dropdown');
      if (drop) drop.style.display = 'none';
    }
  });

  // Back-to-top button
  window.addEventListener('scroll', () => {
    const btn = document.getElementById('back-to-top');
    if (btn) btn.classList.toggle('show', window.scrollY > window.innerHeight * 0.8);
  });

  // ── Event Message Compose ──
  let _msgEvents = [];

  function showMsgComposePopup() {
    _msgEvents = [];
    const existing = document.getElementById('msg-compose-overlay');
    if (existing) existing.remove();
    const overlay = document.createElement('div');
    overlay.className = 'popup-overlay';
    overlay.id = 'msg-compose-overlay';
    document.body.appendChild(overlay);
    overlay.addEventListener('mousedown', e => { if (e.target === overlay) _closeMsgCompose(); });
    _renderMsgCompose(overlay);
  }

  function _closeMsgCompose() {
    const el = document.getElementById('msg-compose-overlay');
    if (el) el.remove();
  }

  function _renderMsgCompose(overlay) {
    const sorted = _msgEvents
      .map((ev, origIdx) => ({ ...ev, origIdx }))
      .sort((a, b) => {
        const aWon = a.status === 2;
        const bWon = b.status === 2;
        if (aWon !== bWon) return aWon ? 1 : -1;
        return a.origIdx - b.origIdx;
      });
    const eventRows = sorted.map((ev) => {
      const i = ev.origIdx;
      const isWon = ev.status === 2;
      const st = _jsonStatusMap[ev.status];
      const borderStyle = !isWon && st ? `border-left:3px solid ${st.color};` : '';
      const statusBadge = st ? `<span style="font-size:11px;font-weight:600;color:${st.color};white-space:nowrap">${st.label}</span>` : '';
      return `
      <div class="msg-event-row" id="msg-ev-${i}" style="${borderStyle}">
        <div class="msg-event-header">
          <span class="msg-event-name">${esc(ev.eventName)}</span>
          ${statusBadge}
          <span class="msg-event-id">EventId: ${esc(String(ev.eventId))}</span>
          <button class="msg-event-remove" onclick="_removeMsgEvent(${i})" title="移除">×</button>
        </div>
        <textarea class="msg-event-notes" id="msg-notes-${i}" placeholder="備註（留空則不複製此賽事）...">${esc(ev.notes || '')}</textarea>
      </div>`;
    }).join('');

    overlay.innerHTML = `
      <div class="popup-card msg-popup" style="border-color:var(--border);max-width:520px;width:92%;max-height:88vh;display:flex;flex-direction:column;padding:0;overflow:hidden">
        <div style="display:flex;align-items:center;justify-content:space-between;padding:16px 20px;border-bottom:1px solid var(--border-light);flex-shrink:0">
          <div style="font-size:15px;font-weight:700;color:var(--text-pri)">📨 賽事訊息產生器</div>
          <button onclick="_closeMsgCompose()" style="background:none;border:none;font-size:20px;color:var(--text-muted);cursor:pointer;line-height:1;padding:2px 4px;border-radius:5px" onmouseover="this.style.color='var(--text-pri)'" onmouseout="this.style.color='var(--text-muted)'">×</button>
        </div>
        <div style="padding:16px 20px 20px;display:flex;flex-direction:column;flex:1;overflow:hidden;min-height:0">
          <textarea class="msg-textarea" id="msg-compose-ta" placeholder="貼入注單 JSON（可連續貼多張）..." style="height:88px;flex-shrink:0;margin-bottom:6px"></textarea>
          <div id="msg-parse-err" style="display:none;font-size:12px;color:var(--red);margin-bottom:8px;padding:6px 10px;background:var(--red-bg);border-radius:6px;flex-shrink:0"></div>
          ${_msgEvents.length > 0 ? `
            <div style="font-size:11px;color:var(--text-muted);text-transform:uppercase;letter-spacing:.6px;margin-bottom:8px;flex-shrink:0">${_msgEvents.length} 場賽事</div>
            <div id="msg-events-list" style="display:flex;flex-direction:column;gap:10px;overflow-y:auto;margin-bottom:14px;flex:1">${eventRows}</div>
            <button class="btn-copy-reply" style="width:100%;margin:0;flex-shrink:0" onclick="_copyMsgCompose()">📋 複製</button>
          ` : `
            <div style="text-align:center;padding:28px 0 8px;color:var(--text-muted);font-size:13px;flex:1">貼入 JSON 後賽事會自動出現在這裡</div>
          `}
        </div>
      </div>`;

    const ta = overlay.querySelector('#msg-compose-ta');
    ta.addEventListener('paste', () => setTimeout(() => _parseMsgJson(overlay), 80));
    setTimeout(() => ta.focus(), 50);
  }

  function _parseMsgJson(overlay) {
    const ta = document.getElementById('msg-compose-ta');
    if (!ta) return;
    const raw = ta.value.trim();
    if (!raw) return;
    _saveCurrentMsgNotes();
    const err = document.getElementById('msg-parse-err');
    let data;
    try { data = JSON.parse(raw); } catch(e) {
      if (err) { err.textContent = '⚠ JSON 格式錯誤，請確認後再試'; err.style.display = 'block'; }
      return;
    }
    const selections = (data.Selections || [])
      .map(s => ({ eventName: s.EventName || '', eventId: String(s.EventId || ''), status: s.SelectionStatus ?? null }))
      .filter(s => s.eventName && s.eventId);
    if (selections.length === 0) {
      if (err) { err.textContent = '⚠ 找不到任何賽事 (EventName / EventId)'; err.style.display = 'block'; }
      return;
    }
    const existingIds = new Set(_msgEvents.map(e => String(e.eventId)));
    selections.forEach(s => {
      if (!existingIds.has(s.eventId)) _msgEvents.push({ eventName: s.eventName, eventId: s.eventId, status: s.status, notes: '' });
    });
    if (err) err.style.display = 'none';
    ta.value = '';
    _renderMsgCompose(overlay);
  }

  function _saveCurrentMsgNotes() {
    _msgEvents.forEach((ev, i) => {
      const ta = document.getElementById(`msg-notes-${i}`);
      if (ta) ev.notes = ta.value;
    });
  }

  function _removeMsgEvent(idx) {
    _saveCurrentMsgNotes();
    _msgEvents.splice(idx, 1);
    const overlay = document.getElementById('msg-compose-overlay');
    if (overlay) _renderMsgCompose(overlay);
  }

  function _copyMsgCompose() {
    _saveCurrentMsgNotes();
    const parts = _msgEvents
      .filter(ev => ev.notes && ev.notes.trim())
      .map(ev => `${ev.eventName}\nEventId: ${ev.eventId}\n${ev.notes.trim()}`);
    if (!parts.length) { alert('請至少填寫一筆備註'); return; }
    const text = parts.join('\n\n');
    navigator.clipboard.writeText(text).then(() => _closeMsgCompose()).catch(() => {
      const ta = document.createElement('textarea');
      ta.value = text;
      Object.assign(ta.style, { position: 'fixed', opacity: '0', top: '0', left: '0' });
      document.body.appendChild(ta);
      ta.select();
      document.execCommand('copy');
      ta.remove();
      _closeMsgCompose();
    });
  }
</script>
</body>
</html>
